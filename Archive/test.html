<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>NEXUS - FIFO 재고 마감 [v2.0]</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; margin: 0; overflow: hidden; user-select: none; }
        input, textarea { user-select: auto; }
        ::-webkit-scrollbar { width: 8px; height: 8px; } 
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* 🌟 숫자 입력창 스피너 제거 */
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .pulse-border { animation: pulseBorder 1.5s infinite; }
        @keyframes pulseBorder { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); } 70% { box-shadow: 0 0 0 4px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .slide-in-right { animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 스크롤 하이라이트 효과 */
        .highlight-row { animation: highlightAnim 2s ease-out forwards; }
        @keyframes highlightAnim {
            0% { background-color: rgba(254, 240, 138, 1); }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback, useRef } = React;

        // ==========================================
        // 🧩 1. 유틸리티 함수 및 엑셀 파서
        // ==========================================
        const STORAGE_KEYS = {
            MASTER_DB: 'merchMaster_v870', CLOUD_URL: 'skuSyncCloudUrl_v6', SYNC_TRIGGER: 'merchMaster_sync_trigger',
            HISTORY_DB: 'merchHistory_v870', UNSYNCED_MASTER: 'merchUnsyncedMaster_v1', UNSYNCED_HISTORY: 'merchUnsyncedHistory_v1',
            UNSYNCED_DICT: 'merchUnsyncedDict_v1',
            LAST_CLOSING: 'nexus_last_detailed_closing_v1'
        };

        const safeNum = (v) => (!v ? 0 : Number(String(v).replace(/,/g, '').replace(/[^\d.-]/g, '')) || 0);
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const safeStr = (val, def = '') => (val !== undefined && val !== null && val !== '') ? String(val) : def;

        let idbInstance = null;
        const initIDB = () => new Promise((resolve, reject) => {
            if (idbInstance) return resolve(idbInstance);
            const request = indexedDB.open('MerchOpsDB', 1);
            request.onupgradeneeded = (e) => { if (!e.target.result.objectStoreNames.contains('store')) e.target.result.createObjectStore('store'); };
            request.onsuccess = () => { idbInstance = request.result; resolve(idbInstance); };
            request.onerror = () => reject(request.error);
        });

        const getIDB = async (key) => {
            const db = await initIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('store', 'readonly');
                const req = tx.objectStore('store').get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(tx.error);
            });
        };

        const setIDB = async (key, val) => {
            const db = await initIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('store', 'readwrite');
                tx.objectStore('store').put(val, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        };

        const SafeIcon = React.memo(function SafeIconComponent({ name, size = 18, className = "" }) {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const kebabName = name.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();
                    const possibleNames = [kebabName, name, name==='cloud-download'?'download-cloud':name, name==='cloud-upload'?'upload-cloud':name, name==='bar-chart-3'?'bar-chart':name];
                    for (const pName of possibleNames) {
                        if (window.lucide.icons[pName]) { setSvg(window.lucide.icons[pName].toSvg({ width: size, height: size, class: className, 'stroke-width': 2.5 })); return; }
                    }
                }
            }, [name, size, className]);
            if (!svg) {
                const faMap = { 'cloud-download':'fa-cloud-download-alt', 'cloud-upload':'fa-cloud-upload-alt', 'settings':'fa-cogs', 'layout-dashboard':'fa-th-large', 'package-search':'fa-box-open', 'file-spreadsheet':'fa-table', 'zap':'fa-bolt', 'truck':'fa-truck', 'boxes':'fa-boxes', 'bar-chart-3':'fa-chart-bar', 'check-circle-2':'fa-check-circle', 'x':'fa-times', 'database':'fa-database', 'upload':'fa-upload', 'pie-chart':'fa-chart-pie', 'shopping-cart':'fa-shopping-cart', 'users':'fa-users', 'megaphone':'fa-bullhorn', 'book-open':'fa-address-book', 'shopping-bag':'fa-shopping-bag', 'credit-card':'fa-credit-card', 'line-chart':'fa-chart-line', 'printer':'fa-print', 'search':'fa-search', 'plus':'fa-plus', 'trash-alt':'fa-trash-alt', 'edit':'fa-edit', 'save':'fa-save', 'link':'fa-link', 'folder-open':'fa-folder-open', 'folder-plus':'fa-folder-plus', 'magic':'fa-magic', 'clipboard-check':'fa-clipboard-check', 'hand-point-right':'fa-hand-point-right', 'arrow-right':'fa-arrow-right', 'arrow-up':'fa-arrow-up', 'arrow-down':'fa-arrow-down', 'equals':'fa-equals', 'eraser':'fa-eraser' };
                return <i className={`fas ${faMap[name] || `fa-${name}`} ${className}`} style={{ fontSize: size }} />;
            }
            return <span className="inline-flex shrink-0 items-center justify-center" dangerouslySetInnerHTML={{ __html: svg }} />;
        });

        const parseExcel = (file, type) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    const jsonAll = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
                    
                    let headerIdx = -1;
                    const keywordMap = {
                        purchase: ['일자', '코드', '단가', '수량'],
                        sales: ['품목코드', '출고']
                    };
                    const keywords = keywordMap[type] || [];

                    for (let i = 0; i < Math.min(20, jsonAll.length); i++) {
                        const rowStr = jsonAll[i].join('').replace(/\s/g, '');
                        if (keywords.some(kw => rowStr.includes(kw))) { headerIdx = i; break; }
                    }

                    if (headerIdx === -1) return resolve([]);
                    
                    const headers = jsonAll[headerIdx];
                    const parsedData = [];
                    for (let i = headerIdx + 1; i < jsonAll.length; i++) {
                        const row = jsonAll[i];
                        if (!row || row.join('').trim() === '') continue;
                        const obj = { _raw: {} };
                        headers.forEach((h, idx) => { 
                            if (h) {
                                const key = String(h).trim();
                                obj[key] = row[idx]; 
                                obj._raw[key] = row[idx];
                            }
                        });
                        parsedData.push(obj);
                    }
                    resolve(parsedData);
                } catch (err) { reject(err); }
            };
            reader.readAsArrayBuffer(file);
        });

        // ==========================================
        // 🧩 2. 핵심 로직: FIFO 엔진 훅 (+ 단가 역산 알고리즘)
        // ==========================================
        const useFIFOEngine = (masterProducts = {}) => {
            const [cloudStock, setCloudStock] = useState([]);      
            const [purchaseData, setPurchaseData] = useState([]);  
            const [salesData, setSalesData] = useState([]);        
            
            const [inventoryResult, setInventoryResult] = useState([]); 
            const [linkSourceId, setLinkSourceId] = useState(null);     
            const [isProcessing, setIsProcessing] = useState(false);

            const resetEngine = useCallback(() => {
                setCloudStock([]);
                setPurchaseData([]);
                setSalesData([]);
                setInventoryResult([]);
                setLinkSourceId(null);
                setIsProcessing(false);
            }, []);

            const formatItemDate = (dateStr, refYear) => {
                if (!dateStr) return 0;
                const str = String(dateStr).replace(/\D/g, '');
                if (str.length === 8) return parseInt(str, 10);
                if (str.length === 4) return parseInt(`${refYear}${str}`, 10);
                return 0;
            };

            // 🌟 역산 전용 알고리즘 (엑셀 1, 2번 업로드 시 자동 실행)
            const runEngine = useCallback(() => {
                if (salesData.length === 0 && purchaseData.length === 0) return;

                setIsProcessing(true);

                setTimeout(() => {
                    const refYear = new Date().getFullYear();
                    const targetDateStr = new Date().toISOString().split('T')[0];
                    const pData = {}; 
                    
                    // ====================================================================
                    // [공통] 매입(In) 데이터를 역순(최신 날짜가 맨 앞)으로 정렬 (LIFO 풀 생성)
                    // ====================================================================
                    const sortedIn = [...purchaseData]
                        .map(item => ({ ...item, _dateNum: formatItemDate(item['일자'], refYear) }))
                        .filter(item => item._dateNum > 0)
                        .sort((a, b) => b._dateNum - a._dateNum); // 역산을 위해 처리 순서는 최신순으로 유지
                        
                    const inPoolByCode = {}; 
                    sortedIn.forEach(item => { 
                        const code = String(item['코드'] || item['품목코드']); 
                        if (!inPoolByCode[code]) inPoolByCode[code] = []; 
                        inPoolByCode[code].push(item); 
                    });

                    // ====================================================================
                    // [핵심] 동일 단가 1줄 통폐합을 위한 식별키(BatchKey) 생성기
                    // ====================================================================
                    const generateBatchKey = (code, name, price, vendor, date) => {
                        const actualCode = String(code || 'NO_CODE');
                        if (actualCode === 'NO_CODE') return `NO_CODE|${name}|${price}|${vendor}|${date}`;
                        return `${actualCode}|${price}|${safeStr(vendor, '')}`; 
                    };

                    if (salesData.length > 0) {
                        // ====================================================================
                        // [모드 1] 역산 프로세스 (기말재고 데이터 존재 시)
                        // ====================================================================
                        salesData.forEach((item) => {
                            const code = String(item['코드'] || item['품목코드'] || 'NO_CODE');
                            let rawName = item._raw?.['상품명(규격)'] || item['품명'] || item['품목명'] || '';
                            let origPrice = safeNum(item._raw?.['매입단가(원가)'] !== undefined ? item._raw['매입단가(원가)'] : item['단가']);
                            
                            const masterItem = masterProducts[code];
                            const info = {
                                name: masterItem ? (masterItem['품명'] || masterItem['상품명'] || rawName) : rawName,
                                spec: masterItem ? (masterItem['규격'] || item['규격'] || '') : (item['규격'] || '')
                            };

                            let actualQty = safeNum(item['수량']);
                            if (item._raw?.['기말실사(이월수량)'] !== undefined) actualQty = safeNum(item._raw['기말실사(이월수량)']);
                            else if (item._raw?.['기말실사'] !== undefined) actualQty = safeNum(item._raw['기말실사']);
                            else if (item._raw?.['재고'] !== undefined) actualQty = safeNum(item._raw['재고']);
                            else if (item['출고'] !== undefined) actualQty = safeNum(item['출고']);

                            if (actualQty <= 0) return; 

                            if (!inPoolByCode[code] || inPoolByCode[code].length === 0) {
                                const groupKey = generateBatchKey(code, info.name, origPrice, '', ''); // 거래처 및 일자 빈칸 처리
                                if (!pData[groupKey]) {
                                    pData[groupKey] = {
                                        id: generateId(), code, 품명: info.name, 규격: info.spec, 
                                        단가: origPrice, 일자: '', 거래처: '', // 기초재고(단가미상) 텍스트 제거
                                        기초: actualQty, 입고: 0, 출고: 0, 전산잔량: actualQty, 실사: actualQty, 로스: 0,
                                        대체입고: 0, 대체출고: 0, 메모: '', 이슈: ['⚠️단가미상']
                                    };
                                } else {
                                    pData[groupKey].기초 += actualQty; 
                                    pData[groupKey].전산잔량 += actualQty; 
                                    pData[groupKey].실사 += actualQty;
                                }
                            } else {
                                let remainingQty = actualQty; 
                                const inList = inPoolByCode[code]; 
                                
                                for (let i = 0; i < inList.length && remainingQty > 0; i++) {
                                    const inItem = inList[i]; 
                                    let inItemQty = safeNum(inItem['수량']); 
                                    let inItemPrice = safeNum(inItem['단가']);
                                    
                                    if (inItemQty <= 0 || inItemPrice <= 0) continue;
                                    
                                    const takeQty = Math.min(remainingQty, inItemQty); 
                                    remainingQty -= takeQty; 
                                    
                                    const inVendor = inItem['거래처명'] || inItem['거래처'] || '';
                                    const inDate = inItem['일자'] || targetDateStr;
                                    const groupKey = generateBatchKey(code, info.name, inItemPrice, inVendor, inDate);
                                    
                                    if (!pData[groupKey]) {
                                        pData[groupKey] = {
                                            id: generateId(), code, 품명: info.name, 규격: info.spec, 
                                            단가: inItemPrice, 일자: inDate, 거래처: inVendor,
                                            기초: takeQty, 입고: 0, 출고: 0, 전산잔량: takeQty, 실사: takeQty, 로스: 0,
                                            대체입고: 0, 대체출고: 0, 메모: '', 이슈: []
                                        };
                                    } else {
                                        pData[groupKey].기초 += takeQty; 
                                        pData[groupKey].전산잔량 += takeQty; 
                                        pData[groupKey].실사 += takeQty; 
                                    }
                                }
                                
                                if (remainingQty > 0) {
                                    const fallbackPrice = inList.length > 0 ? safeNum(inList[0]['단가']) : origPrice;
                                    const fallbackVendor = inList.length > 0 ? (inList[0]['거래처명']||inList[0]['거래처']) : '';
                                    const fallbackDate = inList.length > 0 ? inList[0]['일자'] : '';
                                    const groupKey = generateBatchKey(code, info.name, fallbackPrice, fallbackVendor, fallbackDate);
                                    
                                    if (!pData[groupKey]) {
                                        pData[groupKey] = {
                                            id: generateId(), code, 품명: info.name, 규격: info.spec, 
                                            단가: fallbackPrice, 일자: fallbackDate, 거래처: fallbackVendor, // 초과 텍스트 제거
                                            기초: remainingQty, 입고: 0, 출고: 0, 전산잔량: remainingQty, 실사: remainingQty, 로스: 0,
                                            대체입고: 0, 대체출고: 0, 메모: '', 이슈: ['🚨기록부족', '⚠️단가미상']
                                        };
                                    } else {
                                        pData[groupKey].기초 += remainingQty; 
                                        pData[groupKey].전산잔량 += remainingQty; 
                                        pData[groupKey].실사 += remainingQty;
                                        if (!pData[groupKey].이슈.includes('🚨기록부족')) pData[groupKey].이슈.push('🚨기록부족');
                                        if (!pData[groupKey].이슈.includes('⚠️단가미상')) pData[groupKey].이슈.push('⚠️단가미상');
                                    }
                                }
                            }
                        });
                    } else if (purchaseData.length > 0) {
                        // ====================================================================
                        // [모드 2] 매입 데이터만 업로드 시 (바로 노출)
                        // ====================================================================
                        purchaseData.forEach((item) => {
                            const code = String(item['코드'] || item['품목코드'] || 'NO_CODE');
                            let rawName = item['품명'] || item['상품명'] || '';
                            let price = safeNum(item['단가']);
                            let qty = safeNum(item['수량']);
                            
                            if (qty <= 0) return;

                            const masterItem = masterProducts[code];
                            const info = {
                                name: masterItem ? (masterItem['품명'] || masterItem['상품명'] || rawName) : rawName,
                                spec: masterItem ? (masterItem['규격'] || item['규격'] || '') : (item['규격'] || '')
                            };

                            const vendor = item['거래처명'] || item['거래처'] || '';
                            const date = item['일자'] || targetDateStr;
                            const groupKey = generateBatchKey(code, info.name, price, vendor, date);

                            if (!pData[groupKey]) {
                                pData[groupKey] = {
                                    id: generateId(), code, 품명: info.name, 규격: info.spec, 
                                    단가: price, 일자: date, 거래처: vendor,
                                    기초: 0, 입고: qty, 출고: 0, 전산잔량: qty, 실사: qty, 로스: 0,
                                    대체입고: 0, 대체출고: 0, 메모: '', 이슈: []
                                };
                            } else {
                                pData[groupKey].입고 += qty; 
                                pData[groupKey].전산잔량 += qty; 
                                pData[groupKey].실사 += qty;
                            }
                        });
                    }

                    // ====================================================================
                    // [핵심 4] 화면 노출 정렬 (품목코드 -> 과거일자 우선(오름차순) -> 단가)
                    // ====================================================================
                    const finalRows = Object.values(pData).filter(item => item.전산잔량 > 0 || item.실사 > 0).sort((a, b) => {
                        const codeA = String(a.code || ''); const codeB = String(b.code || '');
                        if (codeA !== codeB) return codeA.localeCompare(codeB); // 1. 품목코드 순
                        
                        const dateA = String(a.일자 || ''); const dateB = String(b.일자 || '');
                        if (dateA !== dateB) return dateA.localeCompare(dateB); // 2. 오름차순 (과거 날짜가 위로)
                        
                        return (b.단가 || 0) - (a.단가 || 0);                   // 3. 내림차순 (단가 높은 순)
                    });

                    // 🌟 뭉쳐서 보여주던 로직 제거 -> 역산된 각 행이 각자의 잔량을 독립적으로 표출하도록 복구
                    finalRows.forEach((row) => {
                        row.totalSystemBal = row.전산잔량; 
                    });

                    setInventoryResult(finalRows);
                    setIsProcessing(false);
                }, 50);

            }, [purchaseData, salesData, masterProducts]);

            // 🌟 엑셀 데이터가 변경되면 즉시 자동 실행 
            useEffect(() => {
                runEngine();
            }, [purchaseData, salesData, runEngine]);

            const updateUnitPrice = useCallback((id, val) => {
                setInventoryResult(prev => prev.map(item => {
                    if (item.id === id) {
                        const newVal = val === '' ? 0 : Number(val);
                        return { ...item, 단가: newVal };
                    }
                    return item;
                }));
            }, []);

            const updateActualStock = useCallback((id, val) => {
                setInventoryResult(prev => prev.map(item => {
                    if (item.id === id) {
                        const newVal = val === '' ? '' : Number(val);
                        const loss = val === '' ? 0 : Number(val) - item.전산잔량;
                        let newIssues = item.이슈.filter(i => !i.includes('수기조정'));
                        if (loss !== 0) newIssues.push('✅수기조정');
                        return { ...item, 실사: newVal, 로스: loss, 이슈: newIssues };
                    }
                    return item;
                }));
            }, []);

            const executeSubstitution = useCallback((sourceId, targetId) => {
                setInventoryResult(prev => {
                    const newData = [...prev];
                    const sIdx = newData.findIndex(d => d.id === sourceId);
                    const tIdx = newData.findIndex(d => d.id === targetId);
                    if (sIdx < 0 || tIdx < 0) return prev;

                    let sItem = { ...newData[sIdx], 이슈: [...newData[sIdx].이슈] };
                    let tItem = { ...newData[tIdx], 이슈: [...newData[tIdx].이슈] };

                    if (sItem.로스 < 0 && tItem.로스 > 0) { }
                    else if (tItem.로스 < 0 && sItem.로스 > 0) { let temp = sItem; sItem = tItem; tItem = temp; }
                    else { alert("재고조정 실패: 한쪽은 로스가 마이너스(-), 한쪽은 플러스(+)여야 상계가 가능합니다."); return prev; }

                    const sQty = Math.abs(sItem.로스);
                    const tQty = Math.abs(tItem.로스);

                    sItem.대체출고 += sQty;
                    sItem.전산잔량 -= sQty;
                    sItem.실사 = sItem.전산잔량;
                    sItem.로스 = 0;
                    sItem.이슈 = sItem.이슈.filter(i => !i.includes('수기조정') && !i.includes('수량부족') && !i.includes('🚨기록부족'));
                    sItem.이슈.push(`🔄 (-${sQty} 상계)`);

                    tItem.대체입고 += tQty;
                    tItem.전산잔량 += tQty;
                    tItem.실사 = tItem.전산잔량;
                    tItem.로스 = 0; 
                    
                    const transferredCost = sQty * sItem.단가;
                    tItem.단가 = transferredCost / tQty;

                    tItem.이슈 = tItem.이슈.filter(i => !i.includes('수기조정'));
                    tItem.이슈.push(`🔄 (+${tQty} 상계)`);
                    tItem.메모 = `🔄 [${sItem.품명}] 에서 대체됨`;

                    newData[sIdx] = sItem;
                    newData[tIdx] = tItem;
                    return newData;
                });
                setLinkSourceId(null);
            }, []);

            return {
                cloudStock, setCloudStock, setPurchaseData, setSalesData, runEngine, resetEngine,

            const handleKeyDown = (e, type, id) => {
                // 1. 위/아래 방향키 조작 (숫자 변경 방지 및 상하 이동)
                if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                    e.preventDefault(); 
                    
                    const allInputsOfSameType = Array.from(document.querySelectorAll(`input[data-col-type="${type}"]`));
                    const currentIndex = allInputsOfSameType.indexOf(e.target);
                    
                    if (currentIndex !== -1) {
                        let nextIndex = e.key === 'ArrowUp' ? currentIndex - 1 : currentIndex + 1;
                        if (nextIndex >= 0 && nextIndex < allInputsOfSameType.length) {
                            allInputsOfSameType[nextIndex].focus();
                            allInputsOfSameType[nextIndex].select();
                            allInputsOfSameType[nextIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    }
                    return;
                }

                // 2. Tab 키 조작 (오류 항목만 콕 집어서 다음으로 점프)
                if (e.key === 'Tab') {
                    const issueInputs = Array.from(document.querySelectorAll(`input[data-issue-type="${type}"][data-issue="true"]`));
                    
                    if (issueInputs.length > 0) {
                        e.preventDefault();
                        const currentIndex = issueInputs.indexOf(e.target);
                        
                        let nextIndex = currentIndex + (e.shiftKey ? -1 : 1);
                        if (nextIndex >= issueInputs.length) nextIndex = 0;
                        if (nextIndex < 0) nextIndex = issueInputs.length - 1;
                        
                        issueInputs[nextIndex].focus();
                        issueInputs[nextIndex].select();
                        issueInputs[nextIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    return;
                }

                // 3. 스페이스바 조작 (수량 칸에서만 로스 조정 연결 활성화)
                if (type === 'stock' && (e.key === ' ' || e.code === 'Space')) {

                        {item.전산잔량}

                    {/* 🌟 8. 실사 수량 입력 (모든 행에 개별 입력 복구) */}
                    <td className="px-3 py-2 relative w-[100px] border-r">

        const App = () => {

            const [isProcessing, setIsProcessing] = useState(false);
            const [processMsg, setProcessMsg] = useState('');
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            
            const [searchQuery, setSearchQuery] = useState('');
            
            const [closingDate, setClosingDate] = useState(() => {
                const today = new Date();
                const offset = today.getTimezoneOffset() * 60000;
                return new Date(today.getTime() - offset).toISOString().split('T')[0];
            });

            useEffect(() => {
                getIDB(STORAGE_KEYS.MASTER_DB).then(data => { 
                    if (data && typeof data === 'object') setMasterProducts(data); 
                }).catch(console.error);

                const handleMessage = (e) => {
                    if (e.data && e.data.type === 'CLOSE_SETTINGS') {
                        setShowSettingsModal(false);

                };
                window.addEventListener('message', handleMessage);
                return () => window.removeEventListener('message', handleMessage);
            }, []);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'F3') {
                        e.preventDefault();
                        const searchInput = document.getElementById('searchInput');
                        if (searchInput) {
                            searchInput.focus();
                            searchInput.select();
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(''), 3500); }, []);

            const handleNavigate = useCallback((e, path, isReady = true) => {
                if (e && e.preventDefault) e.preventDefault();
                if (!isReady || path === '#') { showToast(`⚠️ [${path}] 페이지는 아직 준비 중입니다.`); return; }
                try {
                    const protocol = window.location.protocol;
                    if (protocol === 'about:' || protocol === 'blob:' || protocol === 'data:') {
                        showToast(`💡 미리보기 환경: [${path}] 로 이동을 시뮬레이션 합니다.`);
                    } else {
                        window.location.href = path;
                    }
                } catch (err) {
                    showToast(`💡 미리보기 환경: [${path}] 로 이동을 시뮬레이션 합니다.`);
                }
            }, [showToast]);

            const handlePush = async () => { showToast("Push 기능 준비중"); };
            const handlePull = async () => { showToast("Pull 기능 준비중"); };

            const handleCloudPull = async () => {
                try {
                    const savedData = await getIDB(STORAGE_KEYS.LAST_CLOSING);
                    if (savedData && savedData.length > 0) {
                        engine.setCloudStock(savedData);
                        showToast("✅ 시스템에 보관되어 있던 [상세 전일재고]를 성공적으로 불러왔습니다.");
                    } else {
                        showToast("⚠️ 보관된 전일 상세 마감 데이터가 없습니다. (어제 마감 보관을 하지 않았습니다)");
                    }
                } catch(e) {
                    alert("전일 데이터를 불러오는 중 오류가 발생했습니다.");
                }
            };

            const handleFileUpload = async (e, type) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const data = await parseExcel(file, type);
                    if (type === 'purchase') engine.setPurchaseData(data);
                    if (type === 'sales') engine.setSalesData(data);
                    
                    setUploadStatus(prev => ({ ...prev, [type]: true }));
                    showToast(`✅ 데이터가 업로드되었습니다. (${data.length}건)`);
                } catch (err) {
                    alert("파일 분석 중 오류가 발생했습니다.");
                } finally {
                    e.target.value = '';
                }
            };

            const handleSpacebarAction = useCallback((targetId) => {
                engine.setLinkSourceId(prevId => {
                    if (!prevId) return targetId; 
                    if (prevId === targetId) return null; 
                    engine.executeSubstitution(prevId, targetId); 
                    return null;
                });
            }, [engine]);

            // 🌟 [통합] 마감 보관 및 엑셀 다운로드 (원클릭 처리)
            const handleDownloadAndSave = async () => {
                if (engine.inventoryResult.length === 0) {
                    showToast("⚠️ 처리할 마감 데이터가 없습니다.");
                    return;
                }

                try {
                    // 1. 브라우저 DB에 영구 보관 (내일 전일재고용)
                    await setIDB(STORAGE_KEYS.LAST_CLOSING, engine.inventoryResult);
                    
                    // 2. 엑셀 추출 및 다운로드 (모든 분할된 행을 다 내보냄)
                    const dateStr = closingDate.replace(/-/g, '');
                    const exportData = [];
                    engine.inventoryResult.forEach(item => {
                        exportData.push({
                            '일자': dateStr,
                            '순번': '',
                            '담당자': '',
                            '창고': '01',
                            '품목코드': item.code, 
                            '품목명': item.품명, 
                            '단가': item.단가,
                            '매입처': item.거래처,
                            '수 량': item.실사 !== null && item.실사 !== '' ? item.실사 : item.전산잔량,
                            '적요': ''
                        });
                    });

                    const ws = XLSX.utils.json_to_sheet(exportData);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "단계별재고실사");
                    XLSX.writeFile(wb, `단가역산_기말재고_${dateStr}.xlsx`);
                    
                    showToast(`✅ [${dateStr}] 마감 데이터 자산화 및 엑셀 다운로드가 완료되었습니다.`);
                } catch (error) {
                    alert("마감 처리 중 오류가 발생했습니다.");
                }
            };

            const handleReset = () => {
                engine.resetEngine();
                setUploadStatus({ purchase: false, sales: false });
                setSearchQuery('');
                document.querySelectorAll('input[type="file"]').forEach(el => el.value = '');
                showToast("🔄 데이터가 초기화되었습니다.");
            };

            // useEffect 자동 실행 로직 제거 (Hook 내부에서 자동 실행되므로 중복 방지)
            // useEffect(() => {
            //     engine.runEngine();
            // }, [uploadStatus, engine.cloudStock, engine.runEngine]);

            const filteredResult = useMemo(() => {
                if (!searchQuery.trim()) return engine.inventoryResult;
                const query = searchQuery.toLowerCase();
                return engine.inventoryResult.filter(item => 
                    String(item.품명 || '').toLowerCase().includes(query) ||
                    String(item.code || '').toLowerCase().includes(query) || 
                    String(item.거래처 || '').toLowerCase().includes(query)
                );
            }, [engine.inventoryResult, searchQuery]);

            const groupedResult = useMemo(() => {
                const arr = filteredResult.map(item => ({ ...item, isFirst: false, rowSpan: 1 }));
                let currentCode = null;
                let spanCount = 0;
                let groupStartIdx = -1;

                for (let i = 0; i < arr.length; i++) {
                    if (arr[i].code !== currentCode) {
                        if (groupStartIdx !== -1) {
                            arr[groupStartIdx].rowSpan = spanCount;
                        }
                        currentCode = arr[i].code;
                        spanCount = 1;
                        groupStartIdx = i;
                        arr[i].isFirst = true;
                    } else {
                        spanCount++;
                        arr[i].isFirst = false;
                    }
                }
                if (groupStartIdx !== -1) {
                    arr[groupStartIdx].rowSpan = spanCount;
                }
                return arr;
            }, [filteredResult]);

            const issueStats = useMemo(() => {
                const mismatchErrors = [];
                const negativeStocks = [];
                const priceErrors = [];

                engine.inventoryResult.forEach(item => {
                    if (item.hasMismatch && item.isLastOfCode) mismatchErrors.push(item);
                    if (item.totalSystemBal < 0 && item.isLastOfCode) negativeStocks.push(item);
                    if (item.단가 <= 0) priceErrors.push(item);
                });

                return { mismatchErrors, negativeStocks, priceErrors };
            }, [engine.inventoryResult]);

            const handleScrollToRow = (targetId, focusType = 'stock') => {
                const row = document.getElementById(`row-${targetId}`);
                if (row) {
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    row.classList.remove('highlight-row');
                    void row.offsetWidth; 
                    row.classList.add('highlight-row');
                    
                    const input = row.querySelector(`input[data-issue-type="${focusType}"]`);
                    if (input) {
                        setTimeout(() => {
                            input.focus();
                            input.select();
                        }, 300);
                    }
                }
            };

            return (
                <div className="h-screen w-full flex flex-col font-sans overflow-hidden bg-slate-50">
                    <GlobalHeader 
                        activeTab="inventory"
                        itemCount={Object.keys(masterProducts).length} 
                        isProcessing={engine.isProcessing} 
                        processMsg="단가 역산 엔진 실행 중..."
                        onOpenSettings={() => setShowSettingsModal(true)}
                        onPush={handlePush}
                        onPull={handlePull}
                        onNavigate={handleNavigate}
                    />

                    {toast && (
                        <div className="fixed top-20 left-1/2 transform -translate-x-1/2 z-[100] bg-slate-800 text-white px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-2 fade-in font-bold text-[13px]">
                            <SafeIcon name="check-circle-2" size={16} className="text-emerald-400" />
                            {toast}
                        </div>
                    )}

                    <main className="flex-1 flex flex-col overflow-hidden bg-slate-100/50 p-2 md:p-4">
                        <div className="max-w-[1500px] w-full mx-auto bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col flex-1 overflow-hidden">
                            
                            <div className="bg-white px-4 py-2.5 border-b border-slate-200 flex justify-between items-center shrink-0 flex-nowrap gap-3 relative z-10">
                                
                                <div className="flex items-center gap-2 shrink-0">
                                    <input 
                                        type="date" 
                                        value={closingDate}
                                        onChange={(e) => setClosingDate(e.target.value)}
                                        className="px-2 py-1.5 text-[12px] font-bold border border-slate-200 bg-slate-50 text-slate-700 rounded-md w-[110px] cursor-pointer outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 hover:bg-slate-100 transition-colors"
                                        title="실사 기준일자"
                                    />
                                    
                                    <div className="w-px h-5 bg-slate-200 mx-1"></div>

                                    <button onClick={handleCloudPull} className="px-3 py-1.5 bg-white hover:bg-slate-50 border border-slate-200 rounded-md text-[12px] font-bold text-slate-600 transition-colors flex items-center">
                                        <i className="fas fa-cloud-download-alt text-slate-400 mr-1.5"></i>전일
                                    </button>
                                    
                                    <label className={`px-3 py-1.5 rounded-md text-[12px] font-bold transition-colors flex items-center cursor-pointer ${uploadStatus.purchase ? 'bg-indigo-50 border border-indigo-200 text-indigo-700' : 'bg-white text-slate-600 hover:bg-slate-50 border border-slate-200'}`}>
                                        <i className={`fas fa-truck-loading mr-1.5 ${uploadStatus.purchase ? 'text-indigo-500' : 'text-slate-400'}`}></i>구매
                                        <input type="file" className="hidden" accept=".xlsx, .csv" onChange={(e) => handleFileUpload(e, 'purchase')} />
                                    </label>
                                    
                                    <label className={`px-3 py-1.5 rounded-md text-[12px] font-bold transition-colors flex items-center cursor-pointer ${uploadStatus.sales ? 'bg-indigo-50 border border-indigo-200 text-indigo-700' : 'bg-white text-slate-600 hover:bg-slate-50 border border-slate-200'}`}>
                                        <i className={`fas fa-receipt mr-1.5 ${uploadStatus.sales ? 'text-indigo-500' : 'text-slate-400'}`}></i>재고
                                        <input type="file" className="hidden" accept=".xlsx, .csv" onChange={(e) => handleFileUpload(e, 'sales')} />
                                    </label>
                                    
                                    <div className="text-[12px] font-semibold text-slate-400 ml-2 whitespace-nowrap hidden sm:block">
                                        결과 <span className="text-slate-700">{filteredResult.length}</span>건
                                    </div>
                                </div>
                                
                                <div className="flex items-center justify-center gap-2 flex-1 px-4 min-w-0 overflow-x-auto hide-scrollbar">
                                    <div onClick={() => issueStats.mismatchErrors.length > 0 && handleScrollToRow(issueStats.mismatchErrors[0].id, 'stock')}
                                         className={`flex items-center px-2.5 py-1 rounded-full border text-[11px] font-bold cursor-pointer transition-all whitespace-nowrap ${issueStats.mismatchErrors.length > 0 ? 'bg-rose-50 border-rose-200 text-rose-700 hover:bg-rose-100' : 'bg-slate-50 border-transparent text-slate-400'}`}>
                                        <span className="mr-2">① 내역불일치</span>
                                        <span className={`px-1.5 py-0.5 min-w-[20px] text-center rounded-full text-[10px] leading-none ${issueStats.mismatchErrors.length > 0 ? 'bg-rose-500 text-white animate-pulse' : 'bg-slate-200 text-slate-400'}`}>{issueStats.mismatchErrors.length}</span>
                                    </div>
                                    
                                    <div onClick={() => issueStats.negativeStocks.length > 0 && handleScrollToRow(issueStats.negativeStocks[0].id, 'stock')}
                                         className={`flex items-center px-2.5 py-1 rounded-full border text-[11px] font-bold cursor-pointer transition-all whitespace-nowrap ${issueStats.negativeStocks.length > 0 ? 'bg-rose-50 border-rose-200 text-rose-700 hover:bg-rose-100' : 'bg-slate-50 border-transparent text-slate-400'}`}>
                                        <span className="mr-2">② 수량부족</span>
                                        <span className={`px-1.5 py-0.5 min-w-[20px] text-center rounded-full text-[10px] leading-none ${issueStats.negativeStocks.length > 0 ? 'bg-rose-500 text-white animate-pulse' : 'bg-slate-200 text-slate-400'}`}>{issueStats.negativeStocks.length}</span>
                                    </div>

                                    <div onClick={() => issueStats.priceErrors.length > 0 && handleScrollToRow(issueStats.priceErrors[0].id, 'price')}
                                         className={`flex items-center px-2.5 py-1 rounded-full border text-[11px] font-bold cursor-pointer transition-all whitespace-nowrap ${issueStats.priceErrors.length > 0 ? 'bg-amber-50 border-amber-200 text-amber-700 hover:bg-amber-100' : 'bg-slate-50 border-transparent text-slate-400'}`}>
                                        <span className="mr-2">③ 단가오류</span>
                                        <span className={`px-1.5 py-0.5 min-w-[20px] text-center rounded-full text-[10px] leading-none ${issueStats.priceErrors.length > 0 ? 'bg-amber-500 text-white animate-pulse' : 'bg-slate-200 text-slate-400'}`}>{issueStats.priceErrors.length}</span>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2 shrink-0">
                                    {engine.linkSourceId && (
                                        <div className="bg-blue-600 text-white px-2.5 py-1.5 rounded-md text-[11px] font-bold shadow-sm pulse-border flex items-center gap-1.5 whitespace-nowrap mr-2">
                                            <i className="fas fa-link"></i> 조정 연결 중...
                                            <button onClick={() => engine.setLinkSourceId(null)} className="ml-1 hover:text-rose-300 w-4 h-4 flex items-center justify-center rounded-full bg-blue-700"><i className="fas fa-times text-[10px]"></i></button>
                                        </div>
                                    )}

                                    <button onClick={handleDownloadAndSave} className="w-8 h-8 flex justify-center items-center bg-emerald-50 border border-emerald-200 rounded-md text-emerald-600 hover:bg-emerald-100 hover:border-emerald-300 transition-colors" title="시스템 영구 보관 및 엑셀 다운로드 (원클릭 마감)">
                                        <i className="fas fa-file-excel text-[14px]"></i>
                                    </button>

                                    <button onClick={handleReset} className="w-8 h-8 flex justify-center items-center bg-white border border-slate-200 rounded-md text-slate-500 hover:text-rose-600 hover:bg-rose-50 hover:border-rose-200 transition-colors" title="초기화">
                                        <i className="fas fa-redo-alt text-[13px]"></i>
                                    </button>

                                    <div className="w-px h-5 bg-slate-200 mx-1"></div>

                                    <div className="relative w-36 sm:w-48 h-8 shrink-0">
                                        <input 
                                            id="searchInput"
                                            type="text" 
                                            placeholder="상품 검색 (F3)" 
                                            value={searchQuery} 
                                            onChange={e => setSearchQuery(e.target.value)} 
                                            className="w-full h-full pl-8 pr-7 bg-slate-50 border border-slate-200 rounded-md text-[12px] outline-none focus:bg-white focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition-all font-semibold text-slate-700" 
                                        />
                                        <SafeIcon name="search" size={13} className="absolute left-2.5 top-2 text-slate-400 pointer-events-none" />
                                        {searchQuery && (
                                            <button onClick={() => setSearchQuery('')} className="absolute right-2 top-2 text-slate-400 hover:text-slate-600">
                                                <i className="fas fa-times-circle text-[11px]"></i>
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>

                            <div className="flex-1 overflow-auto bg-white">
                                <table className="w-full text-left whitespace-nowrap border-collapse">
                                    <thead className="bg-[#f8fafc] text-slate-500 text-[11px] sticky top-0 z-30 shadow-sm border-y border-slate-200 uppercase tracking-wider">
                                        <tr>
                                            <th className="py-2.5 px-4 font-bold w-[22%]">상품 정보 (코드/품명/규격)</th>
                                            <th className="py-2.5 px-3 font-bold w-[18%]">입고 내역 / 상태</th>
                                            <th className="py-2.5 px-3 font-bold text-right w-[9%] text-emerald-600">단가</th>
                                            <th className="py-2.5 px-3 font-bold text-right w-[7%]">기초</th>
                                            <th className="py-2.5 px-3 font-bold text-right w-[8%] text-blue-600">입고</th>
                                            <th className="py-2.5 px-3 font-bold text-right w-[8%] text-rose-500">출고</th>
                                            <th className="py-2.5 px-3 font-black text-right w-[9%] text-slate-700 bg-slate-100/50">총 잔량(전산)</th>
                                            <th className="py-2.5 px-3 font-black text-right w-[10%] text-indigo-600">실사 수량</th>
                                            <th className="py-2.5 px-3 font-bold text-right w-[9%]">로스/조정</th>
                                            <th className="py-2.5 px-3 font-bold w-[10%]">메모</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {groupedResult.length === 0 ? (
                                            <tr>
                                                <td colSpan="10" className="py-24 text-center">
                                                    <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-50 mb-4">
                                                        <i className="fas fa-inbox text-2xl text-slate-300"></i>
                                                    </div>
                                                    <p className="text-slate-500 font-semibold text-[14px]">
                                                        {engine.inventoryResult.length === 0 ? "상단 툴바를 이용해 엑셀 데이터를 업로드해주세요." : "검색 조건에 일치하는 품목이 없습니다."}
                                                    </p>
                                                </td>
                                            </tr>
                                        ) : (
                                            groupedResult.map((item, idx) => (
                                                <InventoryRow 
                                                    key={item.id} 
                                                    item={item} 
                                                    index={idx}
                                                    isFirst={item.isFirst}
                                                    rowSpan={item.rowSpan}
                                                    isLinked={engine.linkSourceId === item.id}
                                                    isLinkTargetMode={engine.linkSourceId !== null}
                                                    onUpdateActual={engine.updateActualStock}
                                                    onUpdatePrice={engine.updateUnitPrice}
                                                    onSpacebarLink={handleSpacebarAction}
                                                />
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    <IframeSettingsModal 
                        isOpen={showSettingsModal} 
                        onClose={() => setShowSettingsModal(false)} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
