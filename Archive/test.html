<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>ONEAPP DataOps - 핵심 수불부 마감</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; margin: 0; overflow: hidden; user-select: none; }
        input, textarea, select { user-select: auto; }
        ::-webkit-scrollbar { width: 8px; height: 8px; } 
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .fade-in { animation: fadeIn 0.3s ease-out; } 
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-bounce { animation: modalBounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes modalBounce { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        [data-tooltip]:hover::after {
            content: attr(data-tooltip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%) translateY(-4px);
            background: rgba(15, 23, 42, 0.95); color: white; padding: 6px 10px; border-radius: 6px;
            font-size: 11px; font-weight: 500; white-space: nowrap; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); pointer-events: none;
        }

        #initial-loader { position: fixed; inset: 0; background-color: #f8fafc; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800">
    <div id="initial-loader">
        <div class="spinner"></div>
        <div class="font-bold text-slate-600 tracking-tight">ONEAPP DataOps FIFO 엔진 준비 중...</div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef, useCallback, Fragment } = React;

        const STORAGE_KEYS = { MASTER_DB: 'merchMaster_v870', CLOUD_URL: 'skuSyncCloudUrl_v6', SYNC_TRIGGER: 'merchMaster_sync_trigger', HISTORY_DB: 'merchHistory_v870', CLOSING_DB: 'merchClosing_v1' };

        // ==========================================
        // 1. 유틸리티 함수 (Data formatting & logic)
        // ==========================================
        const safeNum = (val) => { const n = Number(val); return isNaN(n) || !isFinite(n) ? 0 : n; };
        const safeStr = (val, fallback = '') => {
            if (val === null || val === undefined) return fallback;
            const s = String(val).trim(); const lower = s.toLowerCase();
            if (lower === 'undefined' || lower === 'nan' || lower === 'null' || lower === '') return fallback; return s;
        };
        const parseNumber = (val) => {
            if (val === undefined || val === null || val === '') return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            let strVal = String(val).trim(); let isNegative = false;
            if (strVal.startsWith('(') && strVal.endsWith(')')) { isNegative = true; strVal = strVal.slice(1, -1); } 
            else if (strVal.startsWith('-')) { isNegative = true; strVal = strVal.slice(1); }
            let num = Number(strVal.replace(/,/g, '').replace(/[^\d.]/g, ''));
            if (isNegative) num = -num; return isNaN(num) ? 0 : num;
        };
        const formatMoney = (num) => { const n = Number(num); return isNaN(n) ? '0' : Math.round(n).toLocaleString(); };
        const extractDateFromName = (filename) => {
            if (!filename) return 0;
            const match8 = filename.match(/20\d{6}/); if (match8) return parseInt(match8[0], 10);
            const match6 = filename.match(/(?:^|[^\d])(\d{6})(?:[^\d]|$)/); if (match6) return parseInt('20' + match6[1], 10);
            return 0;
        };
        const extractDateNum = (dStr) => { const num = parseInt(String(dStr).replace(/\D/g, ''), 10); return isNaN(num) ? 0 : num; };
        const addOneDay = (dateNum) => {
            if (!dateNum) return 0; const y = Math.floor(dateNum / 10000); const m = Math.floor((dateNum % 10000) / 100) - 1; const d = dateNum % 100;
            const date = new Date(y, m, d + 1); return date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
        };
        const formatItemDate = (dateStr, refYear) => {
            if (!dateStr) return 0; const str = String(dateStr).trim();
            if (str.includes('실사등록') || str.includes('미지정')) return 0; 
            if (/^\d{5}$/.test(str)) {
                const serial = parseInt(str, 10);
                if (serial > 30000 && serial < 80000) {
                    const date = new Date(Math.round((serial - 25569) * 86400 * 1000));
                    return parseInt(`${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, '0')}${String(date.getDate()).padStart(2, '0')}`, 10);
                }
            }
            const parts = str.match(/\d+/g); if (!parts) return 0;
            let y, m, d;
            if (parts.length >= 3) { y = parts[0]; if (y.length === 2) y = '20' + y; m = parts[1].padStart(2, '0'); d = parts[2].padStart(2, '0'); } 
            else if (parts.length === 2) { if (parts[0].length === 4) { y = parts[0]; m = parts[1].padStart(2, '0'); d = '01'; } else { y = String(refYear); m = parts[0].padStart(2, '0'); d = parts[1].padStart(2, '0'); } } 
            else if (parts.length === 1) {
                const c = parts[0];
                if (c.length === 8) { y = c.substring(0, 4); m = c.substring(4, 6); d = c.substring(6, 8); }
                else if (c.length === 6) { if (c.startsWith('20')) { y = c.substring(0, 4); m = c.substring(4, 6); d = '01'; } else { y = '20' + c.substring(0, 2); m = c.substring(2, 4); d = c.substring(4, 6); } } 
                else return 0;
            } else return 0;
            const numY = parseInt(y, 10); const numM = parseInt(m, 10); const numD = parseInt(d, 10);
            if (numY > 2000 && numY < 2100 && numM >= 1 && numM <= 12 && numD >= 1 && numD <= 31) return numY * 10000 + numM * 100 + numD;
            return 0;
        };
        const formatStrForPeriod = (num) => { const s = String(num); if (s.length === 8) return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`; if (s.length === 6) return `${s.slice(0,2)}-${s.slice(2,4)}-${s.slice(4,6)}`; return s; };

        const parseIssuesAndVendors = (str, price) => {
            if (!str) return { issues: [], vendors: {} };
            const parts = str.match(/[^,]+(?:\([^)]+\))*/g) || [];
            const issues = []; const vendors = {};
            const knownIssues = ['과다로스', '원가수정', '수기조정', '매입내역 없음', '전산 재고 부족', '재고 부족', '변동됨', '변경됨', '삭제됨', '신규추가', '수량변동', '단가변경', '매치변경', '원가추출됨', '원가추출', '단가없음', 'Lot불일치', 'Lot매치실패', '매입처없음', '수량부족', '🔄', '🚨', '✅'];

            parts.forEach(p => {
                const part = p.trim(); if (!part) return;
                if (part.includes('(NaN)')) return;
                let isKnownIssue = knownIssues.some(ki => part.includes(ki));
                if (isKnownIssue) { issues.push(part); } 
                else {
                    const match = part.match(/(.+)\((\d+)\)$/);
                    if (match) {
                        const vendorName = safeStr(match[1], '미지정'); const qty = parseInt(match[2], 10);
                        if (!isNaN(qty)) vendors[vendorName] = { qty, rev: qty * price, cogs: qty * price, isLifo: false, isPerfectMatch: false, displayVendor: vendorName }; else issues.push(part);
                    } else issues.push(part);
                }
            });
            return { issues, vendors };
        };

        const defaultMappings = {
            code: '품목코드, 상품코드, 코드, 품번, 바코드, sku',
            name: '품명, 품목명(규격), 품목명[규격], 상품명, 제품명, 이름, 품목, 상품',
            spec: '규격, 옵션, 사이즈', 
            qty: '재고, 기말실사(이월수량), 기말실사, 기말/실사, 수량, 기말잔량(실사반영), 기말잔량(실사), 기말잔량, 수량(합계), 입고수량, 출고수량, 판매수량, 잔량, 실사, 합계, 기말, 판매량, 출고량, 입고량',
            price: '최종입고, 매입단가(원가), 단가, 입고단가, 구매단가, 판매단가, 매입단가, 매입가, 판매가, 공급가액, 공급가, 금액, 원가, 가격, 최종(창고)',
            date: '결산일자, 매입일자, 일자, 날짜, 구매일자, 판매일자, 입고일자, 출고일자',
            vendor: '매출처명, 매입처(Lot), 매입처(거래처), 거래처명, 거래처, 거래, 매장명, 매장, 고객, 판매처, 공급사, 판매, 청과, 3거래',
            matchVendor: '구매처, 매입처, 매칭정보, 원매입처, lot', 
            excludeVendor: '3우리, 우리농산, 1전송, 창고이동, 폐기, 샘플',
            lifoVendor: '2전송, 쿠팡, B2B, 당일우선, 현금판매',
            internalLot: '우리, 공용, 분배, 담당자, 우리농산',
            priorityVendor: '2전송>1창고' 
        };

        const SafeIcon = React.memo(function SafeIconComponent({ name, size = 18, className = "" }) {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const kebabName = name.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();
                    const possibleNames = [kebabName, name, name==='cloud-download'?'download-cloud':name, name==='cloud-upload'?'upload-cloud':name, name==='bar-chart-3'?'bar-chart':name];
                    for (const pName of possibleNames) {
                        if (window.lucide.icons[pName]) { setSvg(window.lucide.icons[pName].toSvg({ width: size, height: size, class: className, 'stroke-width': 2.5 })); return; }
                    }
                }
            }, [name, size, className]);

            if (!svg) {
                const faMap = { 'cloud-download':'fa-cloud-download-alt', 'cloud-upload':'fa-cloud-upload-alt', 'settings':'fa-cogs', 'layout-dashboard':'fa-th-large', 'package-search':'fa-box-open', 'file-spreadsheet':'fa-table', 'zap':'fa-bolt', 'truck':'fa-truck', 'boxes':'fa-boxes', 'bar-chart-3':'fa-chart-bar', 'check-circle-2':'fa-check-circle', 'x':'fa-times', 'edit':'fa-edit', 'save':'fa-save', 'link':'fa-link', 'ban':'fa-ban', 'layer-group':'fa-layer-group', 'sitemap':'fa-sitemap', 'bolt':'fa-bolt', 'sort-amount-down':'fa-sort-amount-down', 'info-circle':'fa-info-circle', 'lock':'fa-lock', 'key':'fa-key', 'trash-alt':'fa-trash-alt', 'folder-open':'fa-folder-open', 'file-invoice':'fa-file-invoice', 'broom':'fa-broom', 'undo':'fa-undo', 'exchange-alt':'fa-exchange-alt', 'list':'fa-list', 'check-double':'fa-check-double', 'balance-scale':'fa-balance-scale', 'search-plus':'fa-search-plus', 'file-export':'fa-file-export', 'truck-loading':'fa-truck-loading', 'history':'fa-history', 'exclamation-circle': 'fa-exclamation-circle', 'calendar-alt': 'fa-calendar-alt', 'cut':'fa-cut', 'rocket':'fa-rocket', 'file-excel':'fa-file-excel', 'archive':'fa-archive', 'search':'fa-search', 'filter':'fa-filter', 'magic':'fa-magic' };
                return <i className={`fas ${faMap[name] || `fa-${name}`} ${className}`} style={{ fontSize: size }} />;
            }
            return <span className="inline-flex shrink-0 items-center justify-center" dangerouslySetInnerHTML={{ __html: svg }} />;
        });

        // ==========================================
        // 2. 글로벌 헤더 (v3.2 표준)
        // ==========================================
        const GlobalHeader = ({ activeTab, itemCount, isProcessing, processMsg, onOpenSettings, onPush, onPull, onNavigate }) => {
            const groups = [
                { id: 'master', label: '정보 관리', icon: 'database' },
                { id: 'ops', label: '운영 관리', icon: 'truck' },
                { id: 'admin', label: '인사이트', icon: 'bar-chart-3' }
            ];

            const tabs = [
                { id: 'dashboard', label: '통합 대시보드', icon: "layout-dashboard", path: 'Dashboard.html', group: 'common', isReady: true, shortTag: 'ONE BOARD' },
                { id: 'guide', label: '시스템 가이드', icon: "book-open", path: 'Guide/guide.html', group: 'common', isReady: true, shortTag: 'SYSTEM GUIDE' },

                { id: 'item-info', label: '마스터 DB', icon: "database", path: 'Master.html', group: 'master', isReady: true, shortTag: 'GOLDEN RECORD' },
                { id: 'item-manage', label: '상품 관리', icon: "package-search", path: 'Item_manager.html', group: 'master', isReady: true, shortTag: 'SKU FORGE' },
                { id: 'pipeline', label: '시세 관리', icon: "file-spreadsheet", path: 'Pipeline.html', group: 'master', isReady: true, shortTag: 'VALUATION HUB' },
                { id: 'parser', label: '스마트 파서', icon: "zap", path: 'Parser.html', group: 'master', isReady: true, shortTag: 'AI SMART PARSER' },
                { id: 'partner-db', label: '거래처 DB', icon: "book-open", path: 'partner_db.html', group: 'master', isReady: true, shortTag: 'ENTITY REGISTRY' },
                { id: 'partners', label: '거래처 관리', icon: "users", path: 'partners.html', group: 'master', isReady: true, shortTag: 'CRM STRATEGY' },

                { id: 'orders', label: '주문 관리', icon: "shopping-bag", path: 'orders.html', group: 'ops', isReady: true, shortTag: 'ORDER STREAM' },
                { id: 'purchases', label: '구매 관리', icon: "credit-card", path: 'purchases.html', group: 'ops', isReady: true, shortTag: 'SOURCE & PROCURE' },
                { id: 'sales', label: '판매 관리', icon: "line-chart", path: 'sales.html', group: 'ops', isReady: true, shortTag: 'REVENUE Ledger' },
                { id: 'inventory', label: '재고 마감', icon: "boxes", path: 'inventory.html', group: 'ops', isReady: true, shortTag: 'STOCK LEDGER' },
                { id: 'print-center', label: '출력 센터', icon: "printer", path: 'print_center.html', group: 'ops', isReady: true, shortTag: 'OUTPUT TERMINAL' },

                { id: 'insight', label: '경영 보고서', icon: "pie-chart", path: 'Report.html', group: 'admin', isReady: true, shortTag: 'INSIGHT ENGINE' },
                { id: 'cs', label: '정보 마당', icon: "megaphone", path: 'cs.html', group: 'admin', isReady: true, shortTag: 'NOTICE PORTAL' }
            ];

            const currentTab = tabs.find(t => t.id === activeTab);
            const activeGroup = currentTab ? currentTab.group : 'common';
            const [selectedGroup, setSelectedGroup] = useState(activeGroup);

            const handleLogoClick = (e) => { setSelectedGroup('common'); onNavigate(e, 'Dashboard.html', true); };

            return (
                <div className="flex flex-col shrink-0 z-40 relative w-full shadow-sm bg-[#0B1021]">
                    <header className="h-[72px] bg-[#0B1021] text-white flex justify-between px-6 border-b border-slate-800/80 relative z-20">
                        <div className="flex items-center h-full">
                            <div className="flex items-center cursor-pointer group mr-10 h-full" onClick={handleLogoClick} title="통합 대시보드 및 공통 메뉴로 이동">
                                <span className="font-black text-[24px] tracking-wider text-slate-100 mr-4 group-hover:text-indigo-400 transition-colors">ONEAPP</span>
                                <div className="flex flex-col border-l-2 border-slate-700/70 pl-4 py-0.5">
                                    <div className="flex items-center">
                                        <span className="font-black text-[16px] leading-none text-indigo-400 tracking-widest uppercase mt-0.5">NEXES</span>
                                        <span className="ml-2.5 bg-emerald-500/10 border border-emerald-400/30 text-emerald-400 px-[5px] py-[2px] rounded text-[9px] font-black tracking-wider shadow-sm leading-none">v3.2</span>
                                    </div>
                                    <span className="text-[10px] text-slate-400/90 font-medium tracking-[0.15em] mt-1 uppercase">
                                        {currentTab ? currentTab.shortTag : 'WORKSPACE'}
                                    </span>
                                </div>
                            </div>

                            <div className="flex items-end h-full gap-8">
                                {groups.map(g => (
                                    <button key={g.id} onClick={() => setSelectedGroup(prev => prev === g.id ? 'common' : g.id)}
                                        className={`pb-[16px] text-[14px] font-bold transition-colors flex items-center gap-1.5
                                        ${selectedGroup === g.id ? 'text-slate-100 border-b-[3px] border-indigo-500 -mb-[2px]' : 'text-slate-500 hover:text-slate-300'}`}>
                                        <SafeIcon name={g.icon} size={15} /> {g.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex items-center gap-4 h-full">
                            <div className="flex items-center bg-[#151B2B] rounded-lg border border-slate-700/50 h-9 px-3 shadow-inner gap-3">
                                <div className="flex items-center justify-center" title={isProcessing ? processMsg : "시스템 정상 대기중"}>
                                    {isProcessing ? (
                                        <i className="fas fa-circle-notch fa-spin text-amber-500 text-[12px]"></i>
                                    ) : (
                                        <div className="relative flex h-2 w-2">
                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                            <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                        </div>
                                    )}
                                </div>
                                <div className="w-px h-3.5 bg-slate-700"></div>
                                <div className="flex items-center gap-1.5 text-slate-300 cursor-help" title={`마스터 DB 기준 상품 수`}>
                                    <SafeIcon name="database" size={10} className="text-slate-500" />
                                    <span className="text-[11px] font-mono font-bold tracking-tight">{itemCount ? itemCount.toLocaleString() : 0}</span>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button onClick={onPull} className="w-10 h-10 rounded-xl bg-[#151B2B] hover:bg-[#1E293B] flex items-center justify-center border border-slate-700 transition-colors text-indigo-400 shadow-sm" title="데이터 불러오기(Pull)"><SafeIcon name="cloud-download" size={18} /></button>
                                <button onClick={onPush} className="w-10 h-10 rounded-xl bg-[#151B2B] hover:bg-[#1E293B] flex items-center justify-center border border-slate-700 transition-colors text-indigo-400 shadow-sm" title="데이터 백업하기(Push)"><SafeIcon name="cloud-upload" size={18} /></button>
                                <div className="w-px h-6 bg-slate-700 mx-1"></div>
                                <button onClick={onOpenSettings} className="w-10 h-10 rounded-xl bg-[#151B2B] hover:bg-[#1E293B] flex items-center justify-center border border-slate-700 transition-colors text-slate-400 hover:text-white shadow-sm" title="통합 환경설정 센터 열기"><SafeIcon name="settings" size={18} /></button>
                            </div>
                        </div>
                    </header>

                    {selectedGroup && (
                        <div className="bg-[#0B1021] px-6 pt-3 flex items-end gap-1 overflow-x-auto custom-scrollbar border-b border-slate-200 fade-in">
                            {tabs.filter(t => t.group === selectedGroup).map(tab => {
                                const isActive = activeTab === tab.id;
                                const isPlaceholder = !tab.isReady;
                                return (
                                    <a key={tab.id} href={tab.path} onClick={(e) => onNavigate(e, tab.path, tab.isReady)}
                                        className={`flex items-center gap-2 px-6 py-3 text-[14px] font-bold rounded-t-xl transition-all whitespace-nowrap border-x border-t-[3px]
                                        ${isActive
                                            ? 'bg-white text-indigo-600 border-t-indigo-500 border-x-slate-200 relative z-10 shadow-[0_-4px_10px_rgba(0,0,0,0.1)]'
                                            : isPlaceholder
                                                ? 'bg-[#151B2B] text-slate-500 border-t-transparent border-x-transparent cursor-not-allowed opacity-50 pb-2.5'
                                                : 'bg-[#151B2B] text-slate-400 border-t-transparent border-x-transparent hover:text-slate-200 pb-2.5'
                                        }`}
                                        style={{ marginBottom: isActive ? '-1px' : '0', paddingBottom: isActive ? '13px' : '10px' }}
                                    >
                                        <SafeIcon name={tab.icon} size={16} className={isActive ? 'text-indigo-600' : 'opacity-70'} />
                                        {tab.label}
                                    </a>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const IframeSettingsModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[500] flex justify-end bg-slate-900/60 backdrop-blur-sm fade-in cursor-pointer" onClick={onClose}>
                    <div className="w-full max-w-[1400px] h-full bg-white shadow-[-10px_0_40px_rgba(0,0,0,0.3)] flex flex-col slide-in-right border-l border-slate-300 relative overflow-hidden ml-auto cursor-default" onClick={(e) => e.stopPropagation()}>
                        <div className="bg-[#0f172a] px-6 py-4 flex justify-between items-center text-white shrink-0 border-b border-slate-700 shadow-md relative z-10">
                            <div className="flex items-center gap-3">
                                <SafeIcon name="settings" size={20} className="text-indigo-400"/>
                                <h2 className="font-black text-[17px] tracking-wide">통합 환경설정 센터</h2>
                            </div>
                            <div className="flex items-center gap-4">
                                <button onClick={onClose} className="text-slate-300 hover:text-white transition-colors bg-slate-800 hover:bg-rose-500 w-8 h-8 rounded-lg flex items-center justify-center shadow-sm">
                                    <SafeIcon name="x" size={18} />
                                </button>
                            </div>
                        </div>
                        <div className="flex-1 w-full bg-slate-100 relative">

                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 3. 엑셀 파서 로직
        // ==========================================
        const parseExcelData = (file, currentMappings) => {
            return new Promise((resolve, reject) => {
                if (!file) return resolve([]);
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const processWorkbook = (wb) => {
                            const sheet = wb.Sheets[wb.SheetNames[0]];
                            const jsonAll = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
                            let headerRowIdx = -1; let maxScore = 0;
                            const keywords = {
                                code: currentMappings.code.split(',').map(s => s.trim().toLowerCase()),
                                name: currentMappings.name.split(',').map(s => s.trim().toLowerCase()),
                                qty: currentMappings.qty.split(',').map(s => s.trim().toLowerCase()),
                                price: currentMappings.price.split(',').map(s => s.trim().toLowerCase()),
                                vendor: currentMappings.vendor.split(',').map(s => s.trim().toLowerCase()),
                                matchVendor: currentMappings.matchVendor ? currentMappings.matchVendor.split(',').map(s => s.trim().toLowerCase()) : [], 
                                spec: currentMappings.spec ? currentMappings.spec.split(',').map(s => s.trim().toLowerCase()) : [],
                                date: currentMappings.date ? currentMappings.date.split(',').map(s => s.trim().toLowerCase()) : []
                            };

                            for (let i = 0; i < Math.min(30, jsonAll.length); i++) {
                                const row = jsonAll[i] || []; let score = 0;
                                const rowStr = row.join('').replace(/\s/g, ''); if (!rowStr) continue;
                                Object.values(keywords).forEach(kwList => { if (kwList.some(kw => kw && row.some(cell => String(cell).replace(/\s/g, '').toLowerCase().includes(kw)))) score++; });
                                if (score > maxScore) { maxScore = score; headerRowIdx = i; }
                            }
                            return { jsonAll, headerRowIdx, maxScore, keywords };
                        };

                        let wb = XLSX.read(data, { type: 'array' });
                        let { jsonAll, headerRowIdx, maxScore, keywords } = processWorkbook(wb);

                        if (headerRowIdx === -1 || maxScore < 2) return resolve([]); 

                        const rawHeaders = jsonAll[headerRowIdx];
                        const uniqueHeaders = []; const headerCounts = {};
                        for (let j = 0; j < rawHeaders.length; j++) {
                            let h = rawHeaders[j] ? String(rawHeaders[j]).trim() : `__EMPTY_${j}`;
                            if (headerCounts[h]) { const orig = h; h = `${h}_${headerCounts[h]}`; headerCounts[orig]++; } else { headerCounts[h] = 1; }
                            uniqueHeaders.push(h);
                        }

                        const parsedData = [];
                        const getValByKeywords = (obj, kwList) => {
                            const keys = Object.keys(obj); const cleanKeys = keys.map(k => k.replace(/\s/g, '').toLowerCase());
                            for (let kw of kwList) { if (!kw) continue; const idx = cleanKeys.indexOf(kw); if (idx !== -1 && obj[keys[idx]] !== undefined && String(obj[keys[idx]]).trim() !== '') return obj[keys[idx]]; }
                            for (let kw of kwList) { if (!kw) continue; const idx = cleanKeys.findIndex(k => k.includes(kw)); if (idx !== -1 && obj[keys[idx]] !== undefined && String(obj[keys[idx]]).trim() !== '') return obj[keys[idx]]; }
                            return null;
                        };

                        for (let i = headerRowIdx + 1; i < jsonAll.length; i++) {
                            const row = jsonAll[i]; if (!row || row.join('').trim() === '') continue;
                            const rowObj = {}; uniqueHeaders.forEach((h, idx) => { if (h) rowObj[h] = row[idx]; });
                            
                            const codeRaw = getValByKeywords(rowObj, keywords.code); const codeStr = safeStr(codeRaw, '');
                            const baseNameRaw = getValByKeywords(rowObj, keywords.name); const baseName = safeStr(baseNameRaw, '');

                            if (!codeStr && !baseName) continue;
                            if (codeStr.includes('합계') || codeStr.includes('총계') || baseName.includes('합계') || baseName.includes('총합')) continue;
                            if (codeStr.includes('실사등록') || baseName.includes('기록없음')) continue;

                            const specValRaw = getValByKeywords(rowObj, keywords.spec); const specVal = safeStr(specValRaw, '');
                            let fullName = baseName || '이름없음';
                            if (specVal && baseName !== specVal && !baseName.includes(specVal)) fullName = `${baseName}_${specVal}`;

                            const normObj = {
                                코드: codeStr || 'NO_CODE', 품명: fullName,
                                수량: parseNumber(getValByKeywords(rowObj, keywords.qty)), 단가: parseNumber(getValByKeywords(rowObj, keywords.price)),
                                거래처: safeStr(getValByKeywords(rowObj, keywords.vendor), '미지정'), 매입처매칭: safeStr(getValByKeywords(rowObj, keywords.matchVendor), ''),
                                일자: safeStr(getValByKeywords(rowObj, keywords.date), ''), 메모: '', _raw: rowObj 
                            };
                            parsedData.push(normObj);
                        }
                        resolve(parsedData);
                    } catch (err) { reject(err); }
                };
                reader.readAsArrayBuffer(file);
            });
        };

        // ==========================================
        // 4. DataOps 엔진 (FIFO + Spacebar 역산)
        // ==========================================
        const useInventoryEngine = ({ mappings, grouping, setAlertMsg, setConfirmModal, setIsProcessing, setAppStep }) => {
            const [productData, setProductData] = useState([]);
            const [analysisPeriod, setAnalysisPeriod] = useState('전체 기간');
            const [targetDateStr, setTargetDateStr] = useState('');
            const [substHistory, setSubstHistory] = useState([]);
            const [ackMultiCodes, setAckMultiCodes] = useState(new Set());

            const resetEngine = useCallback(() => {
                setProductData([]); setAnalysisPeriod('전체 기간'); setTargetDateStr(''); setSubstHistory([]); setAckMultiCodes(new Set());
            }, []);

            const handleBaseDataChange = useCallback((batchKey, field, val) => {
                const numVal = val === '' ? 0 : Number(val);
                setProductData(prevP => prevP.map(item => {
                    if (item.batchKey === batchKey) {
                        const newItem = { ...item, [field]: numVal, 수기확인완료: true };
                        if (field === '단가') {
                            let newIssues = [...newItem.이슈].filter(msg => !msg.includes('단가'));
                            newItem.이슈 = newIssues.map(msg => msg.replace(/🚨/g, '✅')); 
                            return newItem;
                        }
                        newItem.전산잔량 = newItem.기초 + newItem.입고 + newItem.대체입고 - newItem.출고 - newItem.대체출고;
                        newItem.실사 = newItem.전산잔량; newItem.로스 = 0;
                        let newIssues = [...newItem.이슈].filter(msg => !msg.includes('장부 수기조정') && !msg.includes('수량부족') && !msg.includes('수량변동') && !msg.includes('과다로스') && !msg.includes('실사 수기조정'));
                        const isBaseChanged = newItem.기초 !== (newItem._orig?.기초 || 0) || newItem.입고 !== (newItem._orig?.입고 || 0) || newItem.출고 !== (newItem._orig?.출고 || 0);
                        if (isBaseChanged) newIssues.push('장부 수기조정');
                        newItem.이슈 = newIssues.map(msg => msg.replace(/🚨/g, '✅'));
                        return newItem;
                    }
                    return item;
                }));
            }, []);

            const handleManualStockChange = useCallback((batchKey, val) => {
                setProductData(prev => prev.map(item => {
                    if (item.batchKey === batchKey) {
                        const newActual = val === '' ? '' : Number(val);
                        const newLoss = (val === '' ? 0 : Number(val)) - item.전산잔량;
                        let newIssues = [...item.이슈].filter(msg => !msg.includes('실사 수기조정') && !msg.includes('수량변동') && !msg.includes('과다로스'));
                        if (item.전산잔량 >= 0) newIssues = newIssues.filter(msg => !msg.includes('수량부족'));
                        newIssues = newIssues.map(msg => msg.replace(/🚨/g, '✅'));
                        if (val !== '' && newLoss !== 0) newIssues.push('실사 수기조정');
                        return { ...item, 실사: newActual, 로스: newLoss, 이슈: newIssues, 수기확인완료: true }; 
                    }
                    return item;
                }));
            }, []);

            // 🌟 소분 판매 스페이스바 원가 상계 (비율 자동 계산 적용)
            const executeImmediateSubstitution = useCallback((key1, key2) => {
                setProductData(prev => {
                    const idx1 = prev.findIndex(d => d.batchKey === key1);
                    const realIdx2 = prev.findIndex(d => d.batchKey === key2);
                    if (idx1 < 0 || realIdx2 < 0) return prev;

                    const sourceItemOrig = { ...prev[idx1], 이슈: [...prev[idx1].이슈] };
                    const targetItemOrig = { ...prev[realIdx2], 이슈: [...prev[realIdx2].이슈] };

                    let sourceItem = { ...sourceItemOrig }; let targetItem = { ...targetItemOrig };

                    if (sourceItem.로스 < 0 && targetItem.로스 > 0) { }
                    else if (targetItem.로스 < 0 && sourceItem.로스 > 0) { let temp = sourceItem; sourceItem = targetItem; targetItem = temp; }
                    else { setAlertMsg(`재고조정 실패!\n\n두 상품을 연결하려면 먼저 실사 수량을 변경하여 오차(로스)를 만들어주세요.\n• 원물(차감 대상): 마이너스(-) 로스 발생\n• 소분(증가 대상): 플러스(+) 로스 발생`); return prev; }

                    const sQty = Math.abs(sourceItem.로스); const tQty = Math.abs(targetItem.로스);
                    if (tQty === 0) { setAlertMsg("대체되는 상품(소분품)의 실사 수량이 입력되지 않아 조정 비율을 알 수 없습니다."); return prev; }

                    // 🌟 비율 기반 원가 쪼개기 핵심 연산
                    const transferredCost = sQty * sourceItem.단가; 
                    const unitCost = transferredCost / tQty;        

                    sourceItem.대체출고 += sQty;
                    sourceItem.전산잔량 = sourceItem.기초 + sourceItem.입고 + sourceItem.대체입고 - sourceItem.출고 - sourceItem.대체출고;
                    sourceItem.로스 = 0;
                    sourceItem.실사 = sourceItem.전산잔량;
                    
                    if (sourceItem.로스 === 0) sourceItem.이슈 = sourceItem.이슈.filter(msg => !msg.includes('수량변동') && !msg.includes('실사 수기조정') && !msg.includes('과다로스'));
                    if (sourceItem.전산잔량 >= 0) sourceItem.이슈 = sourceItem.이슈.filter(msg => !msg.includes('수량부족'));
                    sourceItem.이슈.push(`🔄 (-${sQty} 상계)`); 
                    sourceItem.수기확인완료 = true;

                    targetItem.대체입고 += tQty;
                    targetItem.전산잔량 = targetItem.기초 + targetItem.입고 + targetItem.대체입고 - targetItem.출고 - targetItem.대체출고;
                    targetItem.로스 = 0;
                    targetItem.실사 = targetItem.전산잔량;
                    targetItem.단가 = unitCost; // 소분된 단가 새로 덮어쓰기
                    
                    if (targetItem.로스 === 0) targetItem.이슈 = targetItem.이슈.filter(msg => !msg.includes('수량변동') && !msg.includes('실사 수기조정') && !msg.includes('과다로스'));
                    if (targetItem.전산잔량 >= 0) targetItem.이슈 = targetItem.이슈.filter(msg => !msg.includes('수량부족'));
                    targetItem.이슈 = targetItem.이슈.filter(msg => !msg.includes('매입내역 없음') && !msg.includes('전산 재고 부족') && !msg.includes('단가없음'));
                    
                    targetItem.이슈.push(`🔄 (+${tQty} 상계)`); targetItem.수기확인완료 = true;
                    
                    const autoMemo = `🔄 [${sourceItem.품명}]`;
                    if (!(targetItem.메모 || '').includes(autoMemo)) targetItem.메모 = targetItem.메모 ? targetItem.메모 + ' ' + autoMemo : autoMemo;

                    setSubstHistory(h => [...h, {
                        id: Date.now(), sourceKey: sourceItem.batchKey, targetKey: targetItem.batchKey, sourceName: sourceItem.품명, targetName: targetItem.품명, 
                        sQty, tQty, transferredCost, sourceItemPrev: sourceItemOrig, targetItemPrev: targetItemOrig,
                    }]);

                    const newData = [...prev];
                    newData[prev.findIndex(d => d.batchKey === sourceItem.batchKey)] = sourceItem;
                    newData[prev.findIndex(d => d.batchKey === targetItem.batchKey)] = targetItem;
                    return newData;
                });
            }, [setAlertMsg]);

            // 🌟 1번(재고)과 2번(매입) 파일만 업로드 했을 때 실행되는 전용 역산 로직
            const runCostExtraction = useCallback(async (filesObj) => {
                setIsProcessing(true);
                try {
                    let parsedIn = []; let parsedStock = [];
                    if (filesObj.in) parsedIn = await parseExcelData(filesObj.in, mappings);
                    if (filesObj.end) parsedStock = await parseExcelData(filesObj.end, mappings);
                    else if (filesObj.prev) parsedStock = await parseExcelData(filesObj.prev, mappings);

                    let refYear = new Date().getFullYear();
                    const endDateNum = extractDateFromName(filesObj.end?.name) || extractDateFromName(filesObj.prev?.name) || 0;
                    if (endDateNum) refYear = Math.floor(endDateNum / 10000);

                    // 매입(In) 데이터를 역순(최신 날짜가 앞)으로 정렬
                    const sortedIn = [...parsedIn]
                        .map(item => ({ ...item, _dateNum: formatItemDate(item.일자, refYear) }))
                        .filter(item => item._dateNum > 0 && (!endDateNum || item._dateNum <= endDateNum))
                        .sort((a, b) => b._dateNum - a._dateNum);
                        
                    const inPoolByCode = {}; 
                    sortedIn.forEach(item => { 
                        const code = String(item.코드); 
                        if (!inPoolByCode[code]) inPoolByCode[code] = []; 
                        inPoolByCode[code].push(item); 
                    });

                    let targetDateStrFromData = endDateNum ? `${Math.floor(endDateNum/10000)}-${String(Math.floor((endDateNum%10000)/100)).padStart(2,'0')}-${String(endDateNum%100).padStart(2,'0')}` : (() => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; })();
                    
                    setTargetDateStr(targetDateStrFromData); 
                    setAnalysisPeriod('초기 기초재고 원가 역산 (LIFO-Backflush)');

                    const pData = {}; let uniqueIdCounter = 0;

                    parsedStock.forEach((item) => {
                        const code = String(item.코드 || 'NO_CODE');
                        let origPrice = parseNumber(item._raw?.['매입단가(원가)'] !== undefined ? item._raw['매입단가(원가)'] : item.단가);
                        
                        let actualQty = parseNumber(item.수량);
                        if (item._raw?.['기말실사(이월수량)'] !== undefined) actualQty = parseNumber(item._raw['기말실사(이월수량)']);
                        else if (item._raw?.['기말실사'] !== undefined) actualQty = parseNumber(item._raw['기말실사']);
                        else if (item._raw?.['재고'] !== undefined) actualQty = parseNumber(item._raw['재고']);
                        else if (item._raw?.['기초수량'] !== undefined) actualQty = parseNumber(item._raw['기초수량']);

                        if (actualQty <= 0) return;

                        if (!inPoolByCode[code] || inPoolByCode[code].length === 0) {
                            const groupKey = `${code}|${origPrice}|${uniqueIdCounter++}`;
                            pData[groupKey] = {
                                batchKey: groupKey, 코드: code, 품명: item._raw?.['상품명(규격)'] || item.품명, 단가: origPrice, 일자: targetDateStrFromData, 거래처: '기초재고(단가미상)',
                                기초: actualQty, 입고: 0, 출고: 0, 대체입고: 0, 대체출고: 0, 전산잔량: actualQty, 실사: actualQty, 로스: 0,
                                매출액: 0, 매출원가: 0, 메모: item._raw?.['수기메모'] || '', 이슈: (origPrice === 0 && actualQty > 0) ? ['🚨단가없음'] : [], 
                                출고내역: {}, _orig: {기초: actualQty, 입고: 0, 출고: 0, 단가: origPrice}, isDummy: (!code || code === 'NO_CODE'), 수기확인완료: (origPrice > 0)
                            };
                        } else {
                            let remainingQty = actualQty; 
                            const inList = inPoolByCode[code];
                            
                            // 🌟 핵심: 최신 입고부터 차감하면서 재고 구성
                            for (let i = 0; i < inList.length && remainingQty > 0; i++) {
                                const inItem = inList[i]; 
                                let inItemQty = parseNumber(inItem.수량);
                                if (inItem._raw && inItem._raw['입고수량'] !== undefined) inItemQty = parseNumber(inItem._raw['입고수량']);
                                else if (inItem._raw && inItem._raw['입고'] !== undefined) inItemQty = parseNumber(inItem._raw['입고']);
                                
                                if (inItemQty <= 0 || inItem.단가 <= 0) continue;
                                
                                const takeQty = Math.min(remainingQty, inItemQty); 
                                remainingQty -= takeQty;
                                
                                const groupKey = `${code}|${inItem.단가}|${uniqueIdCounter++}`;
                                
                                pData[groupKey] = {
                                    batchKey: groupKey, 코드: code, 품명: item._raw?.['상품명(규격)'] || item.품명, 단가: inItem.단가, 일자: inItem.일자 || targetDateStrFromData, 거래처: inItem.거래처 || '이월재고',
                                    기초: takeQty, 입고: 0, 출고: 0, 대체입고: 0, 대체출고: 0, 전산잔량: takeQty, 실사: takeQty, 로스: 0,
                                    매출액: 0, 매출원가: 0, 메모: item._raw?.['수기메모'] || '', 이슈: [`✅${formatStrForPeriod(inItem._dateNum)} 매입분 역산`], 
                                    출고내역: {}, _orig: {기초: takeQty, 입고: 0, 출고: 0, 단가: inItem.단가}, isDummy: false, 수기확인완료: true
                                };
                            }
                            
                            if (remainingQty > 0) {
                                const validInList = inList.filter(i => i.단가 > 0); 
                                const fallbackPrice = validInList.length > 0 ? validInList[0].단가 : 0; 
                                const fallbackLabel = fallbackPrice > 0 ? `🚨과거 매입기록 부족 (최신단가적용)` : '🚨단가없음';
                                
                                const groupKey = `${code}|${fallbackPrice}|${uniqueIdCounter++}`;
                                pData[groupKey] = {
                                    batchKey: groupKey, 코드: code, 품명: item._raw?.['상품명(규격)'] || item.품명, 단가: fallbackPrice, 일자: targetDateStrFromData, 거래처: '기초재고(초과분)',
                                    기초: remainingQty, 입고: 0, 출고: 0, 대체입고: 0, 대체출고: 0, 전산잔량: remainingQty, 실사: remainingQty, 로스: 0,
                                    매출액: 0, 매출원가: 0, 메모: item._raw?.['수기메모'] || '', 이슈: [fallbackLabel], 
                                    출고내역: {}, _orig: {기초: remainingQty, 입고: 0, 출고: 0, 단가: fallbackPrice}, isDummy: false, 수기확인완료: (fallbackPrice > 0)
                                };
                            }
                        }
                    });

                    // 🌟 사용자 요청 정렬: 품목코드 -> 일자 -> 단가
                    const finalProductData = Object.values(pData).filter(item => !(item.기초 === 0 && item.입고 === 0 && item.출고 === 0 && item.실사 === 0 && item.로스 === 0)).sort((a, b) => {
                        const codeA = String(a.코드 || ''); const codeB = String(b.코드 || '');
                        if (codeA !== codeB) return codeA.localeCompare(codeB);
                        const dateA = String(a.일자 || ''); const dateB = String(b.일자 || '');
                        if (dateA !== dateB) return dateA.localeCompare(dateB);
                        return (a.단가 || 0) - (b.단가 || 0);

                    if (filesObj.out) parsedOut = await parseExcelData(filesObj.out, mappings);
                    if (filesObj.end) parsedEnd = await parseExcelData(filesObj.end, mappings);
                    
                    const endDateNum = extractDateFromName(filesObj.end?.name) || 0;
                    let targetDateStrFromData = endDateNum ? `${Math.floor(endDateNum/10000)}-${String(Math.floor((endDateNum%10000)/100)).padStart(2,'0')}-${String(endDateNum%100).padStart(2,'0')}` : (() => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; })();

                    executeAnalysis({ parsedPrev, parsedIn, parsedOut, parsedEnd, periodStr: targetDateStrFromData, targetDateStrFromData });
                } catch (err) { setAlertMsg('데이터 추출 중 오류가 발생했습니다.'); console.error(err); setIsProcessing(false); }
            }, [mappings, executeAnalysis, setAlertMsg, setIsProcessing]);

            return {
                productData, setProductData, analysisPeriod, targetDateStr, substHistory, setSubstHistory, ackMultiCodes, setAckMultiCodes,
                resetEngine, handleBaseDataChange, handleManualStockChange, executeImmediateSubstitution, runAnalysis, runCostExtraction
            };
        };

        // ==========================================
        // 5. 컴포넌트: 파일 업로드 박스
        // ==========================================
        const FileBox = React.memo(({ title, type, icon, files, setFiles }) => {
            const inputRef = useRef(null); const [isDragging, setIsDragging] = useState(false);
            const handleDrop = (e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(false); const f = Array.from(e.dataTransfer.files); if (f.length > 0) setFiles(prev => ({ ...prev, [type]: f[0] })); };
            const handleOnChange = (e) => { const f = Array.from(e.target.files); if (f.length > 0) setFiles(prev => ({ ...prev, [type]: f[0] })); e.target.value = ''; };

            return (
                <div className={`relative border rounded-lg transition-all cursor-pointer flex items-center justify-between h-[42px] px-3 w-[150px] shadow-sm hover:-translate-y-0.5 ${files[type] ? 'border-slate-500 bg-slate-700' : 'border-slate-600 bg-slate-800 hover:border-slate-500 hover:bg-slate-700'} ${isDragging ? 'border-blue-500 bg-slate-700 border-dashed' : ''}`} onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }} onDragLeave={() => setIsDragging(false)} onDrop={handleDrop} onClick={() => inputRef.current.click()}>
                    <input type="file" ref={inputRef} accept=".xlsx, .xls, .csv" onChange={handleOnChange} className="hidden" />
                    <div className="flex items-center gap-2 overflow-hidden w-full"><i className={`fas ${icon} ${files[type] ? 'text-blue-400' : 'text-slate-400'} shrink-0 text-sm`}></i><div className="flex flex-col overflow-hidden w-full"><div className="font-bold text-[10px] text-slate-400 truncate">{title}</div><div className="text-[12px] font-bold truncate leading-none mt-0.5">{files[type] ? <span className="text-slate-100">{files[type].name}</span> : <span className="text-slate-500">클릭</span>}</div></div></div>
                </div>
            );
        });

        const IssueChip = React.memo(({ msg }) => {
            let shortMsg = msg; let tooltip = msg; let colorClass = "bg-slate-100 text-slate-700 border-slate-200";

            if (msg.includes('단가없음') || msg.includes('단가변경')) {
                shortMsg = msg.includes('✅') ? "✅단가" : "🚨단가"; tooltip = `매입 단가 누락: ${msg}`;
                colorClass = shortMsg.includes('🚨') ? "bg-rose-100 text-rose-700 border-rose-200 font-bold shadow-sm" : "bg-slate-50 text-slate-400 border-slate-200 shadow-sm";
            } else if (msg.includes('수량부족')) {
                shortMsg = "🚨잔량"; tooltip = `전산재고가 부족: ${msg}`;
                colorClass = "bg-rose-100 text-rose-700 border-rose-200 font-bold shadow-sm";
            } else if (msg.includes('신규발생')) {
                shortMsg = msg.includes('✅') ? "✅신규" : "🚨신규"; tooltip = `마감 파일에 없는 품목: ${msg}`;
                colorClass = shortMsg.includes('🚨') ? "bg-orange-50 text-orange-700 border-orange-200 font-bold shadow-sm" : "bg-emerald-50 text-emerald-700 border-emerald-200 font-bold";
            } else if (msg.includes('수량변동') || msg.includes('실사 수기조정')) {
                shortMsg = msg.includes('✅') ? "✅수량" : "🚨수량"; tooltip = `로스 발생: ${msg}`;
                colorClass = shortMsg.includes('🚨') ? "bg-orange-50 text-orange-700 border-orange-200 font-bold shadow-sm" : "bg-slate-50 text-slate-400 border-slate-200 shadow-sm";
            } else if (msg.includes('장부 수기조정') || msg.includes('원가수정')) {
                shortMsg = "✅수기조정"; tooltip = `사용자 직접 수정: ${msg}`; colorClass = "bg-slate-50 text-slate-500 border-slate-200 shadow-sm";
            } else if (msg.includes('🔄')) {
                shortMsg = msg; tooltip = `스페이스바 로스 대체`; colorClass = "bg-slate-100 text-slate-600 border-slate-200 font-medium max-w-[150px] truncate inline-block align-bottom";
            } else if (msg.includes('원가추출') || msg.includes('역산')) {
                shortMsg = "✅원가추출"; tooltip = `과거 매입 내역에서 성공적으로 원가 추출됨: ${msg}`; colorClass = "bg-emerald-50 text-emerald-700 border-emerald-200 shadow-sm font-bold";
            } else { shortMsg = msg.replace(/🚨|✅/g, ''); colorClass = "bg-slate-100 text-slate-600 border-slate-200"; }

            return <span data-tooltip={tooltip} className={`px-2 py-0.5 rounded border font-semibold text-[10px] cursor-help ${colorClass}`}>{shortMsg}</span>;
        });

        // ==========================================
        // 6. 메인 렌더링 컴포넌트 (App)
        // ==========================================
        function App() {
            const [appStep, setAppStep] = useState('closing'); 
            const [files, setFiles] = useState({ prev: null, in: null, out: null, end: null });
            const [isProcessing, setIsProcessing] = useState(false);
            const [alertMsg, setAlertMsg] = useState('');
            const [showSettings, setShowSettings] = useState(false);
            const [linkSourceKey, setLinkSourceKey] = useState(null);
            const [searchKw, setSearchKw] = useState('');
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, warnings: [], payload: null });

            const [mappings, setMappings] = useState(() => { const saved = localStorage.getItem('inventoryMappingsLight'); return saved ? { ...defaultMappings, ...JSON.parse(saved) } : defaultMappings; });
            const [grouping, setGrouping] = useState(() => { const saved = localStorage.getItem('inventoryGroupingV79'); return saved ? JSON.parse(saved) : { priceMode: 'separate', splitByVendor: false, splitByDate: false }; });

            const { 
                productData, setProductData, analysisPeriod, targetDateStr, substHistory, setSubstHistory,
                resetEngine, handleBaseDataChange, handleManualStockChange, executeImmediateSubstitution, runAnalysis, runCostExtraction
            } = useInventoryEngine({ mappings, grouping, setAlertMsg, setConfirmModal, setIsProcessing, setAppStep });

            // 🌟 역산 모드 판별기 (1, 2번 파일만 올렸을 때)
            const isCostExtractionMode = files.in && (files.prev || files.end) && !files.out;

            useEffect(() => {
                const loader = document.getElementById('initial-loader');
                if (loader) { setTimeout(() => { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 500); }, 100); }
            }, []);

            useEffect(() => {
                const handleKey = (e) => {
                    if (e.key === ' ') {
                        const actEl = document.activeElement;
                        if (actEl && actEl.tagName === 'INPUT' && actEl.dataset.colType === 'stock') {
                            e.preventDefault();
                            const batchKey = actEl.closest('tr').getAttribute('data-batch');
                            setLinkSourceKey(prev => {
                                if (!prev) return batchKey;
                                if (prev === batchKey) return null;
                                setTimeout(() => executeImmediateSubstitution(prev, batchKey), 0); return null; 
                            });
                        }
                    } else if (e.key === 'Escape') {
                        setLinkSourceKey(null);
                    }
                };
                window.addEventListener('keydown', handleKey); return () => window.removeEventListener('keydown', handleKey);
            }, [executeImmediateSubstitution]);

            const filteredData = useMemo(() => {
                if (!searchKw) return productData;
                const kw = searchKw.toLowerCase();
                return productData.filter(d => (d.품명 && d.품명.toLowerCase().includes(kw)) || (d.코드 && d.코드.toLowerCase().includes(kw)));
            }, [productData, searchKw]);

            const handleExport = useCallback(() => {
                if (productData.length === 0) return setAlertMsg("다운로드할 데이터가 없습니다.");
                const ws = XLSX.utils.json_to_sheet(productData.map(item => ({
                    '코드': item.코드, '품명': item.품명, '단가': item.단가, '기초': item.기초, '입고': item.입고, '출고': item.출고, 
                    '전산잔량': item.전산잔량, '실사': item.실사, '로스': item.로스, '이슈': item.이슈.join(', ')
                })));
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "마감결과");
                XLSX.writeFile(wb, `수불부마감_${targetDateStr.replace(/-/g, '')}.xlsx`);
            }, [productData, targetDateStr]);

            return (
                <div className="h-screen w-full flex flex-col overflow-hidden bg-slate-50 relative">
                    <GlobalHeader 
                        activeTab="inventory" itemCount={productData.length} isProcessing={isProcessing} processMsg="분석 중..."
                        onOpenSettings={() => setShowSettings(true)} onPush={() => {}} onPull={() => {}} onNavigate={() => {}}
                    />
                    
                    <IframeSettingsModal isOpen={showSettings} onClose={() => setShowSettings(false)} />

                    {alertMsg && (
                        <div className="fixed inset-0 z-[600] bg-slate-900/60 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm modal-bounce text-center">
                                <i className="fas fa-exclamation-triangle text-blue-500 text-3xl mb-3"></i>
                                <p className="text-slate-800 font-bold mb-5 whitespace-pre-line text-[14px]">{alertMsg}</p>
                                <button autoFocus onClick={() => setAlertMsg('')} className="px-6 py-2.5 bg-slate-800 text-white rounded-lg text-sm font-bold w-full">확인</button>
                            </div>
                        </div>
                    )}

                    <div className="shrink-0 bg-slate-900 border-b border-slate-700 shadow-md">
                        <div className="max-w-[1500px] mx-auto px-6 py-3 flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center gap-2">
                                <FileBox title="1. 기초" type="prev" icon="fa-history" files={files} setFiles={setFiles} />
                                <i className="fas fa-chevron-right text-slate-500 text-[10px]"></i>
                                <FileBox title="2. 매입" type="in" icon="fa-truck-loading" files={files} setFiles={setFiles} />
                                <i className="fas fa-chevron-right text-slate-500 text-[10px]"></i>
                                <FileBox title="3. 매출" type="out" icon="fa-receipt" files={files} setFiles={setFiles} />
                                <i className="fas fa-chevron-right text-slate-500 text-[10px]"></i>
                                <FileBox title="4. 실사" type="end" icon="fa-clipboard-check" files={files} setFiles={setFiles} />
                            </div>
                            
                            <div className="flex items-center gap-3">
                                <button onClick={() => { setFiles({prev:null,in:null,out:null,end:null}); resetEngine(); }} className="px-3 py-2 text-slate-400 hover:text-white font-bold text-sm">초기화</button>
                                
                                {/* 🌟 1(재고), 2(매입) 파일만 업로드 시 버튼이 초록색(기초재고 역산)으로 변함 */}
                                {isCostExtractionMode ? (
                                    <button onClick={() => runCostExtraction(files)} disabled={isProcessing} className="px-6 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-black rounded-md shadow-[0_0_15px_rgba(16,185,129,0.25)] text-sm transition-all transform hover:scale-105">
                                        <i className="fas fa-magic mr-2"></i> ✨ 기초재고 단가 역산
                                    </button>
                                ) : (
                                    <button onClick={() => runAnalysis(files)} disabled={isProcessing || (!files.in && !files.out && !files.prev && !files.end)} className="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-md shadow-md text-sm transition-all disabled:opacity-50">
                                        <i className="fas fa-play mr-2"></i> FIFO 분석 실행
                                    </button>
                                )}
                                
                                <button onClick={handleExport} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white font-black rounded-md shadow-md text-sm transition-all ml-2">
                                    <i className="fas fa-file-excel mr-2"></i> 다운로드
                                </button>
                            </div>
                        </div>
                    </div>

                    <main className="flex-1 overflow-auto bg-slate-100 p-6 flex flex-col relative">
                        {linkSourceKey && <div className="absolute top-10 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-white px-6 py-2 rounded-full shadow-xl font-bold animate-pulse"><i className="fas fa-link mr-2"></i>대체(상계)할 타겟 상품의 실사 칸을 클릭 후 스페이스바를 누르세요.</div>}
                        
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col w-full max-w-[1500px] mx-auto">
                            <div className="flex justify-between items-center bg-slate-50 border-b border-slate-200 p-3 shrink-0">
                                <div className="font-bold text-slate-700"><i className="fas fa-list text-blue-500 mr-2"></i>재고 마감 (FIFO 적용)</div>
                                <div className="relative">
                                    <i className="fas fa-search absolute left-3 top-2 text-slate-400 text-sm"></i>
                                    <input type="text" placeholder="검색..." value={searchKw} onChange={e=>setSearchKw(e.target.value)} className="pl-8 pr-3 py-1.5 border border-slate-300 rounded text-[13px] outline-none focus:border-blue-500 focus:ring-1 w-64" />
                                </div>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto">
                                <table className="w-full text-left whitespace-nowrap text-sm border-collapse">
                                    <thead className="bg-slate-100 text-slate-600 font-extrabold text-[12px] sticky top-0 z-30 shadow-sm">
                                        <tr>
                                            <th className="py-3 px-4 border-r border-slate-200">상품 정보 (코드/품명)</th>
                                            <th className="py-3 px-3 text-right border-r border-slate-200">단가</th>
                                            <th className="py-3 px-3 text-right border-r border-slate-200">기초</th>
                                            <th className="py-3 px-3 text-right border-r border-slate-200 text-blue-600">입고</th>
                                            <th className="py-3 px-3 text-right border-r border-slate-200 text-rose-500">출고</th>
                                            <th className="py-3 px-3 text-right border-r border-slate-200 bg-slate-200/50">잔량(전산)</th>
                                            <th className="py-3 px-3 text-right border-r border-slate-200 text-indigo-600">실사 수량</th>
                                            <th className="py-3 px-3 text-right border-r border-slate-200">로스/조정</th>
                                            <th className="py-3 px-3">이슈/결과</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {filteredData.length === 0 ? (
                                            <tr><td colSpan="9" className="p-12 text-center text-slate-400 font-bold"><i className="fas fa-box-open text-3xl mb-3 block"></i>데이터가 없습니다.</td></tr>
                                        ) : (
                                            filteredData.map((item, idx) => (
                                                <tr key={item.batchKey} data-batch={item.batchKey} className={`hover:bg-slate-50 transition-colors ${linkSourceKey === item.batchKey ? 'bg-blue-50 ring-2 ring-blue-500 relative z-10' : ''}`}>
                                                    <td className="py-2.5 px-4 border-r border-slate-100">
                                                        <div className="font-bold text-slate-800">{item.품명}</div>
                                                        <div className="text-[10px] text-slate-500 font-mono flex items-center gap-1.5 mt-0.5">
                                                            <span>{item.코드}</span> | <span className="text-blue-600">{item.일자}</span> | <span className="truncate max-w-[100px]">{item.거래처}</span>
                                                        </div>
                                                    </td>
                                                    <td className="py-2.5 px-3 text-right border-r border-slate-100">
                                                        <input type="number" value={item.단가||''} onChange={e=>handleBaseDataChange(item.batchKey, '단가', e.target.value)} onFocus={e=>e.target.select()} className="w-20 text-right bg-transparent border border-transparent hover:border-slate-300 focus:bg-white focus:border-blue-500 rounded px-1 text-[13px] font-semibold" />
                                                    </td>
                                                    <td className="py-2.5 px-3 text-right text-slate-500 border-r border-slate-100">{item.기초}</td>
                                                    <td className="py-2.5 px-3 text-right text-blue-600 font-semibold border-r border-slate-100">{item.입고}</td>
                                                    <td className="py-2.5 px-3 text-right text-rose-500 font-semibold border-r border-slate-100">{item.출고}</td>
                                                    <td className="py-2.5 px-3 text-right font-black text-slate-700 bg-slate-50/50 border-r border-slate-100">{item.전산잔량}</td>
                                                    <td className="py-2.5 px-3 border-r border-slate-100 bg-blue-50/10">
                                                        <input data-col-type="stock" type="number" value={item.실사===null?'':item.실사} onChange={e=>handleManualStockChange(item.batchKey, e.target.value)} onFocus={e=>e.target.select()} className={`w-20 text-right font-bold text-[14px] bg-white border ${item.로스 !== 0 ? 'border-orange-400' : 'border-slate-300'} focus:border-blue-500 focus:ring-1 rounded px-2 py-1 shadow-sm`} />
                                                    </td>
                                                    <td className={`py-2.5 px-3 text-right font-black border-r border-slate-100 ${item.로스 < 0 ? 'text-rose-600' : item.로스 > 0 ? 'text-blue-600' : 'text-slate-300'}`}>
                                                        {item.로스 > 0 ? '+' : ''}{item.로스 !== 0 ? item.로스 : '-'}
                                                    </td>
                                                    <td className="py-2.5 px-3">
                                                        <div className="flex flex-wrap gap-1">
                                                            {item.이슈.map((msg, i) => <IssueChip key={i} msg={msg} />)}
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
