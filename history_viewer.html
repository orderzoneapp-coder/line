<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>NEXUS History Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const HistoryApp = () => {
            const [logs, setLogs] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');

            // 로컬스토리지에서 로그 불러오기 및 실시간 감지
            useEffect(() => {
                const loadLogs = () => {
                    try {
                        const parsedLogs = JSON.parse(localStorage.getItem('merchHistory_v870')) || [];
                        setLogs(parsedLogs);
                    } catch (e) {
                        console.error("로그 로딩 실패", e);
                    }
                };

                loadLogs(); // 초기 로드

                // 메인 앱에서 새 작업 발생 시 즉각 반영
                window.addEventListener('storage', (e) => {
                    if (e.key === 'merchHistory_v870') loadLogs();
                });
            }, []);

            // 검색 필터링
            const filteredLogs = useMemo(() => {
                if (!searchQuery.trim()) return logs;
                const keyword = searchQuery.toLowerCase();
                return logs.filter(log => 
                    String(log.name).toLowerCase().includes(keyword) || 
                    String(log.code).toLowerCase().includes(keyword) ||
                    String(log.field).toLowerCase().includes(keyword)
                );
            }, [logs, searchQuery]);

            return (
                <div className="h-screen w-full flex flex-col bg-slate-50">
                    {/* Header */}
                    <div className="bg-[#0f172a] p-4 text-white flex justify-between items-center shrink-0 border-b-4 border-indigo-500 shadow-md z-10">
                        <div className="flex items-center gap-3">
                            <i className="fas fa-history text-indigo-400 text-2xl"></i>
                            <div>
                                <h1 className="font-black text-[18px] tracking-wide">NEXUS SYSTEM AUDIT LOG</h1>
                                <p className="text-[11px] text-slate-400 font-mono mt-0.5">단가 변동 및 마스터 업데이트 이력 (최대 2,000건)</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="relative">
                                <input 
                                    type="text" 
                                    placeholder="품목명, 코드 검색..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="bg-slate-800 border border-slate-600 text-white text-sm rounded-lg pl-9 pr-4 py-2 outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition-all w-[250px]"
                                />
                                <i className="fas fa-search absolute left-3 top-2.5 text-slate-400"></i>
                            </div>
                            <button onClick={() => window.close()} className="w-9 h-9 rounded bg-slate-800 hover:bg-rose-500 text-slate-300 hover:text-white transition-colors flex items-center justify-center border border-slate-600 hover:border-rose-500">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>
                    </div>

                    {/* Data Table */}
                    <div className="flex-1 overflow-auto p-6 relative">
                        <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden h-full flex flex-col fade-in">
                            <div className="flex-1 overflow-auto">
                                <table className="w-full text-left text-[13px] whitespace-nowrap">
                                    <thead className="bg-slate-100 border-b border-slate-200 sticky top-0 shadow-sm z-10">
                                        <tr className="text-slate-600 font-bold">
                                            <th className="px-4 py-3 text-center w-36">작업일시</th>
                                            <th className="px-4 py-3 w-28">구분/코드</th>
                                            <th className="px-4 py-3">품명 (내용)</th>
                                            <th className="px-4 py-3 text-center w-28">변경항목</th>
                                            <th className="px-4 py-3 text-right w-32">기존값</th>
                                            <th className="px-4 py-3 text-right w-32">변경값</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {filteredLogs.length > 0 ? (
                                            filteredLogs.map((log, i) => (
                                                <tr key={i} className="hover:bg-indigo-50/30 transition-colors text-slate-700">
                                                    <td className="px-4 py-2 text-center text-slate-400 font-mono text-[11px]">{log.timestamp}</td>
                                                    <td className="px-4 py-2 font-bold text-[11px]">
                                                        {log.code === 'SYSTEM' ? <span className="text-indigo-500 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">시스템 연산</span> : <span className="font-mono text-slate-500">{log.code}</span>}
                                                    </td>
                                                    <td className="px-4 py-2 font-bold truncate max-w-[350px]" title={log.name}>{log.name}</td>
                                                    <td className="px-4 py-2 text-center">
                                                        <span className="bg-slate-100 px-2 py-0.5 rounded text-[11px] font-black border border-slate-200 text-slate-600">{log.field}</span>
                                                    </td>
                                                    <td className="px-4 py-2 text-right text-slate-400 line-through decoration-slate-300 font-mono">{log.oldVal ? log.oldVal.toLocaleString() : '-'}</td>
                                                    <td className="px-4 py-2 text-right font-black text-indigo-600 font-mono">{log.newVal ? log.newVal.toLocaleString() : '-'}</td>
                                                </tr>
                                            ))
                                        ) : (
                                            <tr>
                                                <td colSpan="6" className="py-20 text-center text-slate-400 font-bold bg-slate-50/50">
                                                    <i className="fas fa-folder-open text-4xl mb-4 block text-slate-300"></i>
                                                    {searchQuery ? "검색 결과가 없습니다." : "기록된 최신 작업 내역이 없습니다."}
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            <div className="bg-slate-50 px-4 py-2 border-t border-slate-200 text-xs font-bold text-slate-500 flex justify-between shrink-0">
                                <span><i className="fas fa-database text-indigo-400 mr-1.5"></i>조회된 레코드: {filteredLogs.length.toLocaleString()}건</span>
                                <span>이 목록은 클라우드 동기화 시 다른 PC에서도 똑같이 조회됩니다.</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HistoryApp />);
    </script>
</body>
</html>
