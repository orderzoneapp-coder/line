    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; -webkit-user-select: none; user-select: none; background-color: #f1f5f9; margin: 0; overflow: hidden; }
        input, textarea, select { user-select: auto; }
        ::-webkit-scrollbar { width: 8px; height: 8px; } 
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.2s ease-out; } 
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* 🌟 핵심 UI/UX: Split View 및 행 단위 하이라이트/상태 추적 CSS */
        .data-row > td { background-color: #ffffff; transition: background-color 0.15s ease; }
        .data-row > td.master-col { background-color: #f1f5f9; } /* 읽기전용 마스터 영역 (더 뚜렷한 쿨그레이) */
        
        .data-row:hover > td { background-color: #f8fafc; }
        .data-row:hover > td.master-col { background-color: #e2e8f0; } /* 마스터 영역 호버 시 색상 */
        
        /* 1. 단가/데이터가 수정된 행 (노란색 끈질긴 추적) */
        .data-row.is-modified > td { background-color: #fefce8 !important; }
        
        /* 2. 입력칸 클릭 시(Focus) 줄 전체 파란색 하이라이트 십자선 효과 (가장 우선순위 높음) */
        .data-row:focus-within > td { background-color: #eff6ff !important; }

<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef, useCallback, Fragment } = React;

        // ==========================================
        // 🧩 1. 코어 전역 상수 및 로컬 데이터베이스 컨트롤러
        // ==========================================
        const STORAGE_KEYS = {
            MASTER_DB: 'merchMaster_v870', CLOUD_URL: 'skuSyncCloudUrl_v6', SYNC_TRIGGER: 'merchMaster_sync_trigger',
            HISTORY_DB: 'merchHistory_v870', CLOSING_DB: 'merchClosing_v1', MANAGED_ITEMS: 'merchPipeline_Managed_v2',
            UNSYNCED_MASTER: 'merchUnsyncedMaster_v1', UNSYNCED_HISTORY: 'merchUnsyncedHistory_v1', UNSYNCED_DELETES: 'merchUnsyncedDeletes_v1'
        };

        const MASTER_HEADERS = [
            "창고", "1코드", "1그룹명", "2코드", "2그룹명", "3코드", "3그룹명", "오더즈", 
            "구매처", "브랜드", "품목코드", "품목명", "규격", "안전재고", "간단설명", "카탈로그", 
            "견적서", "출고가", "입고가", "입고B", "도매A", "도매B", "상장가", "최종전송", 
            "최종입고", "단가H", "단가I", "시중가", "행사가", "1종코드", "1종규격", "1종연산", 
            "2종코드", "2종규격", "2종연산", "외주비", "노무비", "경비", "비과세", "기본", 
            "연동", "싯가", "단위", "준비기간", "마감시간", "검색어등록", "소싱태그", "순번"
        ];

        const NUMERIC_HEADERS = [
            "안전재고", "출고가", "입고가", "입고B", "도매A", "도매B", "상장가", "최종전송", 
            "최종입고", "단가H", "단가I", "시중가", "행사가", "1종연산", "2종연산", "외주비", 
            "노무비", "경비", "1구매", "1출고", "2구매", "2출고", "1입고", "2입고", "순번"
        ];

        const generateUUID = () => {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8); return v.toString(16);
            });
        };

        const parseNum = (v) => (!v ? 0 : Number(String(v).replace(/,/g, '').replace(/[^\d.-]/g, '')) || 0);
        const safeStr = (val, def = '') => (val !== undefined && val !== null && val !== '') ? String(val) : def;

        let idbInstance = null;
        const initIDB = () => new Promise((resolve, reject) => {
            if (idbInstance) return resolve(idbInstance); 
            const request = indexedDB.open('MerchOpsDB', 1);
            request.onupgradeneeded = (e) => { if (!e.target.result.objectStoreNames.contains('store')) e.target.result.createObjectStore('store'); };
            request.onsuccess = () => { idbInstance = request.result; resolve(idbInstance); };
            request.onerror = () => reject(request.error);
        });

        const getIDB = async (key) => {
            const db = await initIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('store', 'readonly');
                const req = tx.objectStore('store').get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(tx.error);
            });
        };

        const setIDB = async (key, val) => {
            const db = await initIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('store', 'readwrite');
                tx.objectStore('store').put(val, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        };

        const parseExcelRobust = (file) => new Promise((resolve, reject) => {
            if (!window.XLSX) return reject(new Error("엑셀 파서 로드 안됨"));
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = window.XLSX.read(data, { type: 'array', cellDates: true });
                    const jsonAll = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "", raw: false });
                    if(jsonAll.length === 0) return resolve([]);
                    let headerRowIdx = 0;
                    for (let i = 0; i < Math.min(15, jsonAll.length); i++) {
                        const rowStr = jsonAll[i].join('').replace(/\s/g, '');
                        if (rowStr.includes('코드') || rowStr.includes('품명') || rowStr.includes('상품')) { headerRowIdx = i; break; }
                    }
                    const headers = jsonAll[headerRowIdx] || [];
                    let endIdx = jsonAll.length - 1;
                    while (endIdx > headerRowIdx) {
                        const rowArr = jsonAll[endIdx]; if (!rowArr || rowArr.length === 0) { endIdx--; continue; }
                        let filledCount = 0, rawStr = ''; rowArr.forEach(v => { if(v !== undefined && String(v).trim() !== '') { filledCount++; rawStr += String(v).replace(/\s/g, ''); } });
                        if (rawStr === '') { endIdx--; continue; }
                        if (rawStr.match(/출력|합계|총계/)) endIdx--; else break;
                    }
                    const parsedData = [];
                    for (let i = headerRowIdx + 1; i <= endIdx; i++) {
                        const row = jsonAll[i]; if (!row) continue;
                        let isEmpty = true; const obj = {}; 
                        headers.forEach((h, idx) => { if (h) { obj[h] = row[idx]; if(row[idx] !== undefined && String(row[idx]).trim() !== '') isEmpty = false; } }); 
                        if(!isEmpty) parsedData.push(obj);
                    } resolve(parsedData);
                } catch (err) { reject(err); }
            };
            reader.readAsArrayBuffer(file);
        });

        const calculatePricesEngine = (baseInPrice, mItem = {}, currentFinalData = {}, marginRules = [], forceRecalc = false) => {
            if (!baseInPrice || baseInPrice <= 0) return { ...currentFinalData, '입고가': 0, '시중가': 0, '출고가': 0, '1입고': 0, '1출고': 0 };

            const outsrc = parseNum(currentFinalData?.['외주비'] ?? mItem?.['외주비']);
            const labor = parseNum(currentFinalData?.['노무비'] ?? mItem?.['노무비']);
            const totalCost = baseInPrice + outsrc + labor;

            const whCode = String(currentFinalData?.['창고'] ?? mItem?.['창고'] ?? '').trim();
            const unitStr = String(currentFinalData?.['단위'] ?? mItem?.['단위'] ?? '').trim().toLowerCase();
            
            const matchWh = (ruleWh, targetWh) => ruleWh === '*' || ruleWh.split(/[,./|\s]+/).map(s => s.trim()).filter(Boolean).some(s => s === targetWh || (targetWh !== '' && !isNaN(s) && !isNaN(targetWh) && Number(s) === Number(targetWh)));
            const matchUnit = (ruleUnit, targetUnit) => ruleUnit === '*' || ruleUnit.toLowerCase().split(/[,./|\s]+/).map(s => s.trim()).filter(Boolean).some(s => targetUnit === s || targetUnit.includes(s));

            let bestRule = { rate: 10, type: 'divide' }, bestScore = -1;
            marginRules.forEach(r => {
                if (matchWh(r.whCode, whCode) && matchUnit(r.unit, unitStr)) {
                    let score = 0; if (r.whCode !== '*') score += 2; if (r.unit !== '*') score += 1;
                    if (score > bestScore) { bestScore = score; bestRule = r; }
                }
            });

            let calcOutPrice = totalCost;
            if (bestRule.type === 'divide') {
                const safeRate = Math.min(bestRule.rate, 99.99); calcOutPrice = totalCost / (1 - (safeRate / 100));
            } else calcOutPrice = totalCost * (1 + (bestRule.rate / 100));
            calcOutPrice = Math.round(calcOutPrice / 100) * 100;
            if (!isFinite(calcOutPrice) || isNaN(calcOutPrice)) calcOutPrice = 0;

            let newFinalData = { ...currentFinalData, '입고가': baseInPrice, '시중가': calcOutPrice };
            const providedOutPrice = parseNum(currentFinalData?.['출고가']), mIn = parseNum(mItem?.['입고가']), mOut = parseNum(mItem?.['출고가']);

            if (providedOutPrice > 0 && !forceRecalc) newFinalData['출고가'] = providedOutPrice;
            else if (baseInPrice === mIn && mOut > 0 && !forceRecalc) newFinalData['출고가'] = mOut;
            else newFinalData['출고가'] = calcOutPrice;

            const div1 = parseNum(currentFinalData?.['1종연산'] ?? mItem?.['1종연산']), extraCost = parseNum(currentFinalData?.['경비'] ?? mItem?.['경비']); 
            if (div1 > 0) {
                newFinalData['1입고'] = Math.round(((baseInPrice + outsrc) / div1) / 100) * 100;
                let calc1Out = Math.round((newFinalData['출고가'] / div1) + extraCost);
                newFinalData['1출고'] = (!isFinite(calc1Out) || isNaN(calc1Out)) ? 0 : Math.round(calc1Out / 100) * 100; 
            }
            return newFinalData;
        };

        const createHeaderMap = (actualHeaders, mappingConfig) => {
            const headerMap = {}; if(!mappingConfig) return headerMap;
            Object.keys(mappingConfig).forEach(field => {
                const keywords = mappingConfig[field].split(',').map(s => s.trim().toLowerCase().replace(/\s/g, '')).filter(Boolean);
                let matchedKey = actualHeaders.find(h => h && keywords.some(kw => String(h).toLowerCase().replace(/\s/g, '') === kw));
                if (!matchedKey) { matchedKey = actualHeaders.find(h => h && keywords.some(kw => String(h).toLowerCase().replace(/\s/g, '').includes(kw))); }
                if(matchedKey) headerMap[field] = matchedKey;
            }); return headerMap;
        };

        // ==========================================
        // 🧩 2. 공용 UI 컴포넌트
        // ==========================================
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="h-screen w-full flex flex-col items-center justify-center bg-slate-50 p-6">
                            <i className="fas fa-exclamation-triangle text-rose-500 text-6xl mb-6"></i>
                            <h1 className="text-2xl font-black text-slate-800 mb-2">화면 렌더링 오류 발생 (Crash)</h1>
                            <p className="text-slate-500 mb-6 text-center">불러온 데이터 중 잘못된 형식이 섞여있어 화면이 중단되었습니다.<br/>아래 [초기화] 버튼을 눌러 복구해 주세요.</p>
                            <div className="bg-white border border-rose-200 p-4 rounded-lg text-xs font-mono text-rose-600 w-full max-w-2xl overflow-auto mb-8 shadow-sm">{this.state.error && this.state.error.toString()}</div>
                            <button onClick={() => { indexedDB.deleteDatabase('MerchOpsDB'); localStorage.removeItem('merchMaster_v870'); window.location.reload(); }} className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition-colors shadow-lg flex items-center gap-2">
                                <i className="fas fa-redo-alt"></i> 로컬 데이터 초기화 및 복구하기
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const SafeIcon = React.memo(function SafeIconComponent({ name, size = 18, className = "" }) {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const kebabName = name.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();
                    const possibleNames = [
                        kebabName, name,
                        name === 'cloud-download' ? 'download-cloud' : name,
                        name === 'cloud-upload' ? 'upload-cloud' : name,
                        name === 'bar-chart-3' ? 'bar-chart' : name
                    ];
                    for (const pName of possibleNames) {
                        if (window.lucide.icons[pName]) {
                            setSvg(window.lucide.icons[pName].toSvg({ width: size, height: size, class: className, 'stroke-width': 2.5 })); return;
                        }
                    }
                }
            }, [name, size, className]);

            if (!svg) {
                const faMap = {
                    'cloud-download':'fa-cloud-download-alt', 'cloud-upload':'fa-cloud-upload-alt', 'settings':'fa-cogs', 
                    'layout-dashboard':'fa-th-large', 'package-search':'fa-box-open', 'file-spreadsheet':'fa-table', 
                    'zap':'fa-bolt', 'truck':'fa-truck', 'boxes':'fa-boxes', 'bar-chart-3':'fa-chart-bar', 
                    'check-circle-2':'fa-check-circle', 'x':'fa-times', 'database':'fa-database', 'upload':'fa-upload', 
                    'pie-chart':'fa-chart-pie', 'shopping-cart':'fa-shopping-cart', 'users':'fa-users', 'megaphone':'fa-bullhorn', 
                    'book-open':'fa-address-book', 'shopping-bag':'fa-shopping-bag', 'credit-card':'fa-credit-card', 
                    'line-chart':'fa-chart-line', 'printer':'fa-print', 'search':'fa-search', 'plus':'fa-plus', 
                    'trash-alt':'fa-trash-alt', 'edit':'fa-edit', 'save':'fa-save', 'file-excel':'fa-file-excel', 
                    'link':'fa-link', 'ban':'fa-ban', 'layer-group':'fa-layer-group', 'desktop':'fa-desktop', 
                    'sign-in-alt':'fa-sign-in-alt', 'calculator':'fa-calculator', 'tags':'fa-tags', 'broom':'fa-broom', 
                    'info-circle':'fa-info-circle', 'lock':'fa-lock', 'key':'fa-key', 'folder-open':'fa-folder-open', 
                    'file-invoice':'fa-file-invoice', 'history':'fa-history', 'redo-alt': 'fa-redo-alt', 
                    'file-export':'fa-file-export', 'sitemap':'fa-sitemap', 'bolt':'fa-bolt', 'sort-amount-down':'fa-sort-amount-down', 
                    'undo':'fa-undo', 'exchange-alt':'fa-exchange-alt', 'list':'fa-list', 'check-double':'fa-check-double', 
                    'balance-scale':'fa-balance-scale', 'search-plus':'fa-search-plus', 'truck-loading':'fa-truck-loading', 
                    'exclamation-circle': 'fa-exclamation-circle', 'calendar-alt': 'fa-calendar-alt', 'cut':'fa-cut', 
                    'rocket':'fa-rocket', 'archive':'fa-archive', 'filter':'fa-filter', 'alert-triangle':'fa-exclamation-triangle', 
                    'download':'fa-download', 'skull':'fa-skull', 'sliders-horizontal':'fa-sliders-h', 'arrow-up':'fa-arrow-up', 
                    'arrow-down':'fa-arrow-down', 'star':'fa-star', 'equals':'fa-equals'
                };
                const faName = faMap[name] || `fa-${name}`;
                return <i className={`fas ${faName} ${className}`} style={{ fontSize: size }} />;
            }
            return <span className="inline-flex shrink-0 items-center justify-center" dangerouslySetInnerHTML={{ __html: svg }} />;
        });

        const GlobalHeader = ({ activeTab, itemCount, isProcessing, processMsg, onOpenSettings, onPush, onPull, onNavigate }) => {
            const groups = [
                { id: 'master', label: '정보 관리', icon: 'database' },
                { id: 'ops', label: '운영 관리', icon: 'truck' },
                { id: 'admin', label: '인사이트', icon: 'bar-chart-3' }
            ];

            const groupLabels = { master: "MerchOps", ops: "DataOps", admin: "Insite", common: "Platform" };

            const tabs = [
                { id: 'dashboard', label: '통합 대시보드', icon: "layout-dashboard", path: 'Dashboard.html', group: 'common', isReady: true, shortTag: 'TOTAL BOARD' },
                { id: 'guide', label: '시스템 가이드', icon: "book-open", path: 'Guide/guide.html', group: 'common', isReady: true, shortTag: 'USER MANUAL' },
                { id: 'item-info', label: '마스터 DB', icon: "database", path: 'Master.html', group: 'master', isReady: true, shortTag: 'GOLDEN MASTER' },
                { id: 'item-manage', label: '상품 관리', icon: "package-search", path: 'Item_manager.html', group: 'master', isReady: true, shortTag: 'ITEM FORGE' },
                { id: 'pipeline', label: '시세 관리', icon: "file-spreadsheet", path: 'Pipeline.html', group: 'master', isReady: true, shortTag: 'PRICE HUB' },
                { id: 'parser', label: '스마트 파서', icon: "zap", path: 'Parser.html', group: 'master', isReady: true, shortTag: 'AUTO PARSER' },
                { id: 'partner-db', label: '거래처 DB', icon: "book-open", path: 'partner_db.html', group: 'master', isReady: true, shortTag: 'ENTITY REGISTER' },
                { id: 'partners', label: '거래처 관리', icon: "users", path: 'partners.html', group: 'master', isReady: true, shortTag: 'NETWORK CRM' },
                { id: 'orders', label: '주문 관리', icon: "shopping-bag", path: 'orders.html', group: 'ops', isReady: true, shortTag: 'ORDER FLOW' },
                { id: 'purchases', label: '구매 관리', icon: "credit-card", path: 'purchases.html', group: 'ops', isReady: true, shortTag: 'SOURCING' },
                { id: 'sales', label: '판매 관리', icon: "line-chart", path: 'sales.html', group: 'ops', isReady: true, shortTag: 'REVENUE' },
                { id: 'inventory', label: '재고 마감', icon: "boxes", path: 'inventory.html', group: 'ops', isReady: true, shortTag: 'STOCK CLOSING' },
                { id: 'print-center', label: '출력 센터', icon: "printer", path: 'print_center.html', group: 'ops', isReady: true, shortTag: 'OUTPUT TERM' },
                { id: 'insight', label: '경영 보고서', icon: "pie-chart", path: 'Report.html', group: 'admin', isReady: true, shortTag: 'INSIGHT CORE' },
                { id: 'cs', label: '정보 마당', icon: "megaphone", path: 'cs.html', group: 'admin', isReady: true, shortTag: 'BOARD' }
            ];

            const currentTab = tabs.find(t => t.id === activeTab);
            const activeGroup = currentTab ? currentTab.group : 'common';
            const [selectedGroup, setSelectedGroup] = useState(activeGroup);

            const activeGroupLabel = groupLabels[selectedGroup] || "Platform";

            const handleGroupClick = (groupId) => setSelectedGroup(prev => prev === groupId ? 'common' : groupId);
            const handleLogoClick = (e) => { setSelectedGroup('common'); onNavigate(e, 'Dashboard.html', true); };

            return (
                <div className="flex flex-col shrink-0 z-40 relative w-full shadow-sm bg-[#0B1021]">
                    <header className="h-[72px] bg-[#0B1021] text-white flex justify-between px-6 border-b border-slate-800/80 relative z-20">
                        <div className="flex items-center h-full">
                            <div className="flex items-center cursor-pointer group mr-10 h-full" onClick={handleLogoClick} title="메인 대시보드로 이동">
                                <span className="font-black text-[24px] tracking-wider text-slate-100 mr-4 group-hover:text-indigo-400 transition-colors">NEXUS</span>
                                <div className="flex flex-col border-l-2 border-slate-700/70 pl-4 py-0.5">
                                    <div className="flex items-center">
                                        <span className="font-black text-[16px] leading-none text-indigo-400 tracking-widest uppercase mt-0.5">{activeGroupLabel}</span>
                                        <span className="ml-2.5 bg-indigo-500/10 border border-indigo-400/30 text-indigo-400 px-[5px] py-[2px] rounded text-[9px] font-black tracking-wider shadow-sm leading-none">v1.6</span>
                                    </div>

                    {selectedGroup && (

        };

        const IframeSettingsModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[500] flex bg-slate-900/60 backdrop-blur-sm fade-in cursor-pointer" onClick={onClose}>
                    <div className="w-full max-w-[1400px] h-full bg-white shadow-[-10px_0_40px_rgba(0,0,0,0.3)] flex flex-col slide-in-right border-l border-slate-300 relative overflow-hidden ml-auto cursor-default" onClick={(e) => e.stopPropagation()}>
                        <div className="bg-[#0f172a] px-6 py-4 flex justify-between items-center text-white shrink-0 border-b border-slate-700 shadow-md relative z-10">
                            <div className="flex items-center gap-3">
                                <SafeIcon name="settings" size={20} className="text-indigo-400"/>
                                <h2 className="font-black text-[17px] tracking-wide">통합 환경설정 센터</h2>
                                <span className="bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded text-[10px] font-bold border border-indigo-500/30 ml-2">Wide Overlay</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="text-[12px] text-slate-400 font-medium hidden md:inline-block">설정을 변경하고 창을 닫으면 작업 화면에 즉시 반영됩니다.</span>
                                <button onClick={onClose} className="text-slate-300 hover:text-white transition-colors bg-slate-800 hover:bg-rose-500 w-8 h-8 rounded-lg flex items-center justify-center shadow-sm border border-slate-700 hover:border-rose-400">
                                    <SafeIcon name="x" size={18} />
                                </button>
                            </div>
                        </div>
                        <div className="flex-1 w-full bg-slate-100 relative">
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <div className="text-slate-300 flex flex-col items-center">
                                    <i className="fas fa-circle-notch fa-spin text-3xl mb-3"></i>
                                    <span className="font-bold text-sm">설정 모듈을 불러오는 중입니다...</span>
                                </div>
                            </div>
                            <iframe src="settings.html?mode=iframe" className="absolute inset-0 w-full h-full border-0 bg-white relative z-10" title="Settings Center"></iframe>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 🧩 3. 시세 관리(Pipeline) 전용 기능 및 모달
        // ==========================================
        const useMerchConfig = () => {
            const loadConfig = () => {
                const cloudUrl = localStorage.getItem(STORAGE_KEYS.CLOUD_URL) || '';
                
                // 🌟 V1.6 기획안 맞춤형 강제 기본값 적용 (새로운 키 사용)
                let visibleMasterCols = JSON.parse(localStorage.getItem('merchVisMaster_v160') || 'null');
                if (!visibleMasterCols || !visibleMasterCols.estimate) visibleMasterCols = { estimate: ['입고가'] };

                let visibleUploadCols = JSON.parse(localStorage.getItem('merchVisUpload_v160') || 'null');
                if (!visibleUploadCols || !visibleUploadCols.estimate) visibleUploadCols = { estimate: ['입고가', '입고B', '도매A', '도매B'] };

                let mappings = JSON.parse(localStorage.getItem('merchMappings_v870') || 'null');
                if (!mappings || !mappings.master) mappings = { master: { '창고': '창고, 창고코드', '품목코드': '품목코드, 상품코드, 바코드, 상품번호, 코드', '품목명': '품목명, 상품명, 품명, 상품이름', '규격': '규격, 규격명, 사이즈, 단량', '출고가': '출고가, 출고, 판매가, 시중가', '입고가': '입고가, 입고, 매입가' }, estimate: { '창고': '창고, 창고코드', '품목코드': '품목코드, 상품코드, 바코드, 상품번호, 코드', '품목명': '품목명, 상품명, 품명, 상품이름', '규격': '규격명, 규격, 사이즈, 단량', '구매처': '거래처명, 구매처, 거래처', '견적서': '견적서, 카테고리, 템플릿, 견적분류', '입고가': '입고가, 입고, 매입가', '출고가': '출고가, 출고, 판매가', '입고B': 'B단가, 입고B', '도매A': 'A판매, A판매가, 도매A', '도매B': 'B판매, B판매가, 도매B', '간단설명': '지시사항, 간단설명, 비고' } };

                let masterLinks = JSON.parse(localStorage.getItem('merchMasterLinks_v870') || 'null');
                if (!masterLinks || !masterLinks.estimate) masterLinks = { estimate: { '창고': '창고', '구매처': '구매처', '견적서': '견적서', '입고가': '입고가', '출고가': '출고가', '입고B': '입고B', '도매A': '도매A', '도매B': '도매B', '간단설명': '간단설명', '순번': '순번' } };

                let marginRules = JSON.parse(localStorage.getItem('merchMarginRules_v878') || 'null');
                if (!marginRules || marginRules.length <= 2) {
                    marginRules = [
                        { id: generateUUID(), whCode: '01', unit: 'box, 박스', rate: 10, type: 'divide' },
                        { id: generateUUID(), whCode: '01', unit: 'ea, 개, 낱개', rate: 15, type: 'divide' },
                        { id: generateUUID(), whCode: '03, 05', unit: 'box, 박스', rate: 15, type: 'divide' },
                        { id: generateUUID(), whCode: '03, 05', unit: 'ea, 개, 낱개', rate: 20, type: 'divide' },
                        { id: generateUUID(), whCode: '*', unit: 'box, 박스', rate: 10, type: 'divide' },
                        { id: generateUUID(), whCode: '*', unit: 'ea, 개, 낱개', rate: 15, type: 'divide' },
                        { id: 'default', whCode: '*', unit: '*', rate: 20, type: 'divide' }
                    ];
                    localStorage.setItem('merchMarginRules_v878', JSON.stringify(marginRules));
                }
                
                // 설정 저장 보장
                localStorage.setItem('merchVisMaster_v160', JSON.stringify(visibleMasterCols));
                localStorage.setItem('merchVisUpload_v160', JSON.stringify(visibleUploadCols));

                return { cloudUrl, visibleMasterCols, visibleUploadCols, mappings, masterLinks, marginRules };
            };
            const [config, setConfig] = useState(loadConfig());
            useEffect(() => {
                const handleStorageChange = () => setConfig(loadConfig());
                window.addEventListener('storage', handleStorageChange);
                return () => window.removeEventListener('storage', handleStorageChange);
            }, []);
            return config;
        };

        const ReviewPriceCell = React.memo(({ code, initialVal, oldVal, disabled, onUpdate }) => {
            const [localVal, setLocalVal] = useState(initialVal);
            const [isFocused, setIsFocused] = useState(false);

            useEffect(() => {
                if (!isFocused) setLocalVal(initialVal);
            }, [initialVal, isFocused]);

            const commitChange = (val) => {
                if (String(val) !== String(initialVal)) onUpdate(code, val);
            };

            const handleKeyDown = (e) => {
                if (['ArrowUp', 'ArrowDown', 'Enter'].includes(e.key)) {
                    e.preventDefault();
                    const inputs = Array.from(document.querySelectorAll('.review-price-input:not([disabled])'));
                    const currentIndex = inputs.indexOf(e.target);
                    if (currentIndex === -1) return;

                    let nextIndex = currentIndex;
                    if (e.key === 'ArrowUp') nextIndex = Math.max(0, currentIndex - 1);
                    if (e.key === 'ArrowDown' || e.key === 'Enter') nextIndex = Math.min(inputs.length - 1, currentIndex + 1);

                    if (nextIndex !== currentIndex) {
                        e.target.blur(); 
                        inputs[nextIndex].focus();
                        setTimeout(() => inputs[nextIndex].select(), 0);
                    } else if (e.key === 'Enter') {
                        e.target.blur(); 
                    }
                }
            };

            const isDiff = oldVal > 0 && Number(localVal) !== oldVal;

            return (
                <input 
                    type="number" 
                    className={`review-price-input w-full text-right px-2 py-1.5 rounded bg-transparent border-b outline-none font-black text-[13px] transition-colors focus:bg-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-300 shadow-sm ${isDiff ? 'text-indigo-600 border-indigo-200' : 'text-slate-700 border-transparent hover:border-slate-300'}`}
                    value={localVal === 0 ? '' : localVal}
                    onChange={(e) => setLocalVal(e.target.value)}
                    onFocus={(e) => { setIsFocused(true); setTimeout(() => e.target.select(), 0); }}
                    onBlur={(e) => { setIsFocused(false); commitChange(e.target.value); }}
                    onKeyDown={handleKeyDown}
                    placeholder={oldVal > 0 ? oldVal : ''}
                    disabled={disabled}
                />
            );
        });

        const ReviewModalRow = React.memo(({ item, isChecked, onToggleCheck, onPriceChange }) => {
            return (
                <tr className={`transition-colors h-[44px] ${isChecked ? 'hover:bg-slate-50' : 'bg-slate-50/50 opacity-60'}`}>
                    <td className="px-3 py-1.5 text-center">
                        <input 
                            type="checkbox" 
                            className="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                            checked={isChecked}
                            onChange={() => onToggleCheck(item.코드)}
                        />
                    </td>
                    <td className="px-2 py-1.5 text-slate-600 truncate max-w-[100px] font-bold">{item.거래처}</td>
                    <td className="px-4 py-1.5 font-black truncate max-w-[250px] text-slate-800">{item.엑셀품명}</td>
                    <td className="px-4 py-1.5 text-slate-500 truncate max-w-[150px]">{item.엑셀규격}</td>
                    <td className="px-4 py-1.5 text-right text-slate-400 line-through decoration-slate-300">
                        {item.기존단가 > 0 ? item.기존단가.toLocaleString() : '-'}
                    </td>
                    <td className="px-4 py-1 bg-indigo-50/30">
                        <ReviewPriceCell 
                            code={item.코드} 
                            initialVal={item.새단가} 
                            oldVal={item.기존단가} 
                            disabled={!isChecked} 
                            onUpdate={onPriceChange} 
                        />
                    </td>
                    <td className="px-4 py-1.5 text-[11px]">
                        <div className="flex flex-col gap-0.5 items-start">
                            {item.issues.length === 0 ? <span className="text-slate-300">-</span> : item.issues.map((iss, jdx) => <span key={jdx} className={iss.color}>{iss.text}</span>)}
                        </div>
                    </td>
                </tr>
            );
        }, (prev, next) => {
            return prev.item.코드 === next.item.코드 &&
                   prev.isChecked === next.isChecked &&
                   prev.item.새단가 === next.item.새단가;
        });

        // 🌟 통합 검증 및 확정 모달 (F8/F9 연동)
        const ReviewModal = ({ onClose, onConfirm, displayRows, masterProducts, availableCategories }) => {
            const [filter, setFilter] = useState('all'); 
            const [vendorFilter, setVendorFilter] = useState('all');
            const [editedPrices, setEditedPrices] = useState({}); 
            
            const [catalogOption, setCatalogOption] = useState('none'); 
            const [selectedExistingCatalog, setSelectedExistingCatalog] = useState('');
            const [newCatalogName, setNewCatalogName] = useState('');
            const [overrideNameSpec, setOverrideNameSpec] = useState(false);

            const [isReadyToSave, setIsReadyToSave] = useState(false);
            
            const [checkedItems, setCheckedItems] = useState(new Set());

            const [scrollTop, setScrollTop] = useState(0);
            const handleScroll = useCallback((e) => setScrollTop(e.target.scrollTop), []);

            useEffect(() => {
                const savedTag = localStorage.getItem('merchPipeline_CurrentTag');
                if (savedTag) {
                    const isExisting = availableCategories.find(c => c.name === savedTag);
                    if (isExisting) {
                        setCatalogOption('existing');
                        setSelectedExistingCatalog(savedTag);
                    } else {
                        setCatalogOption('new');
                        setNewCatalogName(savedTag);
                    }
                }
            }, [availableCategories]);

            useEffect(() => {
                const timer = setTimeout(() => setIsReadyToSave(true), 800); 
                return () => clearTimeout(timer);
            }, []);

            const analysis = useMemo(() => {
                let up = 0, down = 0, changed = 0, same = 0, newItems = 0; 
                const list = []; const vendors = new Set(); 

                displayRows.forEach(row => {
                    const rowCode = row.코드 || row.품목코드;
                    const mItem = masterProducts[rowCode] || masterProducts[row.품목코드] || {}; 
                    const oldP = mItem ? parseNum(mItem['입고가']) : 0; 
                    
                    const newP = editedPrices[rowCode] !== undefined 
                        ? parseNum(editedPrices[rowCode])
                        : parseNum(row.finalData?.['입고가'] !== undefined 
                            ? row.finalData['입고가'] 
                            : (row.sources?.['estimate']?.['입고가'] !== undefined && row.sources?.['estimate']?.['입고가'] !== '' ? row.sources['estimate']['입고가'] : oldP));
                    
                    const vendor = row.finalData?.['구매처'] || row.sources?.['estimate']?.['구매처'] || mItem?.['구매처'] || '미지정';
                    vendors.add(vendor);

                    const masterName = mItem?.품목명 || '';
                    const masterSpec = mItem?.규격 || '';
                    const excelName = row.finalData?.['품목명'] || row.sources?.['estimate']?.['품목명'] || masterName || '';
                    const excelSpec = row.finalData?.['규격'] || row.sources?.['estimate']?.['규격'] || masterSpec || '';

                    let status = 'same'; let issues = [];

                    if (!mItem.품목명 && !mItem.코드) { 
                        status = 'new'; newItems++; issues.push({ text: '신규', color: 'text-emerald-500 font-bold bg-emerald-50 px-1.5 py-0.5 rounded' });
                    } else {
                        let priceChanged = false;
                        if (newP > oldP && oldP > 0) { status = 'up'; up++; priceChanged = true; issues.push({ text: `+${(newP-oldP).toLocaleString()}`, color: 'text-rose-500 font-bold bg-rose-50 px-1.5 py-0.5 rounded' }); } 
                        else if (newP < oldP && newP > 0) { status = 'down'; down++; priceChanged = true; issues.push({ text: `${(newP-oldP).toLocaleString()}`, color: 'text-blue-500 font-bold bg-blue-50 px-1.5 py-0.5 rounded' }); }

                        let textChanged = false;
                        if (masterName && excelName && String(masterName).trim() !== String(excelName).trim()) {
                            textChanged = true; issues.push({ text: `${masterName}`, color: 'text-amber-600 font-medium bg-amber-50 px-1.5 py-0.5 rounded' });
                        }
                        if (masterSpec && excelSpec && String(masterSpec).trim() !== String(excelSpec).trim()) {
                            textChanged = true; issues.push({ text: `${masterSpec}`, color: 'text-amber-600 font-medium bg-amber-50 px-1.5 py-0.5 rounded' });
                        }

                        if (!priceChanged) {
                            if (textChanged) { status = 'changed'; changed++; } else { status = 'same'; same++; }
                        }
                    }

                    list.push({ 
                        코드: rowCode, 엑셀품명: excelName, 엑셀규격: excelSpec, 거래처: vendor, 
                        기존단가: oldP, 새단가: newP, issues: issues, 상태: status 
                    });
                });

                list.sort((a, b) => { if (a.거래처 !== b.거래처) return a.거래처.localeCompare(b.거래처); return String(a.코드).localeCompare(String(b.코드)); });
                return { up, down, changed, same, newItems, total: displayRows.length, list, vendors: Array.from(vendors).sort() };
            }, [displayRows, masterProducts, editedPrices]);

            const filteredList = useMemo(() => {
                return analysis.list.filter(i => {
                    const statusMatch = filter === 'all' || i.상태 === filter;
                    const vendorMatch = vendorFilter === 'all' || i.거래처 === vendorFilter;
                    return statusMatch && vendorMatch;
                });
            }, [analysis.list, filter, vendorFilter]);
            
            useEffect(() => {
                const allCodes = new Set(analysis.list.map(i => i.코드));
                setCheckedItems(allCodes);
            }, [analysis.list]);

            const toggleCheck = useCallback((code) => {
                setCheckedItems(prev => {
                    const next = new Set(prev);
                    if (next.has(code)) next.delete(code); else next.add(code);
                    return next;
                });
            }, []);

            const toggleAll = () => {
                const isAllChecked = filteredList.length > 0 && filteredList.every(i => checkedItems.has(i.코드));
                setCheckedItems(prev => {
                    const next = new Set(prev);
                    if (isAllChecked) filteredList.forEach(i => next.delete(i.코드));
                    else filteredList.forEach(i => next.add(i.코드));
                    return next;
                });
            };

            const checkedTargetCodes = useMemo(() => {
                return filteredList.filter(i => checkedItems.has(i.코드)).map(r => r.코드);
            }, [filteredList, checkedItems]);

            // 🌟 F8 / F9 단축키 연결 (리포트 이동 vs 엑셀 출력)
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'F8' || e.key === 'F9') {
                        e.preventDefault();
                        e.stopPropagation(); 
                        
                        if (!isReadyToSave) return; 
                        
                        const isInvalid = checkedTargetCodes.length === 0 || 
                                          (catalogOption === 'existing' && !selectedExistingCatalog) || 
                                          (catalogOption === 'new' && !newCatalogName.trim());
                                          
                        if (!isInvalid) {
                            const action = e.key === 'F8' ? 'report' : 'export';
                            onConfirm(checkedTargetCodes, { catalogOption, selectedExistingCatalog, newCatalogName, overrideNameSpec }, editedPrices, action); 
                            onClose();
                        } else if (catalogOption === 'new' && !newCatalogName.trim()) {
                            const input = document.getElementById('new-catalog-input');
                            if(input) input.focus();
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown, true);
                return () => window.removeEventListener('keydown', handleKeyDown, true);
            }, [isReadyToSave, filter, vendorFilter, catalogOption, selectedExistingCatalog, newCatalogName, overrideNameSpec, editedPrices, onConfirm, onClose, checkedTargetCodes]);

            const handlePriceChange = useCallback((code, value) => {
                setEditedPrices(prev => ({ ...prev, [code]: value }));
            }, []);

            const ROW_HEIGHT = 44; 
            const BUFFER_SIZE = 15; 
            const VIEWPORT_HEIGHT = window.innerHeight * 0.7;

            const startIndex = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - BUFFER_SIZE);
            const endIndex = Math.min(filteredList.length, Math.floor((scrollTop + VIEWPORT_HEIGHT) / ROW_HEIGHT) + BUFFER_SIZE);

            const virtualRows = filteredList.slice(startIndex, endIndex);
            const topPadding = startIndex * ROW_HEIGHT;
            const bottomPadding = Math.max(0, (filteredList.length - endIndex) * ROW_HEIGHT);

            const filterButtons = [
                {id:'all', label:'전체', val:analysis.total, color:'slate', icon:'fa-list'},
                {id:'up', label:'인상', val:analysis.up, color:'rose', icon:'fa-arrow-up'},
                {id:'down', label:'인하', val:analysis.down, color:'blue', icon:'fa-arrow-down'},
                {id:'new', label:'신규', val:analysis.newItems, color:'emerald', icon:'fa-star'},
                {id:'changed', label:'항목변경', val:analysis.changed, color:'amber', icon:'fa-edit'},
                {id:'same', label:'동결', val:analysis.same, color:'slate', icon:'fa-equals'}
            ];

            return (
                <div className="fixed inset-0 flex justify-center items-center bg-slate-900/80 backdrop-blur-sm fade-in z-[100]">
                    <div className="bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden w-[1100px] h-[90vh]">
                        <div className="bg-[#0f172a] p-4 text-white flex justify-between items-center border-b border-slate-700 shrink-0">
                            <h2 className="font-black text-[16px] flex items-center"><SafeIcon name="check-circle-2" className="text-indigo-400 mr-2"/>단가 및 마진 검증 (최종 반영)</h2>
                            <button onClick={onClose}><SafeIcon name="x" className="text-slate-400 hover:text-white" size={20}/></button>
                        </div>
                        
                        <div className="p-4 bg-slate-100 border-b border-slate-300 flex items-center justify-between shrink-0 shadow-inner z-20">
                            <div className="flex gap-2">
                                {filterButtons.map(b => (
                                    <button 
                                        key={b.id} 
                                        onClick={()=>{setFilter(b.id); setScrollTop(0); document.getElementById('review-modal-scroll')?.scrollTo(0,0);}} 
                                        className={`flex flex-col items-center justify-center py-2 px-3 min-w-[85px] border rounded-xl transition-all shadow-sm ${filter===b.id ? `bg-${b.color}-500 text-white border-${b.color}-600 ring-2 ring-${b.color}-200` : `bg-white text-slate-600 border-slate-200 hover:border-${b.color}-300 hover:shadow-md`}`}
                                    >
                                        <div className={`text-[11px] font-bold mb-0.5 ${filter===b.id ? 'text-white/90' : `text-${b.color}-500`}`}>
                                            <i className={`fas ${b.icon} mr-1.5 opacity-80`}></i>{b.label}
                                        </div>
                                        <div className={`text-xl font-black tracking-tight ${filter===b.id ? 'text-white' : 'text-slate-800'}`}>
                                            {b.val}
                                        </div>
                                    </button>
                                ))}
                            </div>
                            
                            <div className="flex items-center gap-3">
                                <select value={vendorFilter} onChange={e => {setVendorFilter(e.target.value); setScrollTop(0); document.getElementById('review-modal-scroll')?.scrollTo(0,0);}} className="bg-white border border-slate-300 text-blue-700 text-[13px] py-2 px-3 rounded-xl outline-none focus:border-blue-400 h-11 font-bold shadow-sm w-[140px]">
                                    <option value="all">전체 거래처</option>
                                    {analysis.vendors.map(v => <option key={v} value={v}>{v}</option>)}
                                </select>
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col overflow-hidden bg-white relative">
                            <div id="review-modal-scroll" className="flex-1 overflow-auto custom-scrollbar relative" onScroll={handleScroll}>
                                <table className="w-full text-left text-[12px] relative z-0">
                                    <thead className="bg-white sticky top-0 border-b shadow-sm z-10">
                                        <tr>
                                            <th className="px-3 py-3.5 w-10 text-center">
                                                <input 
                                                    type="checkbox" 
                                                    className="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                                                    checked={filteredList.length > 0 && filteredList.every(i => checkedItems.has(i.코드))}
                                                    onChange={toggleAll}
                                                />
                                            </th>
                                            <th className="px-2 py-3.5 w-24 text-slate-500 font-bold">거래처</th>
                                            <th className="px-4 py-3.5 text-slate-500 font-bold">엑셀 품명</th>
                                            <th className="px-4 py-3.5 w-40 text-slate-500 font-bold">엑셀 규격</th>
                                            <th className="px-4 py-3.5 w-28 text-right text-slate-500 font-bold">기존 입고가</th>
                                            <th className="px-4 py-3.5 w-32 text-right text-indigo-600 font-black bg-indigo-50/50"><i className="fas fa-edit mr-1"></i>새 입고가</th>
                                            <th className="px-4 py-3.5 w-[260px] text-slate-500 font-bold">검증 이슈 (마스터 비교)</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 bg-white">
                                        {filteredList.length === 0 ? (
                                            <tr><td colSpan="7" className="py-16 text-center text-slate-400 font-bold"><i className="fas fa-search text-3xl mb-3 block text-slate-200"></i>조건에 맞는 데이터가 없습니다.</td></tr>
                                        ) : (
                                            <>
                                                {topPadding > 0 && <tr style={{ height: `${topPadding}px` }}><td colSpan="7" className="p-0 border-0"></td></tr>}
                                                {virtualRows.map((i,idx) => (
                                                    <ReviewModalRow 
                                                        key={`${i.코드}-${idx}`}
                                                        item={i}
                                                        isChecked={checkedItems.has(i.코드)}
                                                        onToggleCheck={toggleCheck}
                                                        onPriceChange={handlePriceChange}
                                                    />
                                                ))}
                                                {bottomPadding > 0 && <tr style={{ height: `${bottomPadding}px` }}><td colSpan="7" className="p-0 border-0"></td></tr>}
                                            </>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        
                        <div className="bg-slate-50 border-t border-slate-300 px-5 py-3 shrink-0 flex items-center justify-between z-20">
                            <label className="flex items-center gap-2 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-amber-300 hover:bg-amber-50 transition-colors shadow-sm">
                                <div className="relative flex items-center justify-center">
                                    <input type="checkbox" className="peer sr-only" checked={overrideNameSpec} onChange={(e) => setOverrideNameSpec(e.target.checked)} />
                                    <div className="w-4 h-4 border-2 border-amber-400 bg-white rounded peer-checked:bg-amber-500 transition-all flex items-center justify-center">
                                        <i className="fas fa-check text-white text-[10px] opacity-0 peer-checked:opacity-100"></i>
                                    </div>
                                </div>
                                <span className="text-[12px] font-black text-amber-900">품명/규격 덮어쓰기</span>
                            </label>

                            <div className="flex items-center gap-3">
                                <span className="text-[12px] font-bold text-slate-500"><i className="fas fa-folder-plus mr-1"></i>카탈로그:</span>
                                
                                <div className="flex items-center gap-4 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
                                    <label className="flex items-center cursor-pointer group">
                                        <input type="radio" name="catOpt" className="w-3.5 h-3.5 text-blue-600 border-slate-300 focus:ring-blue-500 cursor-pointer" checked={catalogOption==='existing'} onChange={()=>setCatalogOption('existing')} />
                                        <span className={`ml-1.5 text-[12px] font-bold transition-colors ${catalogOption==='existing' ? 'text-blue-700' : 'text-slate-600 group-hover:text-slate-800'}`}>기존 병합</span>
                                    </label>
                                    <label className="flex items-center cursor-pointer group">
                                        <input type="radio" name="catOpt" className="w-3.5 h-3.5 text-emerald-600 border-slate-300 focus:ring-emerald-500 cursor-pointer" checked={catalogOption==='new'} onChange={()=>setCatalogOption('new')} />
                                        <span className={`ml-1.5 text-[12px] font-bold transition-colors ${catalogOption==='new' ? 'text-emerald-700' : 'text-slate-600 group-hover:text-slate-800'}`}>신규 생성</span>
                                    </label>
                                    <label className="flex items-center cursor-pointer group">
                                        <input type="radio" name="catOpt" className="w-3.5 h-3.5 text-slate-600 border-slate-300 focus:ring-slate-500 cursor-pointer" checked={catalogOption==='none'} onChange={()=>setCatalogOption('none')} />
                                        <span className={`ml-1.5 text-[12px] font-bold transition-colors ${catalogOption==='none' ? 'text-slate-800' : 'text-slate-500 group-hover:text-slate-700'}`}>저장 안 함</span>
                                    </label>
                                </div>

                                <div className="w-[200px]">
                                    {catalogOption === 'existing' && (
                                        <select value={selectedExistingCatalog} onChange={(e)=>setSelectedExistingCatalog(e.target.value)} className="w-full text-[12px] p-1.5 font-bold text-blue-700 border border-blue-300 rounded bg-white outline-none focus:border-blue-500 fade-in shadow-sm h-8">
                                            <option value="">-- 선택 --</option>
                                            {availableCategories && availableCategories.map(c => <option key={c.name} value={c.name}>{c.name} ({c.count}건)</option>)}
                                        </select>
                                    )}
                                    {catalogOption === 'new' && (
                                        <input id="new-catalog-input" type="text" value={newCatalogName} onChange={(e)=>setNewCatalogName(e.target.value)} placeholder="새 이름 입력" className="w-full text-[12px] p-1.5 font-bold text-emerald-700 border border-emerald-300 rounded bg-white outline-none focus:border-emerald-500 fade-in shadow-sm h-8" />
                                    )}
                                </div>
                            </div>
                            
                            <div className="flex gap-2">
                                <button onClick={onClose} className="h-11 px-4 text-[13px] font-bold text-slate-600 bg-white rounded-xl border border-slate-300 hover:bg-slate-50 transition-colors shadow-sm">닫기</button>
                                <button 
                                    onClick={()=>{
                                        onConfirm(checkedTargetCodes, { catalogOption, selectedExistingCatalog, newCatalogName, overrideNameSpec }, editedPrices, 'report'); 
                                        onClose();
                                    }} 
                                    disabled={
                                        checkedTargetCodes.length === 0 || 
                                        (catalogOption === 'existing' && !selectedExistingCatalog) || 
                                        (catalogOption === 'new' && !newCatalogName.trim())
                                    }
                                    className="h-11 px-4 text-[13px] font-black text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 shadow-md flex items-center transition-colors disabled:bg-slate-300 disabled:text-slate-500 disabled:cursor-not-allowed"
                                >
                                    <SafeIcon name="pie-chart" className="mr-1.5" size={14}/> 반영 및 리포트 이동 [F8]
                                </button>
                                <button 
                                    onClick={()=>{
                                        onConfirm(checkedTargetCodes, { catalogOption, selectedExistingCatalog, newCatalogName, overrideNameSpec }, editedPrices, 'export'); 
                                        onClose();
                                    }} 
                                    disabled={
                                        checkedTargetCodes.length === 0 || 
                                        (catalogOption === 'existing' && !selectedExistingCatalog) || 
                                        (catalogOption === 'new' && !newCatalogName.trim())
                                    }
                                    className="h-11 px-4 text-[13px] font-black text-white bg-emerald-600 rounded-xl hover:bg-emerald-700 shadow-md flex items-center transition-colors disabled:bg-slate-300 disabled:text-slate-500 disabled:cursor-not-allowed"
                                >
                                    <SafeIcon name="file-excel" className="mr-1.5" size={14}/> 반영 및 엑셀 출력 [F9]
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const getCellWidthClass = (headerName) => {
            if (headerName === '순번') return 'min-w-[80px] w-[80px] max-w-[80px] text-center';
            if (['출고가', '입고가', '입고B', '도매A', '도매B', '상장가', '단가H', '단가I', '시중가', '행사가'].includes(headerName)) return 'min-w-[90px] w-[90px] max-w-[90px]';
            if (['간단설명', '지시사항', '비고'].includes(headerName)) return 'min-w-[200px] w-[200px] max-w-[200px]';
            if (['규격'].includes(headerName)) return 'min-w-[120px] w-[120px] max-w-[120px]';
            if (['구매처', '거래처명', '거래처'].includes(headerName)) return 'min-w-[120px] w-[120px] max-w-[120px]';
            return 'min-w-[100px] w-[100px] max-w-[100px]';
        };

        const EditableCell = React.memo(({ rowCode, initialVal, field, linkedMasterField, mVal, onUpdateCell }) => {
            const isNum = NUMERIC_HEADERS.includes(linkedMasterField) || NUMERIC_HEADERS.includes(field);
            const [val, setVal] = useState(initialVal); const [isFocused, setIsFocused] = useState(false);
            useEffect(() => { if(!isFocused) setVal(initialVal); }, [initialVal, isFocused]);
            const isDiff = linkedMasterField && mVal !== undefined && val !== '' && String(mVal) !== String(val) && isNum;
            const onBlur = () => { setIsFocused(false); if(String(val)!==String(initialVal)) onUpdateCell(rowCode, field, linkedMasterField, val); };
            
            const handleKeyDown = (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key)) {
                    if (e.key === 'ArrowLeft' && e.target.selectionStart !== 0) return;
                    if (e.key === 'ArrowRight' && e.target.selectionEnd !== e.target.value.length) return;
                    if (['ArrowUp', 'ArrowDown', 'Enter'].includes(e.key)) e.preventDefault();
                    
                    e.target.blur();
                    const td = e.target.closest('td'); const tr = td.closest('tr'); const tbody = tr.closest('tbody');
                    const tds = Array.from(tr.querySelectorAll('td:has(input[type="text"])'));
                    const colIdx = tds.indexOf(td);
                    const trs = Array.from(tbody.querySelectorAll('tr.data-row'));
                    const rowIdx = trs.indexOf(tr);

                    let nextRowIdx = rowIdx; let nextColIdx = colIdx;

                    if (e.key === 'ArrowUp') nextRowIdx = Math.max(0, rowIdx - 1);
                    if (e.key === 'ArrowDown' || e.key === 'Enter') nextRowIdx = Math.min(trs.length - 1, rowIdx + 1);
                    if (e.key === 'ArrowLeft') { e.preventDefault(); nextColIdx = Math.max(0, colIdx - 1); }
                    if (e.key === 'ArrowRight') { e.preventDefault(); nextColIdx = Math.min(tds.length - 1, colIdx + 1); }

                    if (nextRowIdx !== rowIdx || nextColIdx !== colIdx) {
                        const nextTr = trs[nextRowIdx];
                        if (nextTr) {
                            let nextInput;
                            if (e.key === 'Enter') nextInput = nextTr.querySelector('input[data-field="입고가"]') || nextTr.querySelector('td:has(input[type="text"]) input');
                            else { const nextTds = Array.from(nextTr.querySelectorAll('td:has(input[type="text"])')); nextInput = nextTds[nextColIdx]?.querySelector('input'); }
                            if (nextInput) { nextInput.focus(); setTimeout(() => nextInput.select(), 0); }
                        }
                    }
                }
            };

            return (
                <td className={`px-2 py-1.5 border-r border-slate-200 ${getCellWidthClass(linkedMasterField || field)}`}>
                    <input type="text" data-field={field} value={val==="오류"?"":val} placeholder={mVal||''} onChange={e=>setVal(e.target.value)} onFocus={e=>{setIsFocused(true); setTimeout(()=>e.target.select(),0);}} onBlur={onBlur} onKeyDown={handleKeyDown} onClick={e=>e.target.select()} className={`w-full bg-transparent hover:bg-white/50 focus:bg-white focus:ring-2 focus:ring-blue-400 rounded px-1.5 py-1.5 text-[13px] outline-none ${isNum?'text-right':'truncate text-center'} ${isDiff?'text-indigo-700 font-bold':'text-slate-700 font-medium'} transition-all`} />
                </td>
            );
        });

        const rowPropsAreEqual = (prevProps, nextProps) => {
            return prevProps.row.코드 === nextProps.row.코드 &&
                   prevProps.isSel === nextProps.isSel &&
                   prevProps.isEstimateUploaded === nextProps.isEstimateUploaded &&
                   JSON.stringify(prevProps.row.finalData) === JSON.stringify(nextProps.row.finalData);
        };

        const MemoizedTableRow = React.memo(({ row, idx, isSel, mItem, isEstimateUploaded, visMasterCols, visUploadCols, masterLinksEst, onToggleSelection, onMouseDown, onMouseEnter, onUpdateCell }) => {
            const dName = row.finalData?.['품목명'] || row.sources?.['estimate']?.['품목명'] || mItem.품목명 || '[미등록]';
            const dSpec = row.finalData?.['규격'] || row.sources?.['estimate']?.['규격'] || mItem.규격 || '';
            const rowCode = row.코드 || row.품목코드 || '';

            // 🌟 3. 수정된 상품 행 노란색 강조 로직
            let isRowModified = false;
            if (isEstimateUploaded) {
                visUploadCols.forEach(h => {
                    const linkedMasterField = masterLinksEst[h];
                    const mVal = (linkedMasterField && rowCode) ? mItem[linkedMasterField] : undefined;
                    const initialVal = row.finalData?.[h] !== undefined 
                        ? row.finalData[h] 
                        : (row.sources?.['estimate']?.[h] !== undefined && row.sources?.['estimate']?.[h] !== ''
                            ? row.sources['estimate'][h] 
                            : (mVal !== undefined ? mVal : ''));

                    if (linkedMasterField && mVal !== undefined) {
                        const isNum = NUMERIC_HEADERS.includes(linkedMasterField) || NUMERIC_HEADERS.includes(h);
                        if (isNum) {
                            if (parseNum(initialVal) !== parseNum(mVal)) isRowModified = true;
                        } else {
                            if (String(initialVal) !== String(mVal)) isRowModified = true;
                        }
                    }
                });
            }

            return (
                <tr className={`data-row border-b border-slate-100 ${isSel ? 'is-selected' : ''} ${isRowModified ? 'is-modified' : ''}`} onMouseDown={(e) => onMouseDown && onMouseDown(e, rowCode, isSel)} onMouseEnter={(e) => onMouseEnter && onMouseEnter(e, rowCode)}>
                    {/* 🌟 1. Split View: Fixed 영역 바탕색 및 경계선 처리 */}
                    <td className={`sticky z-20 px-4 py-3.5 border-slate-200 min-w-[280px] w-[280px] max-w-[280px] master-col ${!visMasterCols.length ? 'border-r-2 border-r-slate-300 shadow-[3px_0_5px_rgba(0,0,0,0.05)]' : 'border-r'}`} style={{left:0}}>
                        <div className="flex flex-col w-full overflow-hidden">
                            <span className="text-[10.5px] font-mono text-indigo-500 mb-0.5 tracking-tight font-bold">{rowCode}</span>
                            <div className="flex items-baseline w-full min-w-0 overflow-hidden mt-0.5">
                                <span className={`text-[13px] font-extrabold truncate text-slate-800 ${!mItem.품목명 ? 'text-rose-500' : ''}`} title={dName}>{dName}</span>
                                {dSpec && <span className="text-[11.5px] font-medium text-slate-400 truncate ml-1.5 shrink-0 max-w-[40%]" title={dSpec}>({dSpec})</span>}
                            </div>
                        </div>
                    </td>

                    {/* 🌟 1. Split View: 마스터 DB 영역 (연한 쿨그레이 및 굵은 경계선) */}
                    {!isEstimateUploaded ? (
                        visMasterCols.map((h, idx) => {
                            const isNum = NUMERIC_HEADERS.includes(h);
                            const mVal = mItem[h] !== undefined && mItem[h] !== '' ? (isNum ? parseNum(mItem[h]).toLocaleString() : mItem[h]) : '-';
                            const isLast = idx === visMasterCols.length - 1;
                            return (
                                <td key={`idle-td-${h}`} className={`master-col px-2 py-1.5 border-slate-200 text-slate-600 ${getCellWidthClass(h)} ${isLast ? 'border-r-2 border-r-slate-300 shadow-[3px_0_5px_rgba(0,0,0,0.05)] relative z-10' : 'border-r'} ${isNum ? 'text-right font-medium' : 'text-center'}`}>
                                    <div className="truncate w-full">{mVal}</div>
                                </td>
                            );
                        })
                    ) : (
                        <>
                            {visMasterCols.map((h, idx) => {
                                const isNum = NUMERIC_HEADERS.includes(h);
                                const mVal = mItem[h];
                                let displayVal = mVal; 
                                let isChanged = false;
                                let newDataVal = null; 

                                if (row.finalData && row.finalData[h] !== undefined) {
                                    if (isNum && parseNum(row.finalData[h]) !== parseNum(mVal)) { 
                                        isChanged = true; 
                                        newDataVal = row.finalData[h];
                                    } else if (!isNum && String(row.finalData[h]) !== String(mVal)) { 
                                        isChanged = true; 
                                        newDataVal = row.finalData[h];
                                    }
                                }
                                const formattedVal = displayVal !== undefined && displayVal !== '' ? (isNum ? parseNum(displayVal).toLocaleString() : displayVal) : '-';
                                const isLast = idx === visMasterCols.length - 1;
                                return (
                                    <td key={`pm-d-${h}`} className={`master-col px-2 py-1.5 border-slate-200 transition-colors ${getCellWidthClass(h)} ${isChanged ? 'text-slate-400' : ''} ${isLast ? 'border-r-2 border-r-slate-300 shadow-[3px_0_5px_rgba(0,0,0,0.05)] relative z-10' : 'border-r'} ${isNum ? 'text-right font-medium' : 'text-center'}`}>
                                        <div 
                                            className={`truncate w-full ${isChanged ? 'line-through decoration-rose-400 decoration-2 cursor-help' : 'text-slate-600'}`} 
                                            title={isChanged ? `변경 대기: ${newDataVal}` : ''}
                                        >
                                            {formattedVal}
                                        </div>
                                    </td>
                                );
                            })}
                            
                            {/* Editable 영역 */}
                            {visUploadCols.map(h => {
                                const linkedMasterField = masterLinksEst[h];
                                const mVal = (linkedMasterField && rowCode) ? mItem[linkedMasterField] : undefined;
                                
                                const initialVal = row.finalData?.[h] !== undefined 
                                    ? row.finalData[h] 
                                    : (row.sources?.['estimate']?.[h] !== undefined && row.sources?.['estimate']?.[h] !== ''
                                        ? row.sources['estimate'][h] 
                                        : (mVal !== undefined ? mVal : ''));

                                return <EditableCell key={`p-u-e-${h}`} rowCode={rowCode} initialVal={initialVal} field={h} linkedMasterField={linkedMasterField} mVal={mVal} onUpdateCell={onUpdateCell} />;
                            })}
                        </>
                    )}
                </tr>
            );
        }, rowPropsAreEqual);

        const ExcelDataGrid = ({ state, actions }) => {
            const { isEstimateUploaded, fullDisplayRows, visibleMasterCols, visibleUploadCols, masterProducts, masterLinksEst, selectedRows } = state;
            
            const [scrollTop, setScrollTop] = useState(0);
            const handleScroll = useCallback((e) => setScrollTop(e.target.scrollTop), []);

            const isDragging = useRef(false);
            const dragSelectMode = useRef(true);

            useEffect(() => {
                const handleMouseUp = () => { isDragging.current = false; };
                window.addEventListener('mouseup', handleMouseUp);
                return () => window.removeEventListener('mouseup', handleMouseUp);
            }, []);

            const handleMouseDown = useCallback((e, rowCode, isSel) => {
                const targetTag = e.target.tagName.toLowerCase();
                if (['input', 'select', 'button', 'i'].includes(targetTag)) return;
                isDragging.current = true;
                dragSelectMode.current = !isSel;
                actions.setRowSelection(rowCode, !isSel);
            }, [actions]);

            const handleMouseEnter = useCallback((e, rowCode) => {
                if (isDragging.current) {
                    actions.setRowSelection(rowCode, dragSelectMode.current);
                }
            }, [actions]);

            const ROW_HEIGHT = 56; 
            const BUFFER_SIZE = 15; 
            const VIEWPORT_HEIGHT = 800; 

            const startIndex = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - BUFFER_SIZE);
            const endIndex = Math.min(fullDisplayRows.length, Math.floor((scrollTop + VIEWPORT_HEIGHT) / ROW_HEIGHT) + BUFFER_SIZE);

            const displayRows = fullDisplayRows.slice(startIndex, endIndex);
            const topPadding = startIndex * ROW_HEIGHT;
            const bottomPadding = Math.max(0, (fullDisplayRows.length - endIndex) * ROW_HEIGHT);

            const visMaster = visibleMasterCols.estimate?.filter(h=>!['품목코드','품목명','규격'].includes(h)) || [];
            const safeVisibleUploadCols = visibleUploadCols || { estimate: ['입고가', '입고B', '도매A', '도매B'] };
            const visUpload = (safeVisibleUploadCols.estimate || []).filter(h=>h!=='품목코드');

            return (
                <div className="bg-white border border-slate-200 shadow-sm h-full flex flex-col overflow-hidden relative">
                    <div className="flex-1 overflow-auto custom-scrollbar relative" onScroll={handleScroll}>
                        <table className="text-left border-collapse text-[13px] whitespace-nowrap relative z-0 w-max bg-white">
                            <thead className="text-[12px] font-bold text-slate-50 bg-[#1e293b]">
                                <tr>
                                    {/* 🌟 1. Split View: Header 영역 경계선 처리 및 명확한 배경색 적용 */}
                                    <th className={`sticky top-0 z-40 bg-slate-100 text-slate-700 px-4 py-3.5 border-y border-slate-300 min-w-[280px] w-[280px] max-w-[280px] ${!isEstimateUploaded && visMaster.length === 0 ? 'border-r-2 border-r-slate-400 shadow-[4px_0_8px_rgba(0,0,0,0.15)]' : 'border-r'}`} style={{left:0}}>
                                        상품정보 (코드/품명/규격)
                                    </th>
                                    {visMaster.map((h, idx) => {
                                        const isLast = idx === visMaster.length - 1;
                                        return <th key={`m-${h}`} className={`sticky top-0 z-30 bg-slate-100 text-slate-700 px-3 py-3.5 border-y border-slate-300 text-center ${getCellWidthClass(h)} ${isEstimateUploaded && isLast ? 'border-r-2 border-r-slate-400 shadow-[4px_0_8px_rgba(0,0,0,0.15)] relative' : 'border-r'}`}><i className="fas fa-lock text-slate-400 text-[10px] mr-1"></i> {h}</th>
                                    })}
                                    
                                    {/* 🌟 작업 데이터가 로드되었을 때만 우측 편집 헤더 노출 */}
                                    {isEstimateUploaded && visUpload.map(h => <th key={`u-${h}`} className={`sticky top-0 z-30 bg-[#1e293b] px-3 py-3.5 border-y border-r border-slate-700 shadow-sm text-center text-indigo-300 ${getCellWidthClass(h)}`}><i className="fas fa-pen text-indigo-400 text-[10px] mr-1"></i> {h}</th>)}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-transparent text-slate-700">
                                {fullDisplayRows.length===0 ? (
                                    <tr><td colSpan="50" className="p-16 text-center text-slate-400 font-bold"><i className="fas fa-file-excel text-5xl mb-4 text-slate-200 block"></i>데이터가 없습니다. 카탈로그를 불러오거나 엑셀을 업로드하세요.</td></tr>
                                ) : (
                                    <>
                                        {topPadding > 0 && <tr style={{ height: `${topPadding}px` }}><td colSpan="50" className="p-0 border-0"></td></tr>}
                                        
                                        {displayRows.map((row, idx) => {
                                            const rowCode = row.코드 || row.품목코드;
                                            const mItem = masterProducts[rowCode] || masterProducts[row.품목코드] || {};
                                            const isSel = selectedRows.has(rowCode);
                                            return <MemoizedTableRow key={rowCode} row={{...row, 코드: rowCode}} idx={idx} isSel={isSel} mItem={mItem} isEstimateUploaded={isEstimateUploaded} visMasterCols={visMaster} visUploadCols={visUpload} masterLinksEst={masterLinksEst} onToggleSelection={actions.toggleRowSelection} onMouseDown={handleMouseDown} onMouseEnter={handleMouseEnter} onUpdateCell={actions.handleUpdateCell} />;
                                        })}
                                        
                                        {bottomPadding > 0 && <tr style={{ height: `${bottomPadding}px` }}><td colSpan="50" className="p-0 border-0"></td></tr>}
                                    </>
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        function App() {
            const config = useMerchConfig();
            
            const [toastMsg, setToastMsg] = useState('');
            const [isProcessing, setIsProcessing] = useState(false); 
            const [processMsg, setProcessMsg] = useState('');
            
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [showReviewModal, setShowReviewModal] = useState(false);
            
            const [masterProducts, setMasterProducts] = useState({});
            
            const [managedItems, setManagedItems] = useState({});

            const [globalSearch, setGlobalSearch] = useState('');
            const [selectedCatalogs, setSelectedCatalogs] = useState(new Set());
            const [selectedCategories, setSelectedCategories] = useState(new Set());
            const [catalogDropdownOpen, setCatalogDropdownOpen] = useState(false);
            const [categoryDropdownOpen, setCategoryDropdownOpen] = useState(false);
            const [selectedRows, setSelectedRows] = useState(new Set());

            const catalogRef = useRef(null);
            const categoryRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (catalogRef.current && !catalogRef.current.contains(event.target)) setCatalogDropdownOpen(false);
                    if (categoryRef.current && !categoryRef.current.contains(event.target)) setCategoryDropdownOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const showToast = useCallback((msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3000); }, []);
            
            const handleNavigate = useCallback((e, path, isReady = true) => {
                if (e && e.preventDefault) e.preventDefault();
                if (!path || path === '#' || !isReady) return showToast("⚠️ 해당 페이지는 현재 준비 중이거나 경로가 올바르지 않습니다.");
                try {
                    const protocol = window.location.protocol;
                    if (protocol === 'about:' || protocol === 'blob:' || protocol === 'data:') showToast(`💡 미리보기 환경: [${path}] 로 이동을 시뮬레이션 합니다.`);
                    else window.location.href = path;
                } catch (err) { showToast(`💡 이동 시뮬레이션: [${path}]`); }
            }, [showToast]);

            const loadMasterAndStaging = useCallback(async () => { 
                const mData = await getIDB(STORAGE_KEYS.MASTER_DB); 
                if (mData) setMasterProducts(mData); 
                
                const stagingData = await getIDB(STORAGE_KEYS.MANAGED_ITEMS);
                if (stagingData && Object.keys(stagingData).length > 0) {
                    setManagedItems(stagingData);
                    showToast("📥 파서에서 전송된 대기 데이터를 불러왔습니다.");
                }
            }, [showToast]);

            useEffect(() => { 
                loadMasterAndStaging(); 
                const onSync = (e) => { if(e.key === STORAGE_KEYS.SYNC_TRIGGER) loadMasterAndStaging(); }; 
                window.addEventListener('storage', onSync); 
                
                const handleMessage = (e) => {
                    if (e.data && e.data.type === 'CLOSE_SETTINGS') {
                        setShowSettingsModal(false); loadMasterAndStaging(); 
                    }
                };
                window.addEventListener('message', handleMessage);

                const handleKeyDown = (e) => {
                    if (e.key === 'F3') {
                        e.preventDefault();
                        const searchInput = document.getElementById('global-search-input');
                        if (searchInput) { searchInput.focus(); searchInput.select(); }
                    }
                    if (e.key === 'F8') {
                        e.preventDefault();
                        const btn = document.getElementById('btn-open-review');
                        if (btn && !btn.disabled) {
                            setShowReviewModal(true);
                        }
                    }
                    // 🌟 메인 화면의 F9 리스너 완전 제거 (안전성 확보)
                };
                window.addEventListener('keydown', handleKeyDown);

                return () => {
                    window.removeEventListener('storage', onSync); 
                    window.removeEventListener('message', handleMessage);
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, [loadMasterAndStaging]);

            const availableCatalogs = useMemo(() => {
                const counts = {};
                Object.values(masterProducts).forEach(m => {
                    const tagStr = m['카탈로그'] || '';
                    tagStr.split(',').forEach(t => { const trimmed = t.trim(); if (trimmed) counts[trimmed] = (counts[trimmed] || 0) + 1; });
                });
                return Object.keys(counts).sort().map(tag => ({ name: tag, count: counts[tag] }));
            }, [masterProducts]);

            const availableCategories = useMemo(() => {
                const counts = {};
