                Object.values(masterProducts).forEach(m => {
                    const tagStr = m['견적서'] || m['카테고리'] || '';
                    tagStr.split(',').forEach(t => { const trimmed = t.trim(); if (trimmed) counts[trimmed] = (counts[trimmed] || 0) + 1; });
                });
                return Object.keys(counts).sort().map(tag => ({ name: tag, count: counts[tag] }));
            }, [masterProducts]);

            const handleLoadWorkspaceData = useCallback((catalogs, categories) => {
                if (catalogs.size === 0 && categories.size === 0) {
                    setManagedItems({});
                    setIDB(STORAGE_KEYS.MANAGED_ITEMS, {});
                    return;
                }

                setIsProcessing(true); setProcessMsg('데이터 로드 및 병합 중...');
                
                setTimeout(() => {
                    let newManaged = {};
                    
                    Object.values(masterProducts).forEach(mItem => {
                        let isMatch = false;

                        if (catalogs.size > 0) {
                            const catalogStr = mItem['카탈로그'] || '';
                            const tags = catalogStr.split(',').map(c => c.trim());
                            if (tags.some(t => catalogs.has(t))) isMatch = true;
                        }

                        if (categories.size > 0) {
                            const catStr = mItem['견적서'] || mItem['카테고리'] || '';
                            const tags = catStr.split(',').map(c => c.trim());
                            if (tags.some(t => categories.has(t))) isMatch = true;
                        }

                        if (isMatch) {
                            const code = mItem['코드'] || mItem['품목코드'];
                            if (code) {
                                newManaged[code] = {
                                    코드: code,
                                    sources: { estimate: {} },
                                    finalData: calculatePricesEngine(parseNum(mItem['입고가']), mItem, {}, config.marginRules, false)
                                };
                            }
                        }
                    });
                    
                    setManagedItems(newManaged); 
                    setIDB(STORAGE_KEYS.MANAGED_ITEMS, newManaged);
                    setSelectedRows(new Set()); 
                    showToast(`✅ ${catalogs.size + categories.size}개 카탈로그 데이터 로드 완료! (${Object.keys(newManaged).length}건)`);
                    setIsProcessing(false); setProcessMsg('');
                }, 100);
            }, [masterProducts, config.marginRules, showToast]);

            const toggleCatalog = useCallback((name) => {
                setSelectedCatalogs(prev => { const next = new Set(prev); if (next.has(name)) next.delete(name); else next.add(name); return next; });
            }, []);

            const toggleCategory = useCallback((name) => {
                setSelectedCategories(prev => { const next = new Set(prev); if (next.has(name)) next.delete(name); else next.add(name); return next; });
            }, []);

            const isFirstRender = useRef(true);
            useEffect(() => {
                if (isFirstRender.current) { isFirstRender.current = false; return; }
                handleLoadWorkspaceData(selectedCatalogs, selectedCategories);
            }, [selectedCatalogs, selectedCategories, handleLoadWorkspaceData]);


            const handleUpdateCell = useCallback((code, field, linkedMasterField, value) => {
                setManagedItems(prev => {
                    let currentItem = prev[code] || { 코드: code, sources: { estimate: {} }, finalData: {} };
                    currentItem = { ...currentItem, finalData: { ...currentItem.finalData, [field]: value } };
                    if (['입고가', '출고가', '외주비', '노무비'].includes(field) || ['입고가', '출고가'].includes(linkedMasterField)) {
                        const pInRaw = (field === '입고가' || linkedMasterField === '입고가') ? value : (currentItem.finalData['입고가'] ?? currentItem.sources['estimate']?.['입고가'] ?? masterProducts[code]?.['입고가'] ?? 0);
                        currentItem.finalData = calculatePricesEngine(parseNum(pInRaw), masterProducts[code] || {}, currentItem.finalData, config.marginRules, true);
                    } 
                    const next = { ...prev, [code]: currentItem };
                    setIDB(STORAGE_KEYS.MANAGED_ITEMS, next);
                    return next;
                });
            }, [masterProducts, config.marginRules]);

            const fullDisplayRows = useMemo(() => {
                let baseList = [];
                const isEstimateUploaded = Object.keys(managedItems).length > 0;
                
                if (isEstimateUploaded) {
                    baseList = Object.values(managedItems); 
                } else {
                    baseList = Object.values(masterProducts).map(m => {
                        const rowCode = m.코드 || m.품목코드;
                        return managedItems[rowCode] || { 코드: rowCode, sources: {}, finalData: {} };
                    });

                    if (selectedCatalogs.size > 0) {
                        baseList = baseList.filter(item => {
                            const rowCode = item.코드 || item.품목코드;
                            const mItem = masterProducts[rowCode] || masterProducts[item.품목코드] || {};
                            const tagStr = mItem['카탈로그'] || '';
                            const tags = tagStr.split(',').map(t => t.trim());
                            return tags.some(t => selectedCatalogs.has(t));
                        });
                    }

                    if (selectedCategories.size > 0) {
                        baseList = baseList.filter(item => {
                            const rowCode = item.코드 || item.품목코드;
                            const mItem = masterProducts[rowCode] || masterProducts[item.품목코드] || {};
                            const tagStr = mItem['견적서'] || mItem['카테고리'] || '';
                            const tags = tagStr.split(',').map(t => t.trim());
                            return tags.some(t => selectedCategories.has(t));
                        });
                    }
                }

                if (globalSearch) {
                    const cleanKeyword = globalSearch.toLowerCase().replace(/[()[\]{},./]/g, ' ');
                    const tokens = cleanKeyword.split(/\s+/).filter(t => t.length > 0);
                    if (tokens.length > 0) {
                        baseList = baseList.map(item => {
                            const rowCode = item.코드 || item.품목코드;
                            const mItem = masterProducts[rowCode] || masterProducts[item.품목코드] || {};
                            const sourceItem = item.sources?.['estimate'] || {};
                            const finalItem = item.finalData || {};
                            const getVal = (key) => String(finalItem[key] !== undefined ? finalItem[key] : (sourceItem[key] !== undefined ? sourceItem[key] : (mItem[key] || ''))).toLowerCase();
                            
                            const cName = getVal('품목명'); const cSpec = getVal('규격'); const cVendor = getVal('구매처'); 
                            const cWh = getVal('창고'); const cCode = String(rowCode || '').toLowerCase();
                            
                            let score = 0; let isVendorMatched = false;

                            tokens.forEach(token => {
                                if (cVendor.includes(token)) { score += 20; isVendorMatched = true; }
                                else if (cName.includes(token)) score += 10;
                                else if (cCode.includes(token)) score += 8;
                                else if (cSpec.includes(token)) score += 5;
                                else if (cWh.includes(token)) score += 4;
                            });
                            return { ...item, _searchScore: score, _isVendorMatched: isVendorMatched, 코드: rowCode };
                        }).filter(r => r._searchScore > 0);
                        
                        baseList.sort((a, b) => {
                            if (a._isVendorMatched && !b._isVendorMatched) return -1;
                            if (!a._isVendorMatched && b._isVendorMatched) return 1;
                            
                            const getSeq = (item) => {
                                const rowCode = item.코드 || item.품목코드;
                                const m = masterProducts[rowCode] || masterProducts[item.품목코드] || {};
                                const val = item.finalData?.['순번'] !== undefined ? item.finalData['순번'] : (item.sources?.['estimate']?.['순번'] ?? m['순번']);
                                return (val === '' || val === undefined || val === null) ? 999999 : Number(val);
                            };
                            const seqA = getSeq(a); const seqB = getSeq(b);
                            
                            if (seqA !== seqB) return seqA - seqB;
                            if (a._searchScore !== b._searchScore) return b._searchScore - a._searchScore;
                            return String(a.코드 || a.품목코드).localeCompare(String(b.코드 || b.품목코드));
                        });
                    }
                } else {
                    baseList.sort((a, b) => {
                        const getSeq = (item) => {
                            const rowCode = item.코드 || item.품목코드;
                            const m = masterProducts[rowCode] || masterProducts[item.품목코드] || {};
                            const val = item.finalData?.['순번'] !== undefined ? item.finalData['순번'] : (item.sources?.['estimate']?.['순번'] ?? m['순번']);
                            return (val === '' || val === undefined || val === null) ? 999999 : Number(val);
                        };
                        const seqA = getSeq(a); const seqB = getSeq(b);
                        
                        if (seqA !== seqB) return seqA - seqB;
                        return String(a.코드 || a.품목코드).localeCompare(String(b.코드 || b.품목코드));
                    });
                }
                return baseList;
            }, [managedItems, masterProducts, globalSearch, selectedCatalogs, selectedCategories]);

            const executeExport = useCallback((targetCodes = null) => {
                const rowsToExport = targetCodes && Array.isArray(targetCodes)
                    ? fullDisplayRows.filter(r => targetCodes.includes(r.코드 || r.품목코드))
                    : (selectedRows.size > 0 ? fullDisplayRows.filter(r => selectedRows.has(r.코드 || r.품목코드)) : fullDisplayRows);

                if (rowsToExport.length === 0) { showToast("⚠️ 내보낼 데이터가 없습니다."); return; }
                
                setIsProcessing(true); setProcessMsg("엑셀 파일 생성 중...");

                setTimeout(() => {
                    try {
                        const wb = window.XLSX.utils.book_new();
                        let erpData = []; erpData.push(['품목코드', '입고가', '0', '출고가', '0', '입고B', 'n', '도매A', 'n', '도매B', 'n', '최종(전송)', 'n', '1']);
                        let shopData = []; shopData.push(['상품코드\n코드', '상품명', '규격', '출고가', '도매A', '시중가', '도매B', '도매B', 'C 판매가', 'C 도매가', 'D 판매가', 'D 도매가', '브랜드', '기본설명', '판매여부', '재고수량', '테마1', '테마2', '테마3', '테마4', '테마5', '상품태그']);
                        
                        const createRowArr = (code, inPrice, outPrice, bPrice='', aSale='', bSale='', finalPrice='') => { 
                            if (!code) return null; 
                            const outIn = inPrice > 0 ? inPrice : ''; 
                            const outOut = outPrice > 0 ? outPrice : ''; 
                            const outFinal = finalPrice > 0 ? finalPrice : outIn; 
                            return [ code, outIn, '0', outOut, '0', bPrice||'', 'n', aSale||'', 'n', bSale||'', 'n', outFinal, 'n', (inPrice > 0 || outPrice > 0) ? '1' : '' ]; 
                        };

                        const getFirstValidNum = (objList, keys) => {
                            for (let obj of objList) { if (!obj) continue; for (let k of keys) { if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return parseNum(obj[k]); } } return 0;
                        };
                        const getFirstValidStr = (objList, keys) => {
                            for (let obj of objList) { if (!obj) continue; for (let k of keys) { if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k]; } } return '';
                        };
                        const isValidSubItemCode = (code) => {
                            if (!code) return false; const s = String(code).trim(); return s !== '' && s !== '0' && s !== '00' && s !== '-' && s.toLowerCase() !== 'undefined' && s.toLowerCase() !== 'null';
                        };

                        rowsToExport.forEach(row => {
                            const rowCode = row.코드 || row.품목코드;
                            const mItem = masterProducts[rowCode] || masterProducts[row.품목코드] || {};
                            const final = row.finalData || {};
                            const source = row.sources?.['estimate'] || {};

                            const pIn = getFirstValidNum([final, source, mItem], ['입고가', '입고']);
                            const pOut = getFirstValidNum([final, source, mItem], ['출고가', '출고']);
                            const pMarketPrice = getFirstValidNum([final, mItem], ['시중가']);

                            const dName = getFirstValidStr([source, mItem], ['품목명']);
                            const dSpec = getFirstValidStr([source, mItem], ['규격']);
                            const dBrand = getFirstValidStr([source, mItem], ['브랜드']);
                            const dInfo = getFirstValidStr([source, mItem], ['상품정보', '기본설명', '간단설명']);
                            const dSearch = getFirstValidStr([source, mItem], ['검색어등록', '상품태그']);
                            
                            const pBPrice = getFirstValidNum([final, source, mItem], ['입고B', 'B단가']);
                            const pASale = getFirstValidNum([final, source, mItem], ['도매A', 'A판매', 'A판매가']);
                            const pBSale = getFirstValidNum([final, source, mItem], ['도매B', 'B판매', 'B 도매가']);
                            
                            const pRowErp = createRowArr(rowCode, pIn, pOut, pBPrice, pASale, pBSale, pIn); 
                            if (pRowErp) erpData.push(pRowErp); 
                            
                            const isZeroPrice = (pIn === 0 && pOut === 0);
                            const priceMarketShop = isZeroPrice ? 0 : (pMarketPrice > 0 ? pMarketPrice : pOut);
                            const priceA = isZeroPrice ? 0 : getFirstValidNum([final, source, mItem], ['도매A', 'A판매가', 'A판매', '출고가']);
                            const isForSale = isZeroPrice ? '0' : (pIn > 0 || pOut > 0 ? '1' : '0');
                            const stockQty = isZeroPrice ? '999' : '999';

                            shopData.push([rowCode, dName, dSpec, pOut, priceA, priceMarketShop, 0, 0, 0, 0, 0, 0, dBrand, dInfo, isForSale, stockQty, '', '', '', '', '', dSearch]);

                            [1].forEach(type => { 
                                const cCodeRaw = getFirstValidStr([final, source, mItem], [`${type}종코드`]); 
                                if (isValidSubItemCode(cCodeRaw)) { 
                                    const cCode = String(cCodeRaw).trim();
                                    const cIn = getFirstValidNum([final, source, mItem], [`${type}입고`, `${type}구매`]);
                                    const cOut = getFirstValidNum([final, source, mItem], [`${type}출고`]); 
                                    const cRowErp = createRowArr(cCode, cIn, cOut, '', '', '', cIn); 
                                    if (cRowErp) erpData.push(cRowErp); 

                                    const subMaster = masterProducts[cCode] || {};
                                    const cName = subMaster.품목명 || getFirstValidStr([final, source, mItem], [`${type}그룹명`]) || `${dName} (소분)`;
                                    const cSpec = subMaster.규격 || getFirstValidStr([mItem, source], [`${type}종규격`]) || '';
                                    const cBrand = subMaster.브랜드 || dBrand;
                                    const cInfo = subMaster.간단설명 || dInfo;
                                    const cSearch = subMaster.검색어등록 || dSearch;
                                    
                                    const cIsZeroPrice = (cIn === 0 && cOut === 0);
                                    const cMarketPrice = cIsZeroPrice ? 0 : (subMaster.시중가 > 0 ? subMaster.시중가 : cOut);
                                    const cPriceA = cIsZeroPrice ? 0 : (subMaster.도매A > 0 ? subMaster.도매A : cOut);
                                    const cIsForSale = cIsZeroPrice ? '0' : (cIn > 0 || cOut > 0 ? '1' : '0');
                                    const cStockQty = cIsZeroPrice ? '999' : '999';

                                    shopData.push([cCode, cName, cSpec, cOut, cPriceA, cMarketPrice, 0, 0, 0, 0, 0, 0, cBrand, cInfo, cIsForSale, cStockQty, '', '', '', '', '', cSearch]);
                                } 
                            });
                        });
                        
                        window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(shopData), "쇼핑몰업로드"); 
                        window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(erpData), "ERP업데이트"); 
                        window.XLSX.writeFile(wb, `보고서출력_${new Date().toISOString().slice(0,10)}.xlsx`);
                        showToast(`✅ 통합 보고서 엑셀 다운로드가 완료되었습니다.`);
                    } catch(e) { console.error(e); showToast("❌ 엑셀 파일 생성 중 오류가 발생했습니다."); } finally { setIsProcessing(false); setProcessMsg(''); }
                }, 100);
            }, [fullDisplayRows, masterProducts, selectedRows, showToast]);

            const handleCommitEstimate = useCallback(async (targetCodes, options, editedPrices, actionAfterSync = 'report') => {
                if (targetCodes.length === 0) return;
                
                const { catalogOption, selectedExistingCatalog, newCatalogName, overrideNameSpec } = options;
                let newMaster = { ...masterProducts }, commitCount = 0, localLogs = []; const nowStr = new Date().toLocaleString('ko-KR');

                targetCodes.forEach(code => {
                    const item = managedItems[code]; if (!item || !item.코드) return;
                    const oldItem = masterProducts[code] || {};
                    newMaster[item.코드] = { ...(newMaster[item.코드] || { 코드: item.코드 }) };

                    if (editedPrices && editedPrices[code] !== undefined) {
                        item.finalData = item.finalData || {};
                        item.finalData['입고가'] = editedPrices[code];
                        item.finalData = calculatePricesEngine(editedPrices[code], oldItem, item.finalData, config.marginRules, true);
                    }

                    if (item.finalData) {
                        Object.keys(item.finalData).forEach(field => {
                            if ((field === '품목명' || field === '규격') && oldItem[field] && !overrideNameSpec) return;
                            
                            const linked = config.masterLinks['estimate']?.[field] || (MASTER_HEADERS.includes(field) || NUMERIC_HEADERS.includes(field) ? field : null);
                            
                            if (linked && item.finalData[field] !== undefined && item.finalData[field] !== '' && item.finalData[field] !== '오류') {
                                const newVal = NUMERIC_HEADERS.includes(linked) ? parseNum(item.finalData[field]) : item.finalData[field];
                                const oldVal = NUMERIC_HEADERS.includes(linked) ? parseNum(oldItem[linked]) : oldItem[linked];
                                if (['입고가', '출고가'].includes(linked) && oldVal > 0 && oldVal !== newVal) {
                                    localLogs.push({ id: generateUUID(), timestamp: nowStr, code: code, name: oldItem.품목명 || item.sources?.estimate?.품목명 || '', field: linked, oldVal, newVal, diff: newVal - oldVal });
                                } newMaster[item.코드][linked] = newVal;
                            }
                        });
                    } 
                    
                    let targetCatalog = '';
                    if (catalogOption === 'existing' && selectedExistingCatalog) targetCatalog = selectedExistingCatalog.trim();
                    else if (catalogOption === 'new' && newCatalogName) targetCatalog = newCatalogName.trim();
                    
                    if (targetCatalog) {
                        const currentCategories = newMaster[code]['견적서'] || newMaster[code]['카테고리'] || '';
                        const tags = currentCategories.split(',').map(s => s.trim()).filter(Boolean);
                        if (!tags.includes(targetCatalog)) {
                            tags.push(targetCatalog);
                            newMaster[code]['견적서'] = tags.join(', ');
                        }
                    }
                    commitCount++;
                });

                if (localLogs.length > 0) {
                    const oldLogs = await getIDB(STORAGE_KEYS.HISTORY_DB) || [];
                    await setIDB(STORAGE_KEYS.HISTORY_DB, [...oldLogs, ...localLogs]);

                    const unsyncedHist = await getIDB(STORAGE_KEYS.UNSYNCED_HISTORY) || [];
                    await setIDB(STORAGE_KEYS.UNSYNCED_HISTORY, [...unsyncedHist, ...localLogs]);
                }

                const unsyncedMaster = await getIDB(STORAGE_KEYS.UNSYNCED_MASTER) || {};
                targetCodes.forEach(code => {
                    if (newMaster[code]) unsyncedMaster[code] = newMaster[code];
                });
                await setIDB(STORAGE_KEYS.UNSYNCED_MASTER, unsyncedMaster);

                setMasterProducts(newMaster); 
                await setIDB(STORAGE_KEYS.MASTER_DB, newMaster);
                localStorage.setItem(STORAGE_KEYS.SYNC_TRIGGER, Date.now().toString());

                await setIDB(STORAGE_KEYS.MANAGED_ITEMS, {});
                setManagedItems({});
                localStorage.removeItem('merchPipeline_CurrentTag');

                setSelectedRows(new Set()); 

                // 🌟 동작 분기 (리포트 이동 vs 엑셀 출력)
                if (actionAfterSync === 'export') {
                    showToast(`✅ ${commitCount}건 반영 완료! 엑셀 출력을 시작합니다...`);
                    executeExport(targetCodes); 
                } else {
                    showToast(`✅ ${commitCount}건 통합 반영 완료! 경영 보고서로 이동합니다...`);
                    setTimeout(() => { window.location.href = 'Report.html'; }, 800);
                }

            }, [managedItems, masterProducts, config.masterLinks, showToast, config.marginRules, executeExport]);

            const handlePush = async () => {
                if (!config.cloudUrl) return showToast("⚠️ 설정에서 앱스크립트 URL을 입력하세요.");
                const unsyncedMaster = await getIDB(STORAGE_KEYS.UNSYNCED_MASTER) || {};
                const unsyncedHistory = await getIDB(STORAGE_KEYS.UNSYNCED_HISTORY) || [];
                const unsyncedDict = await getIDB(STORAGE_KEYS.UNSYNCED_DICT) || {};
                
                if (Object.keys(unsyncedMaster).length === 0 && unsyncedHistory.length === 0 && Object.keys(unsyncedDict).length === 0) return showToast("⚠️ 클라우드에 새로 반영할 변경사항이 없습니다.");

                setIsProcessing(true); setProcessMsg("클라우드 백업 중...");
                try {
                    const response = await fetch(config.cloudUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'pushData', masterDelta: unsyncedMaster, historyDelta: unsyncedHistory, dictDelta: unsyncedDict })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        await setIDB(STORAGE_KEYS.UNSYNCED_MASTER, {});
                        await setIDB(STORAGE_KEYS.UNSYNCED_HISTORY, []);
                        await setIDB(STORAGE_KEYS.UNSYNCED_DICT, {});
                        showToast(`✅ 클라우드 동기화 완료`);
                    } else throw new Error(result.message || '서버 응답 오류');
                } catch (err) {
                    console.error(err); showToast("❌ 클라우드 백업 실패: " + err.message);
                } finally { setIsProcessing(false); setProcessMsg(""); }
            };

            const handlePull = async () => {
                if (!config.cloudUrl) return showToast("⚠️ 설정에서 앱스크립트 URL을 입력하세요.");
                setIsProcessing(true); setProcessMsg("데이터 동기화 중...");
                try {
                    const response = await fetch(`${config.cloudUrl}?action=pullData`, { method: 'GET' });
                    const result = await response.json();
                    if (result.status === 'success') {
                        if (result.master) {
                            setMasterProducts(result.master);
                            await setIDB(STORAGE_KEYS.MASTER_DB, result.master);
                        }
                        if (result.history) await setIDB(STORAGE_KEYS.HISTORY_DB, result.history);
                        localStorage.setItem(STORAGE_KEYS.SYNC_TRIGGER, Date.now().toString());
                        showToast("✅ 클라우드 데이터 수신 완료");
                    } else throw new Error(result.message || '서버 응답 오류');
                } catch (err) {
                    console.error(err); showToast("❌ 데이터 동기화 실패: " + err.message);
                } finally { setIsProcessing(false); setProcessMsg(""); }
            };

            const handleRemoveFromWorkspace = useCallback(() => {
                if (selectedRows.size === 0) return showToast('⚠️ 숨길 항목을 선택하세요.');
                setManagedItems(p => { 
                    const n = { ...p }; selectedRows.forEach(c => delete n[c]); 
                    setIDB(STORAGE_KEYS.MANAGED_ITEMS, n);
                    return n; 
                });
                setSelectedRows(new Set()); showToast('✅ 선택한 항목이 화면에서 숨겨졌습니다.');
            }, [selectedRows, showToast]);

            const handleReset = useCallback(() => {
                setManagedItems({}); setIDB(STORAGE_KEYS.MANAGED_ITEMS, {}); 
                setSelectedRows(new Set()); setGlobalSearch(''); 
                setSelectedCatalogs(new Set()); setSelectedCategories(new Set()); 
                showToast('화면이 초기화 되었습니다.');
            }, [showToast]);

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsProcessing(true); setProcessMsg("엑셀 시세표 분석 중...");
                try {
                    const excelData = await parseExcelRobust(file);
                    if (excelData.length === 0) throw new Error("데이터가 없습니다.");
                    const curMap = config.mappings['estimate'] || {}; const headerCache = createHeaderMap(Object.keys(excelData[0]), curMap);
                    const allFields = Array.from(new Set([...Object.keys(curMap), ...MASTER_HEADERS, ...NUMERIC_HEADERS]));
                    
                    let newManaged = { ...managedItems }; let count = 0;
                    excelData.forEach(row => {
                        const codeKey = headerCache['품목코드']; 
                        const code = row[codeKey] || row['품목코드'] || row['상품코드'] || row['코드'];
                        if (!code || String(code).replace(/\s/g, '').includes('출력')) return;
                        
                        if (!newManaged[code]) newManaged[code] = { 코드: code, sources: { estimate: {} }, finalData: {} };
                        let mItem = newManaged[code];
                        const nameKey = headerCache['품목명']; mItem.sources['estimate']['품목명'] = nameKey ? row[nameKey] : '';
                        
                        allFields.forEach(h => {
                            let actualKey = headerCache[h];
                            if (!actualKey && row[h] !== undefined) actualKey = h; 

                            if(actualKey && row[actualKey] !== undefined && row[actualKey] !== '') {
                                const val = row[actualKey];
                                const isNum = NUMERIC_HEADERS.includes(config.masterLinks['estimate']?.[h]) || NUMERIC_HEADERS.includes(h);
                                mItem.sources['estimate'][h] = isNum ? parseNum(val) : val;
                                if (mItem.finalData[h] === undefined) mItem.finalData[h] = isNum ? parseNum(val) : val;
                            }
                        });
                        
                        delete mItem.finalData['출고가'];
                        const pIn = parseNum(mItem.sources['estimate']['입고가'] || masterProducts[code]?.['입고가']);
                        if (pIn > 0) mItem.finalData = calculatePricesEngine(pIn, masterProducts[code]||{}, mItem.finalData, config.marginRules, false);
                        count++;
                    });
                    setManagedItems(newManaged); 
                    await setIDB(STORAGE_KEYS.MANAGED_ITEMS, newManaged);
                    showToast(`✅ ${count}건 데이터 로드 완료`);
                } catch(error) { showToast("❌ 업로드 오류: " + error.message); } finally { e.target.value = ''; setIsProcessing(false); setProcessMsg(''); }
            };

            const appState = { isEstimateUploaded: Object.keys(managedItems).length > 0, fullDisplayRows, visibleMasterCols: config.visibleMasterCols, visibleUploadCols: config.visibleUploadCols, masterProducts, masterLinksEst: config.masterLinks?.['estimate']||{}, selectedRows, globalSearch, selectedCatalogs, selectedCategories, isProcessing };
            const appActions = { 
                handleUpdateCell, setRowSelection: useCallback((code, isSelected) => { setSelectedRows(p => { const n = new Set(p); if (isSelected) n.add(code); else n.delete(code); return n; }); }, []), 
                handleRemoveFromWorkspace, setShowReviewModal, setGlobalSearch, handleReset, handleFileUpload, showToast 
            };

            return (
                <div className="h-screen w-full max-w-[1500px] mx-auto flex flex-col font-sans overflow-hidden bg-[#f1f5f9] relative shadow-2xl border-x border-slate-300 select-none">
                    <GlobalHeader 
                        activeTab="pipeline" itemCount={Object.keys(masterProducts).length} isProcessing={isProcessing} processMsg={processMsg}
                        onOpenSettings={() => setShowSettingsModal(true)} onPush={handlePush} onPull={handlePull} onNavigate={handleNavigate}
                    />
                    
                    <div className="px-6 py-3 flex items-center justify-between gap-4 bg-white border-b border-slate-200 z-50 w-full shrink-0">
                        <div className="flex items-center gap-2 pb-1 -mb-1 flex-wrap w-full">
                            <div className="flex items-center gap-1">
                                <div className="relative" ref={catalogRef}>
                                    <button onClick={() => { setCatalogDropdownOpen(!catalogDropdownOpen); setCategoryDropdownOpen(false); }} className="appearance-none bg-white border border-blue-200 text-blue-600 font-bold text-[13px] py-1.5 px-3 pr-7 rounded-md outline-none focus:border-blue-400 cursor-pointer h-9 shadow-sm w-[180px] flex justify-between items-center bg-white text-left pl-8">
                                        <span className="truncate pr-2 block">{selectedCatalogs.size > 0 ? `${selectedCatalogs.size}개 선택됨` : '파서 보관함'}</span>
                                        <i className="fas fa-chevron-down text-blue-400 text-[10px]"></i>
                                    </button>
                                    <i className="fas fa-folder-open absolute left-3 top-2.5 text-blue-500 text-[13px] pointer-events-none"></i>
                                    {catalogDropdownOpen && (
                                        <div className="absolute top-full left-0 mt-1 w-[250px] max-h-60 overflow-y-auto bg-white border border-slate-200 rounded-lg shadow-xl z-50 p-2 fade-in">
                                            {availableCatalogs.length === 0 ? <div className="text-xs text-slate-400 p-2 font-bold text-center">항목 없음</div> : availableCatalogs.map(tag => (
                                                <div key={tag.name} onClick={(e) => { e.stopPropagation(); toggleCatalog(tag.name); }} className="flex items-center gap-3 p-2 hover:bg-slate-50 cursor-pointer rounded-lg transition-colors">
                                                    <input type="checkbox" checked={selectedCatalogs.has(tag.name)} readOnly className="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 pointer-events-none" />
                                                    <span className="text-[13px] text-slate-700 font-bold truncate flex-1">{tag.name}</span>
                                                    <span className="text-[11px] text-slate-400 font-medium bg-slate-100 px-1.5 py-0.5 rounded">{tag.count}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="w-px h-5 bg-slate-200 mx-1 shrink-0"></div>
                            <div className="flex items-center gap-1">
                                <div className="relative" ref={categoryRef}>
                                    <button onClick={() => { setCategoryDropdownOpen(!categoryDropdownOpen); setCatalogDropdownOpen(false); }} className="appearance-none bg-white border border-blue-200 text-blue-600 font-bold text-[13px] py-1.5 px-3 pr-7 rounded-md outline-none focus:border-blue-400 cursor-pointer h-9 shadow-sm w-[180px] flex justify-between items-center bg-white text-left pl-8">
                                        <span className="truncate pr-2 block">{selectedCategories.size > 0 ? `${selectedCategories.size}개 선택됨` : '카탈로그'}</span>
                                        <i className="fas fa-chevron-down text-blue-400 text-[10px]"></i>
                                    </button>
                                    <i className="fas fa-file-invoice absolute left-3 top-2.5 text-blue-500 text-[13px] pointer-events-none"></i>
                                    {categoryDropdownOpen && (
                                        <div className="absolute top-full left-0 mt-1 w-[250px] max-h-60 overflow-y-auto bg-white border border-slate-200 rounded-lg shadow-xl z-50 p-2 fade-in">
                                            {availableCategories.length === 0 ? <div className="text-xs text-slate-400 p-2 font-bold text-center">항목 없음</div> : availableCategories.map(tag => (
                                                <div key={tag.name} onClick={(e) => { e.stopPropagation(); toggleCategory(tag.name); }} className="flex items-center gap-3 p-2 hover:bg-slate-50 cursor-pointer rounded-lg transition-colors">
                                                    <input type="checkbox" checked={selectedCategories.has(tag.name)} readOnly className="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 pointer-events-none" />
                                                    <span className="text-[13px] text-slate-700 font-bold truncate flex-1">{tag.name}</span>
                                                    <span className="text-[11px] text-slate-400 font-medium bg-slate-100 px-1.5 py-0.5 rounded">{tag.count}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="w-px h-5 bg-slate-200 mx-1 shrink-0"></div>
                            <div className="flex items-center gap-1 shrink-0">
                                <label className="h-9 px-3 rounded-md text-[13px] font-bold bg-white border border-slate-200 hover:bg-slate-50 transition-colors shadow-sm flex items-center shrink-0 text-emerald-600 border-emerald-200 hover:bg-emerald-50 cursor-pointer">
                                    <SafeIcon name="file-excel" className="mr-1.5 text-emerald-500"/> 불러오기
                                    <input type="file" className="hidden" multiple onChange={(e) => handleFileUpload(e)} accept=".xlsx, .xls, .csv" disabled={isProcessing} />
                                </label>
                            </div>
                            <div className="flex items-center gap-2 shrink-0 ml-auto pl-4">
                                {selectedRows.size > 0 && <button onClick={handleRemoveFromWorkspace} className="h-9 px-3 rounded-md text-[13px] font-bold bg-white border border-slate-200 hover:bg-slate-50 transition-colors shadow-sm flex items-center shrink-0 bg-rose-50 text-rose-600 border-rose-200 hover:bg-rose-100" title="선택 항목 숨기기"><SafeIcon name="x" className="mr-1.5"/> 숨기기 ({selectedRows.size})</button>}
                                
                                {fullDisplayRows.length > 0 && (
                                    <Fragment>
                                        <button id="btn-open-review" onClick={() => setShowReviewModal(true)} className="h-9 px-4 rounded-lg text-[13px] font-bold bg-slate-800 text-white hover:bg-slate-700 border-slate-700 shadow-sm flex items-center shrink-0 transition-colors">
                                            <SafeIcon name="check-circle-2" className="mr-1.5"/> 검증 및 반영 [F8]
                                        </button>
                                    </Fragment>
                                )}
                                
                                <div className="w-px h-5 bg-slate-200 mx-1 shrink-0"></div>
                                <button onClick={handleReset} className="h-9 px-3 rounded-md text-[13px] font-bold bg-white border border-slate-200 hover:bg-slate-50 transition-colors shadow-sm flex items-center shrink-0 w-9 justify-center text-slate-500 hover:text-slate-800" title="화면 초기화"><SafeIcon name="redo-alt" size={13}/></button>
                                <div className="relative w-48 sm:w-64 h-9 shrink-0">
                                    <input id="global-search-input" type="text" placeholder="결과 내 검색 (F3)" value={globalSearch} onChange={e=>setGlobalSearch(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); const t = document.querySelector('tbody tr.data-row input[data-field="입고가"]') || document.querySelector('tbody tr.data-row td:has(input[type="text"]) input'); if (t) { t.focus(); setTimeout(() => t.select(), 0); } } }} className="appearance-none bg-white border border-blue-200 text-blue-600 font-bold text-[13px] py-1.5 px-3 pr-7 rounded-md outline-none focus:border-blue-400 cursor-pointer h-9 shadow-sm w-full h-full !pl-3 pr-8 py-1 !cursor-text" />
                                    <SafeIcon name="search" size={14} className="absolute right-3 top-2.5 text-slate-400 pointer-events-none" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <main className="flex-1 overflow-hidden bg-slate-50 p-6 flex flex-col">
                        <ExcelDataGrid state={appState} actions={appActions} />
                    </main>

                    <IframeSettingsModal isOpen={showSettingsModal} onClose={() => setShowSettingsModal(false)} />
                    {showReviewModal && <ReviewModal onClose={() => setShowReviewModal(false)} onConfirm={handleCommitEstimate} displayRows={fullDisplayRows} masterProducts={masterProducts} availableCategories={availableCategories} />}
                    {toastMsg && <div className="fixed bottom-10 right-10 z-[100] bg-slate-900 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 fade-in border border-slate-700 font-bold"><SafeIcon name="check-circle-2" size={18} className="text-emerald-400" /><span className="text-sm font-bold tracking-tight">{toastMsg}</span></div>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
