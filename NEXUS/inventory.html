<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>NEXUS - Stock Closing [v1.3]</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; -webkit-user-select: none; user-select: none; background-color: #f1f5f9; margin: 0; overflow: hidden; }
        input, textarea, select { user-select: auto; }
        ::-webkit-scrollbar { width: 8px; height: 8px; } 
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.2s ease-out; } 
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef, useCallback, Fragment } = React;

        // ==========================================
        // 🧩 1. 코어 전역 상수 및 DB 래퍼 (🌟 DB Singleton 체계)
        // ==========================================
        const STORAGE_KEYS = {
            MASTER_DB: 'merchMaster_v870', CLOUD_URL: 'skuSyncCloudUrl_v6', SYNC_TRIGGER: 'merchMaster_sync_trigger',
            HISTORY_DB: 'merchHistory_v870', UNSYNCED_MASTER: 'merchUnsyncedMaster_v1', UNSYNCED_HISTORY: 'merchUnsyncedHistory_v1',
            UNSYNCED_DICT: 'merchUnsyncedDict_v1',
        };

        const generateUUID = () => {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8); return v.toString(16);
            });
        };

        const parseNum = (v) => (!v ? 0 : Number(String(v).replace(/,/g, '').replace(/[^\d.-]/g, '')) || 0);
        const safeStr = (val, def = '') => (val !== undefined && val !== null && val !== '') ? String(val) : def;

        // 🌟 DB 단일 연결 (Connection 병목 현상 완벽 방지)
        let idbInstance = null;
        const initIDB = () => new Promise((resolve, reject) => {
            if (idbInstance) return resolve(idbInstance);
            const request = indexedDB.open('MerchOpsDB', 1);
            request.onupgradeneeded = (e) => { if (!e.target.result.objectStoreNames.contains('store')) e.target.result.createObjectStore('store'); };
            request.onsuccess = () => { idbInstance = request.result; resolve(idbInstance); };
            request.onerror = () => reject(request.error);
        });

        const getIDB = async (key) => {
            const db = await initIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('store', 'readonly');
                const req = tx.objectStore('store').get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(tx.error);
            });
        };

        const setIDB = async (key, val) => {
            const db = await initIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('store', 'readwrite');
                tx.objectStore('store').put(val, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        };

        // ==========================================
        // 🧩 2. 공용 UI 컴포넌트
        // ==========================================
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) return (
                    <div className="h-screen w-full flex flex-col items-center justify-center bg-slate-50 p-6 text-center">
                        <i className="fas fa-exclamation-triangle text-rose-500 text-6xl mb-6"></i>
                        <h1 className="text-2xl font-black text-slate-800 mb-2">화면 렌더링 오류 발생</h1>
                        <p className="text-slate-500 mb-6">아래 [초기화] 버튼을 눌러 복구해 주세요.</p>
                        <button onClick={() => { indexedDB.deleteDatabase('MerchOpsDB'); window.location.reload(); }} className="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg"><i className="fas fa-redo-alt"></i> 로컬 데이터 초기화</button>
                    </div>
                );
                return this.props.children;
            }
        }

        const SafeIcon = React.memo(function SafeIconComponent({ name, size = 18, className = "" }) {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const kebabName = name.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();
                    const possibleNames = [kebabName, name, name==='cloud-download'?'download-cloud':name, name==='cloud-upload'?'upload-cloud':name, name==='bar-chart-3'?'bar-chart':name];
                    for (const pName of possibleNames) {
                        if (window.lucide.icons[pName]) { setSvg(window.lucide.icons[pName].toSvg({ width: size, height: size, class: className, 'stroke-width': 2.5 })); return; }
                    }
                }
            }, [name, size, className]);
            if (!svg) {
                const faMap = { 'cloud-download':'fa-cloud-download-alt', 'cloud-upload':'fa-cloud-upload-alt', 'settings':'fa-cogs', 'layout-dashboard':'fa-th-large', 'package-search':'fa-box-open', 'file-spreadsheet':'fa-table', 'zap':'fa-bolt', 'truck':'fa-truck', 'boxes':'fa-boxes', 'bar-chart-3':'fa-chart-bar', 'check-circle-2':'fa-check-circle', 'x':'fa-times', 'database':'fa-database', 'upload':'fa-upload', 'pie-chart':'fa-chart-pie', 'shopping-cart':'fa-shopping-cart', 'users':'fa-users', 'megaphone':'fa-bullhorn', 'book-open':'fa-address-book', 'shopping-bag':'fa-shopping-bag', 'credit-card':'fa-credit-card', 'line-chart':'fa-chart-line', 'printer':'fa-print', 'search':'fa-search', 'plus':'fa-plus', 'trash-alt':'fa-trash-alt', 'edit':'fa-edit', 'save':'fa-save', 'link':'fa-link', 'folder-open':'fa-folder-open', 'folder-plus':'fa-folder-plus', 'magic':'fa-magic', 'clipboard-check':'fa-clipboard-check', 'hand-point-right':'fa-hand-point-right', 'arrow-right':'fa-arrow-right', 'arrow-up':'fa-arrow-up', 'arrow-down':'fa-arrow-down', 'equals':'fa-equals', 'eraser':'fa-eraser' };
                return <i className={`fas ${faMap[name] || `fa-${name}`} ${className}`} style={{ fontSize: size }} />;
            }
            return <span className="inline-flex shrink-0 items-center justify-center" dangerouslySetInnerHTML={{ __html: svg }} />;
        });

        const GlobalHeader = ({ activeTab, itemCount, isProcessing, processMsg, onOpenSettings, onPush, onPull, onNavigate }) => {
            const groups = [ { id: 'master', label: '정보 관리', icon: 'database' }, { id: 'ops', label: '운영 관리', icon: 'truck' }, { id: 'admin', label: '인사이트', icon: 'bar-chart-3' } ];
            const groupLabels = { master: "MerchOps", ops: "DataOps", admin: "Insite", common: "Platform" };
            const tabs = [
                { id: 'dashboard', label: '통합 대시보드', icon: "layout-dashboard", path: 'Dashboard.html', group: 'common', isReady: true, shortTag: 'TOTAL BOARD' },
                { id: 'item-info', label: '마스터 DB', icon: "database", path: 'Master.html', group: 'master', isReady: true, shortTag: 'GOLDEN MASTER' },
                { id: 'item-manage', label: '상품 관리', icon: "package-search", path: 'Item_manager.html', group: 'master', isReady: true, shortTag: 'ITEM FORGE' },
                { id: 'pipeline', label: '시세 관리', icon: "file-spreadsheet", path: 'Pipeline.html', group: 'master', isReady: true, shortTag: 'PRICE HUB' },
                { id: 'parser', label: '스마트 파서', icon: "zap", path: 'Parser.html', group: 'master', isReady: true, shortTag: 'AUTO PARSER' },
                { id: 'partner-db', label: '거래처 DB', icon: "book-open", path: 'partner_db.html', group: 'master', isReady: true, shortTag: 'ENTITY REGISTER' },
                { id: 'partners', label: '거래처 관리', icon: "users", path: 'partners.html', group: 'master', isReady: true, shortTag: 'NETWORK CRM' },
                { id: 'orders', label: '주문 관리', icon: "shopping-bag", path: 'orders.html', group: 'ops', isReady: true, shortTag: 'ORDER FLOW' },
                { id: 'purchases', label: '구매 관리', icon: "credit-card", path: 'purchases.html', group: 'ops', isReady: true, shortTag: 'SOURCING' },
                { id: 'sales', label: '판매 관리', icon: "line-chart", path: 'sales.html', group: 'ops', isReady: true, shortTag: 'REVENUE' },
                { id: 'inventory', label: '재고 마감', icon: "boxes", path: 'inventory.html', group: 'ops', isReady: true, shortTag: 'STOCK CLOSING' },
                { id: 'print-center', label: '출력 센터', icon: "printer", path: 'print_center.html', group: 'ops', isReady: true, shortTag: 'OUTPUT TERM' },
                { id: 'insight', label: '경영 보고서', icon: "pie-chart", path: 'Report.html', group: 'admin', isReady: true, shortTag: 'INSIGHT CORE' },
                { id: 'cs', label: '정보 마당', icon: "megaphone", path: 'cs.html', group: 'admin', isReady: true, shortTag: 'BOARD' }
            ];

            const currentTab = tabs.find(t => t.id === activeTab);
            const activeGroup = currentTab ? currentTab.group : 'common';
            const [selectedGroup, setSelectedGroup] = useState(activeGroup);
            const activeGroupLabel = groupLabels[selectedGroup] || "Platform";

            return (
                <div className="flex flex-col shrink-0 z-40 relative w-full shadow-sm bg-[#0B1021]">
                    <header className="h-[72px] bg-[#0B1021] text-white flex justify-between px-6 border-b border-slate-800/80 relative z-20">
                        <div className="flex items-center h-full">
                            <div className="flex items-center cursor-pointer group mr-10 h-full" onClick={(e) => {setSelectedGroup('common'); onNavigate(e, 'Dashboard.html');}}>
                                <span className="font-black text-[24px] tracking-wider text-slate-100 mr-4 group-hover:text-indigo-400 transition-colors">NEXUS</span>
                                <div className="flex flex-col border-l-2 border-slate-700/70 pl-4 py-0.5">
                                    <div className="flex items-center">
                                        <span className="font-black text-[16px] leading-none text-indigo-400 tracking-widest uppercase mt-0.5">{activeGroupLabel}</span>
                                        <span className="ml-2.5 bg-indigo-500/10 border border-indigo-400/30 text-indigo-400 px-[5px] py-[2px] rounded text-[9px] font-black tracking-wider shadow-sm leading-none">v1.3</span>
                                    </div>
                                    <span className="text-[10px] text-slate-400/90 font-medium tracking-[0.15em] mt-1 uppercase">{currentTab ? currentTab.shortTag : 'WORKSPACE'}</span>
                                </div>
                            </div>
                            <div className="flex items-end h-full gap-8">
                                {groups.map(g => (
                                    <button key={g.id} onClick={() => setSelectedGroup(prev => prev === g.id ? 'common' : g.id)} className={`pb-[16px] text-[14px] font-bold transition-colors flex items-center gap-1.5 ${selectedGroup === g.id ? 'text-slate-100 border-b-[3px] border-indigo-500 -mb-[2px]' : 'text-slate-500 hover:text-slate-300'}`}>
                                        <SafeIcon name={g.icon} size={15} /> {g.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex items-center gap-4 h-full">
                            <div className="flex items-center bg-[#151B2B] rounded-lg border border-slate-700/50 h-9 px-3 shadow-inner gap-3">
                                <div className="flex items-center justify-center" title={isProcessing ? processMsg : "시스템 정상 대기중"}>
                                    {isProcessing ? ( <i className="fas fa-circle-notch fa-spin text-amber-500 text-[12px]"></i> ) : (
                                        <div className="relative flex h-2 w-2"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></div>
                                    )}
                                </div>
                                <div className="w-px h-3.5 bg-slate-700"></div>
                                <div className="flex items-center gap-1.5 text-slate-300 cursor-help" title="마스터 DB 데이터 수">
                                    <SafeIcon name="database" size={10} className="text-slate-500" />
                                    <span className="text-[11px] font-mono font-bold tracking-tight">{itemCount ? itemCount.toLocaleString() : 0}</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={onPull} className="w-10 h-10 rounded-xl bg-[#151B2B] hover:bg-[#1E293B] flex items-center justify-center border border-slate-700 transition-colors text-indigo-400 shadow-sm" title="데이터 불러오기(Pull)"><SafeIcon name="cloud-download" size={18} /></button>
                                <button onClick={onPush} className="w-10 h-10 rounded-xl bg-[#151B2B] hover:bg-[#1E293B] flex items-center justify-center border border-slate-700 transition-colors text-indigo-400 shadow-sm" title="데이터 백업하기(Push)"><SafeIcon name="cloud-upload" size={18} /></button>
                                <div className="w-px h-6 bg-slate-700 mx-1"></div>
                                <button onClick={onOpenSettings} className="w-10 h-10 rounded-xl bg-[#151B2B] hover:bg-[#1E293B] flex items-center justify-center border border-slate-700 transition-colors text-slate-400 hover:text-white shadow-sm" title="통합 환경설정"><SafeIcon name="settings" size={18} /></button>
                            </div>
                        </div>
                    </header>

                    {selectedGroup && (
                        <div className="bg-[#0B1021] px-6 pt-3 flex items-end gap-1 overflow-x-auto custom-scrollbar border-b border-slate-200 fade-in">
                            {tabs.filter(t => t.group === selectedGroup).map(tab => {
                                const isActive = activeTab === tab.id;
                                const isPlaceholder = !tab.isReady;
                                return (
                                    <a key={tab.id} href={tab.path} onClick={(e) => onNavigate(e, tab.path, tab.isReady)}
                                        className={`flex items-center gap-2 px-6 py-3 text-[14px] font-bold rounded-t-xl transition-all whitespace-nowrap border-x border-t-[3px] ${isActive ? 'bg-white text-indigo-600 border-t-indigo-500 border-x-slate-200 relative z-10 shadow-[0_-4px_10px_rgba(0,0,0,0.1)]' : isPlaceholder ? 'bg-[#151B2B] text-slate-500 border-t-transparent border-x-transparent cursor-not-allowed opacity-50 pb-2.5' : 'bg-[#151B2B] text-slate-400 border-t-transparent border-x-transparent hover:text-slate-200 pb-2.5'}`}
                                        style={{ marginBottom: isActive ? '-1px' : '0', paddingBottom: isActive ? '13px' : '10px' }}
                                    >
                                        <SafeIcon name={tab.icon} size={16} className={isActive ? 'text-indigo-600' : 'opacity-70'} /> {tab.label}
                                    </a>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const IframeSettingsModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[500] flex bg-slate-900/60 backdrop-blur-sm fade-in cursor-pointer" onClick={onClose}>
                    <div className="w-full max-w-[1400px] h-full bg-white shadow-[-10px_0_40px_rgba(0,0,0,0.3)] flex flex-col slide-in-right border-l border-slate-300 relative overflow-hidden ml-auto cursor-default" onClick={(e) => e.stopPropagation()}>
                        <div className="bg-[#0f172a] px-6 py-4 flex justify-between items-center text-white shrink-0 border-b border-slate-700 shadow-md relative z-10">
                            <div className="flex items-center gap-3"><SafeIcon name="settings" size={20} className="text-indigo-400"/><h2 className="font-black text-[17px] tracking-wide">통합 환경설정 센터</h2></div>
                            <button onClick={onClose} className="text-slate-300 hover:text-white bg-slate-800 hover:bg-rose-500 w-8 h-8 rounded-lg flex items-center justify-center border border-slate-700 hover:border-rose-400"><SafeIcon name="x" size={18} /></button>
                        </div>
                        <div className="flex-1 w-full bg-slate-100 relative">
                            <iframe src="settings.html?mode=iframe" className="absolute inset-0 w-full h-full border-0 bg-white" title="Settings"></iframe>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 🧩 3. 훅 (설정 로드 및 재고 로직)
        // ==========================================
        const useMerchConfig = () => {
            const loadConfig = () => {
                const cloudUrl = localStorage.getItem(STORAGE_KEYS.CLOUD_URL) || '';
                
                const sMap = localStorage.getItem('inventoryMappingsLight');
                const defMap = { code: '품목코드, 상품코드, 코드, 품번, 바코드, sku', name: '품명, 품목명(규격), 품목명[규격], 상품명, 제품명, 이름, 품목, 상품', spec: '규격, 옵션, 사이즈', qty: '기말실사(이월수량), 기말실사, 기말/실사, 수량, 재고, 기말잔량(실사반영), 기말잔량(실사), 기말잔량, 수량(합계), 입고수량, 출고수량, 판매수량, 잔량, 실사, 합계, 기말, 판매량, 출고량, 입고량', price: '매입단가(원가), 단가, 입고단가, 구매단가, 판매단가, 매입단가, 매입가, 판매가, 공급가액, 공급가, 금액, 원가, 가격, 최종(창고), 최종입고', date: '결산일자, 매입일자, 일자, 날짜, 구매일자, 판매일자, 입고일자, 출고일자, 기록', vendor: '매출처명, 매입처(Lot), 매입처(거래처), 거래처명, 거래처, 거래, 매장명, 매장, 고객, 판매처, 공급사, 판매, 청과, 3거래' };
                let opsMappings = defMap;
                try { if (sMap) opsMappings = { ...defMap, ...JSON.parse(sMap) }; } catch(e){}

                const sGrp = localStorage.getItem('inventoryGroupingV79');
                let opsGrouping = { priceMode: 'separate', splitByVendor: false, splitByDate: false };
                try { if (sGrp) opsGrouping = { ...opsGrouping, ...JSON.parse(sGrp) }; } catch(e){}

                return { cloudUrl, opsMappings, opsGrouping };
            };
            const [config, setConfig] = useState(loadConfig());
            useEffect(() => {
                const handleStorageChange = () => setConfig(loadConfig());
                window.addEventListener('storage', handleStorageChange);
                return () => window.removeEventListener('storage', handleStorageChange);
            }, []);
            return config;
        };

        const parseExcelRobust = (file) => new Promise((resolve, reject) => {
            if (!window.XLSX) return reject(new Error("엑셀 파서 로드 안됨"));
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = window.XLSX.read(data, { type: 'array', cellDates: true });
                    const jsonAll = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "", raw: false });
                    if(jsonAll.length === 0) return resolve([]);
                    let headerRowIdx = 0;
                    for (let i = 0; i < Math.min(15, jsonAll.length); i++) {
                        const rowStr = jsonAll[i].join('').replace(/\s/g, '');
                        if (rowStr.includes('코드') || rowStr.includes('품명') || rowStr.includes('상품')) { headerRowIdx = i; break; }
                    }
                    const headers = jsonAll[headerRowIdx] || [];
                    const parsedData = [];
                    for (let i = headerRowIdx + 1; i < jsonAll.length; i++) {
                        const row = jsonAll[i]; if (!row) continue;
                        let isEmpty = true; const obj = {}; 
                        headers.forEach((h, idx) => { if (h) { obj[h] = row[idx]; if(row[idx] !== undefined && String(row[idx]).trim() !== '') isEmpty = false; } }); 
                        if(!isEmpty) parsedData.push(obj);
                    } resolve(parsedData);
                } catch (err) { reject(err); }
            };
            reader.readAsArrayBuffer(file);
        });

        // ==========================================
        // 🌟 최적화 2: 메모이제이션 적용된 수불부 행 컴포넌트
        // ==========================================
        const InventoryRow = React.memo(({ item, index, onUpdateCell }) => {
            const hasIssue = item.이슈 && item.이슈.length > 0;
            const qty = item.실사 === '' || item.실사 === null ? 0 : parseNum(item.실사);
            const price = parseNum(item.단가) || 0;
            const assetValue = qty * price;
            const adjust = (parseNum(item.로스) || 0) + (parseNum(item.대체입고) || 0) - (parseNum(item.대체출고) || 0);

            return (
                <tr className="hover:bg-slate-50 transition-colors h-[44px] group">
                    <td className="px-3 py-1.5 text-center">
                        {hasIssue ? (
                            <span className="bg-rose-100 text-rose-600 px-1.5 py-0.5 rounded text-[10px] font-black" title={item.이슈.join(', ')}>이슈</span>
                        ) : (
                            <span className="bg-emerald-100 text-emerald-600 px-1.5 py-0.5 rounded text-[10px] font-black">정상</span>
                        )}
                    </td>
                    <td className="px-3 py-1.5 text-[11px] text-slate-500 font-mono text-center">{item.일자 || '-'}</td>
                    <td className="px-3 py-1.5 text-[11px] text-slate-600 font-bold truncate max-w-[100px]">{item.거래처 || '자체/미지정'}</td>
                    <td className="px-3 py-1.5 font-mono text-slate-400 text-[11px]">{item.코드}</td>
                    <td className="px-3 py-1.5"><span className="font-bold text-slate-800 truncate block max-w-[200px]">{item.품명}</span></td>
                    
                    <td className="px-3 py-1.5 text-right font-medium text-slate-500 bg-slate-50/50">{parseNum(item.기초).toLocaleString()}</td>
                    <td className="px-3 py-1.5 text-right font-medium text-blue-600 bg-blue-50/20">{parseNum(item.입고).toLocaleString()}</td>
                    <td className="px-3 py-1.5 text-right font-medium text-rose-600 bg-rose-50/20">{parseNum(item.출고).toLocaleString()}</td>
                    <td className="px-3 py-1.5 text-right font-black text-indigo-700 bg-indigo-50/40">{qty.toLocaleString()}</td>
                    
                    <td className="px-3 py-1.5 text-right font-bold text-slate-600">{price > 0 ? price.toLocaleString() : '-'}</td>
                    <td className="px-3 py-1.5 text-right font-black text-emerald-700 bg-emerald-50/30">{assetValue > 0 ? assetValue.toLocaleString() : '-'}</td>
                    
                    <td className="px-3 py-1.5 text-right font-bold">
                        {adjust > 0 && <span className="text-emerald-500">+{adjust.toLocaleString()}</span>}
                        {adjust < 0 && <span className="text-rose-500">{adjust.toLocaleString()}</span>}
                        {adjust === 0 && <span className="text-slate-300">-</span>}
                    </td>
                    <td className="px-3 py-1.5">
                        <input 
                            type="text" 
                            className="w-full bg-transparent outline-none border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:bg-white px-1 py-0.5 text-[11px] transition-colors"
                            placeholder="메모..."
                            value={item.메모 || ''}
                            onChange={(e) => onUpdateCell(item.id, '메모', e.target.value)}
                        />
                    </td>
                </tr>
            );
        }, (prev, next) => {
            // 깊은 비교로 렌더링 방어막 구성
            return JSON.stringify(prev.item) === JSON.stringify(next.item);
        });

        // ==========================================
        // ⚙️ 메인 렌더링
        // ==========================================
        const InventoryApp = () => {
            const config = useMerchConfig();
            const [masterProducts, setMasterProducts] = useState({});
            const [inventoryData, setInventoryData] = useState([]);
            
            const [toastMsg, setToastMsg] = useState('');
            const [isProcessing, setIsProcessing] = useState(false);
            const [processMsg, setProcessMsg] = useState('');
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [globalSearch, setGlobalSearch] = useState('');
            const [targetDate, setTargetDate] = useState(() => new Date().toISOString().slice(0, 10));

            const showToast = useCallback((msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3000); }, []);

            const handleNavigate = useCallback((e, path, isReady = true) => {
                if (e && e.preventDefault) e.preventDefault();
                if (!path || path === '#' || !isReady) return showToast("⚠️ 해당 페이지는 현재 준비 중이거나 경로가 올바르지 않습니다.");
                try {
                    const protocol = window.location.protocol;
                    if (protocol === 'about:' || protocol === 'blob:' || protocol === 'data:') showToast(`💡 미리보기 환경: [${path}] 로 이동 시뮬레이션.`);
                    else window.location.href = path;
                } catch (err) { showToast(`💡 이동 시뮬레이션: [${path}]`); }
            }, [showToast]);

            useEffect(() => {
                getIDB(STORAGE_KEYS.MASTER_DB).then(data => { if (data) setMasterProducts(data); }).catch(console.error);
            }, []);

            // 💡 엑셀 업로드 및 수불 계산
            const handleExcelUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsProcessing(true); setProcessMsg("수불 데이터 분석 중...");

                try {
                    const excelData = await parseExcelRobust(file);
                    if (excelData.length === 0) throw new Error("데이터가 없습니다.");

                    const getHeaderKey = (keywordStr) => {
                        const keywords = keywordStr.split(',').map(s => s.trim().toLowerCase());
                        const headers = Object.keys(excelData[0]);
                        let matched = headers.find(h => keywords.some(k => h.toLowerCase() === k));
                        if (!matched) matched = headers.find(h => keywords.some(k => h.toLowerCase().includes(k)));
                        return matched;
                    };

                    const codeKey = getHeaderKey(config.opsMappings.code);
                    const nameKey = getHeaderKey(config.opsMappings.name);
                    const qtyKey = getHeaderKey(config.opsMappings.qty);
                    const priceKey = getHeaderKey(config.opsMappings.price);
                    const vendorKey = getHeaderKey(config.opsMappings.vendor);
                    const dateKey = getHeaderKey(config.opsMappings.date);

                    if (!codeKey) throw new Error(`필수 열을 찾을 수 없습니다. (설정 매핑 확인 필요)`);

                    let aggregated = {};
                    let count = 0;

                    excelData.forEach(row => {
                        const rawCode = String(row[codeKey] || '').trim();
                        if (!rawCode || rawCode === 'undefined') return;
                        
                        let vendor = vendorKey ? String(row[vendorKey] || '').trim() : '미지정';
                        let rowDate = dateKey ? String(row[dateKey] || targetDate).trim() : targetDate;
                        
                        let key = rawCode;
                        if (config.opsGrouping.splitByVendor) key += `|${vendor}`;
                        if (config.opsGrouping.splitByDate) key += `|${rowDate}`;

                        if (!aggregated[key]) {
                            const mItem = masterProducts[rawCode] || {};
                            aggregated[key] = {
                                id: generateUUID(),
                                코드: rawCode,
                                품명: nameKey ? row[nameKey] : mItem.품목명 || '[미등록 품목]',
                                거래처: vendor,
                                일자: rowDate,
                                기초: 0, 입고: 0, 출고: 0, 실사: null, 
                                대체입고: 0, 대체출고: 0, 로스: 0,
                                단가: priceKey && row[priceKey] ? parseNum(row[priceKey]) : parseNum(mItem.입고가),
                                이슈: !mItem.품목명 ? ['마스터 누락'] : [],
                                메모: ''
                            };
                        }

                        const targetItem = aggregated[key];
                        const rowQty = qtyKey ? parseNum(row[qtyKey]) : 0;
                        
                        // 💡 실무 상황: 단순히 엑셀의 '수량'을 입/출고로 분배한다고 가정 (양수=입고/기말, 음수=출고)
                        // 실제로는 전표구분(매입/매출/실사) 열을 통해 로직을 나누는 것이 맞으나, 
                        // 제공된 컨텍스트가 없으므로 범용적인 가라 로직 사용
                        if (qtyKey && String(qtyKey).includes('기말') || String(qtyKey).includes('실사')) {
                            targetItem.실사 = rowQty;
                        } else {
                            if (rowQty > 0) targetItem.입고 += rowQty;
                            else if (rowQty < 0) targetItem.출고 += Math.abs(rowQty);
                        }
                        
                        count++;
                    });

                    // 기말 실사가 들어오지 않은 경우 기초+입고-출고 로 자동 계산
                    Object.values(aggregated).forEach(item => {
                        if (item.실사 === null) {
                            item.실사 = item.기초 + item.입고 - item.출고;
                        }
                    });

                    setInventoryData(Object.values(aggregated));
                    showToast(`✅ ${count}건 수불 데이터 분석 완료!`);

                } catch (error) {
                    console.error(error);
                    showToast("❌ 엑셀 분석 실패: " + error.message);
                } finally {
                    e.target.value = '';
                    setIsProcessing(false); setProcessMsg('');
                }
            };

            const handleUpdateCell = useCallback((id, field, value) => {
                setInventoryData(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
            }, []);

            const handleCombinedExport = useCallback(() => {
                if (inventoryData.length === 0) return showToast("⚠️ 다운로드할 데이터가 없습니다.");
                setIsProcessing(true); setProcessMsg("수불일보 엑셀 생성 중...");
                setTimeout(() => {
                    const exportData1 = inventoryData.map(item => {
                        const qty = item.실사 === '' || item.실사 === null ? 0 : parseNum(item.실사);
                        return { 
                            '일자': item.일자, 
                            '매입처(Lot)': item.거래처, 
                            '상품코드': item.코드, 
                            '상품명(규격)': item.품명, 
                            '기초수량': item.기초, 
                            '입고수량': item.입고, 
                            '출고량': item.출고, 
                            '기말실사(이월수량)': qty, 
                            '매입단가(원가)': parseNum(item.단가)||0, 
                            '기말재고액(자산가치)': qty * (parseNum(item.단가)||0), 
                            '로스/조정수량': (parseNum(item.로스)||0) + (parseNum(item.대체입고)||0) - (parseNum(item.대체출고)||0), 
                            '이슈/결과': item.이슈.join(', '), 
                            '수기메모': item.메모 || '' 
                        };
                    });
                    const wb = window.XLSX.utils.book_new(); 
                    window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(exportData1), '재고수불일보');
                    try { 
                        const excelBuffer = window.XLSX.write(wb, { bookType: 'xlsx', type: 'array' }); 
                        const blob = new Blob([excelBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }); 
                        const url = URL.createObjectURL(blob); 
                        const a = document.createElement('a'); 
                        a.href = url; a.download = `NEXUS_Stock_Ledger_${targetDate.replace(/-/g, '')}.xlsx`; 
                        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); 
                        showToast("✅ 수불일보 데이터가 엑셀로 다운로드되었습니다."); 
                    } catch (err) { showToast("❌ 엑셀 파일 생성 중 오류가 발생했습니다."); } 
                    finally { setIsProcessing(false); setProcessMsg(''); }
                }, 500);
            }, [inventoryData, targetDate, showToast]);

            const handlePush = async () => {
                if (!config.cloudUrl) return showToast("⚠️ 설정에서 앱스크립트 URL을 입력하세요.");
                const unsyncedMaster = await getIDB(STORAGE_KEYS.UNSYNCED_MASTER) || {};
                const unsyncedHistory = await getIDB(STORAGE_KEYS.UNSYNCED_HISTORY) || [];
                const unsyncedDict = await getIDB(STORAGE_KEYS.UNSYNCED_DICT) || {};
                if (Object.keys(unsyncedMaster).length === 0 && unsyncedHistory.length === 0 && Object.keys(unsyncedDict).length === 0) return showToast("⚠️ 클라우드에 새로 반영할 변경사항이 없습니다.");

                setIsProcessing(true); setProcessMsg("클라우드 백업 중...");
                try {
                    const response = await fetch(config.cloudUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'pushData', masterDelta: unsyncedMaster, historyDelta: unsyncedHistory, dictDelta: unsyncedDict })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        await setIDB(STORAGE_KEYS.UNSYNCED_MASTER, {});
                        await setIDB(STORAGE_KEYS.UNSYNCED_HISTORY, []);
                        await setIDB(STORAGE_KEYS.UNSYNCED_DICT, {});
                        showToast(`✅ 클라우드 동기화 완료`);
                    } else throw new Error(result.message || '서버 응답 오류');
                } catch (err) { console.error(err); showToast("❌ 클라우드 백업 실패: " + err.message); } finally { setIsProcessing(false); setProcessMsg(""); }
            };

            const handlePull = async () => {
                if (!config.cloudUrl) return showToast("⚠️ 설정에서 앱스크립트 URL을 입력하세요.");
                setIsProcessing(true); setProcessMsg("데이터 동기화 중...");
                try {
                    const response = await fetch(`${config.cloudUrl}?action=pullData`, { method: 'GET' });
                    const result = await response.json();
                    if (result.status === 'success') {
                        if (result.master) { setMasterProducts(result.master); await setIDB(STORAGE_KEYS.MASTER_DB, result.master); }
                        if (result.history) await setIDB(STORAGE_KEYS.HISTORY_DB, result.history);
                        localStorage.setItem(STORAGE_KEYS.SYNC_TRIGGER, Date.now().toString());
                        showToast("✅ 클라우드 데이터 수신 완료");
                    } else throw new Error(result.message || '서버 응답 오류');
                } catch (err) { console.error(err); showToast("❌ 데이터 동기화 실패: " + err.message); } finally { setIsProcessing(false); setProcessMsg(""); }
            };

            // 💡 검색 필터링
            const displayData = useMemo(() => {
                let data = inventoryData;
                if (globalSearch.trim()) {
                    const kw = globalSearch.toLowerCase().replace(/\s+/g, '');
                    data = data.filter(item => {
                        const target = (safeStr(item.코드) + safeStr(item.품명) + safeStr(item.거래처)).toLowerCase();
                        return target.includes(kw);
                    });
                }
                // 이슈(마스터 누락 등) 항목을 위로 올림
                data.sort((a, b) => {
                    if (a.이슈.length > 0 && b.이슈.length === 0) return -1;
                    if (a.이슈.length === 0 && b.이슈.length > 0) return 1;
                    return String(a.코드).localeCompare(String(b.코드));
                });
                return data;
            }, [inventoryData, globalSearch]);

            const summary = useMemo(() => {
                let issues = 0, totalStock = 0, totalValue = 0;
                displayData.forEach(i => {
                    if(i.이슈.length > 0) issues++;
                    const qty = parseNum(i.실사) || 0;
                    const price = parseNum(i.단가) || 0;
                    totalStock += qty;
                    totalValue += (qty * price);
                });
                return { issues, totalStock, totalValue };
            }, [displayData]);

            // ==========================================
            // 🌟 최적화 3: 메인 화면 가상 스크롤
            // ==========================================
            const [scrollTop, setScrollTop] = useState(0);
            const handleScroll = useCallback((e) => setScrollTop(e.target.scrollTop), []);
            
            const ROW_HEIGHT = 44; 
            const BUFFER_SIZE = 15;
            const VIEWPORT_HEIGHT = window.innerHeight - 250;

            const startIndex = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - BUFFER_SIZE);
            const endIndex = Math.min(displayData.length, Math.floor((scrollTop + VIEWPORT_HEIGHT) / ROW_HEIGHT) + BUFFER_SIZE);

            const virtualRows = displayData.slice(startIndex, endIndex);
            const topPadding = startIndex * ROW_HEIGHT;
            const bottomPadding = Math.max(0, (displayData.length - endIndex) * ROW_HEIGHT);

            return (
                <div className="h-screen w-full max-w-[1500px] mx-auto flex flex-col font-sans overflow-hidden bg-[#f1f5f9] relative shadow-2xl border-x border-slate-300 select-none">
                    <GlobalHeader 
                        activeTab="inventory" itemCount={Object.keys(masterProducts).length} 
                        isProcessing={isProcessing} processMsg={processMsg}
                        onOpenSettings={() => setShowSettingsModal(true)}
                        onPush={handlePush} onPull={handlePull} onNavigate={handleNavigate}
                    />
                    
                    {toastMsg && (
                        <div className="fixed bottom-10 right-10 z-[100] bg-slate-900 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 fade-in border border-slate-700 font-bold">
                            <SafeIcon name="check-circle-2" size={18} className="text-emerald-400" />
                            <span className="text-sm font-bold tracking-tight">{toastMsg}</span>
                        </div>
                    )}

                    <div className="px-6 py-3 bg-white border-b border-slate-200 z-50 w-full shrink-0 flex items-center justify-between shadow-sm">
                        <div className="flex items-center gap-4">
                            <div className="flex flex-col">
                                <span className="text-[11px] font-black text-slate-400 mb-0.5 uppercase tracking-wider">기준 일자</span>
                                <input type="date" value={targetDate} onChange={e=>setTargetDate(e.target.value)} className="bg-slate-50 border border-slate-200 text-slate-700 text-[13px] font-bold px-2 py-1 rounded outline-none focus:border-indigo-500 focus:bg-white transition-colors cursor-pointer shadow-inner" />
                            </div>
                            <div className="w-px h-8 bg-slate-200 mx-1"></div>
                            <div className="flex gap-4">
                                <div className="flex flex-col items-center"><span className="text-[10px] text-slate-400 font-bold">표시된 품목</span><span className="text-[14px] font-black text-slate-800">{displayData.length.toLocaleString()}</span></div>
                                <div className="flex flex-col items-center"><span className="text-[10px] text-slate-400 font-bold">이슈 발생</span><span className={`text-[14px] font-black ${summary.issues > 0 ? 'text-rose-500' : 'text-emerald-500'}`}>{summary.issues.toLocaleString()}</span></div>
                                <div className="flex flex-col items-center"><span className="text-[10px] text-slate-400 font-bold">총 재고자산</span><span className="text-[14px] font-black text-indigo-700">{summary.totalValue.toLocaleString()}원</span></div>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <label className="h-9 px-4 rounded-lg text-[12px] font-bold bg-white text-slate-700 hover:bg-slate-100 border border-slate-300 transition-colors flex items-center shadow-sm cursor-pointer">
                                <SafeIcon name="upload" size={14} className="mr-2 text-slate-500" /> 매입/매출/실사 업로드
                                <input type="file" className="hidden" accept=".xlsx" onChange={handleExcelUpload} disabled={isProcessing} />
                            </label>
                            {inventoryData.length > 0 && (
                                <button onClick={handleCombinedExport} className="h-9 px-4 rounded-lg text-[12px] font-bold shadow-sm transition-colors flex items-center bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100" title="현재 계산된 수불 이력을 엑셀로 다운로드합니다.">
                                    <i className="fas fa-file-export mr-1.5 text-[13px]"></i> 수불일보 생성
                                </button>
                            )}
                            <div className="w-px h-6 bg-slate-200 mx-1"></div>
                            <div className="relative w-48 sm:w-64 h-9 shrink-0">
                                <input type="text" placeholder="결과 내 검색..." value={globalSearch} onChange={e=>{setGlobalSearch(e.target.value); setScrollTop(0);}} className="w-full h-full pl-9 pr-4 bg-slate-100 border border-slate-200 rounded-lg text-[13px] outline-none focus:ring-1 focus:ring-indigo-400 focus:bg-white transition-all shadow-inner font-bold text-slate-700" />
                                <SafeIcon name="search" size={14} className="absolute left-3 top-2.5 text-slate-400 pointer-events-none" />
                            </div>
                        </div>
                    </div>

                    <main className="flex-1 flex flex-col overflow-hidden bg-slate-50">
                        <div className="flex-1 overflow-auto custom-scrollbar relative" onScroll={handleScroll}>
                            <table className="w-full text-left text-[12px] whitespace-nowrap relative z-0">
                                <thead className="bg-[#1e293b] text-slate-50 font-bold sticky top-0 z-10 shadow-md">
                                    <tr>
                                        <th className="py-2.5 px-3 border-r border-slate-700 text-center w-16">상태</th>
                                        <th className="py-2.5 px-3 border-r border-slate-700 text-center w-24">일자</th>
                                        <th className="py-2.5 px-3 border-r border-slate-700 w-28">매입처(Lot)</th>
                                        <th className="py-2.5 px-3 border-r border-slate-700 w-28 text-slate-300">상품코드</th>
                                        <th className="py-2.5 px-3 border-r border-slate-700 w-64">마스터 품목명 (규격)</th>
                                        <th className="py-2.5 px-3 border-r border-slate-700 text-right w-20 text-slate-300">기초</th>
                                        <th className="py-2.5 px-3 border-r border-slate-700 text-right w-20 text-blue-300">당기입고</th>
                                        <th className="py-2.5 px-3 border-r border-slate-700 text-right w-20 text-rose-300">당기출고</th>
                                        <th className="py-2.5 px-3 border-r border-slate-700 text-right w-24 text-emerald-300">기말/실사</th>
                                        <th className="py-2.5 px-3 border-r border-slate-700 text-right w-24 text-amber-300">입고단가</th>
                                        <th className="py-2.5 px-3 border-r border-slate-700 text-right w-24 text-indigo-300">자산가치</th>
                                        <th className="py-2.5 px-3 border-r border-slate-700 text-right w-20">조정/로스</th>
                                        <th className="py-2.5 px-3 w-40">수기 메모</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-200 bg-white">
                                    {displayData.length === 0 ? (
                                        <tr><td colSpan="13" className="py-20 text-center text-slate-400 font-bold bg-slate-50"><i className="fas fa-boxes text-5xl mb-4 text-slate-300 block"></i>상단의 [엑셀 업로드]를 통해 매입/매출/실사 데이터를 올려주세요.</td></tr>
                                    ) : (
                                        <>
                                            {topPadding > 0 && <tr style={{ height: `${topPadding}px` }}><td colSpan="13"></td></tr>}
                                            {virtualRows.map((item, idx) => (
                                                <InventoryRow key={item.id} item={item} index={startIndex + idx} onUpdateCell={handleUpdateCell} />
                                            ))}
                                            {bottomPadding > 0 && <tr style={{ height: `${bottomPadding}px` }}><td colSpan="13"></td></tr>}
                                        </>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </main>

                    <IframeSettingsModal isOpen={showSettingsModal} onClose={() => setShowSettingsModal(false)} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><InventoryApp /></ErrorBoundary>);
    </script>
</body>
</html>
