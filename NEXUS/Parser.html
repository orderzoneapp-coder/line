        };

        // ==========================================
        // ⚙️ 메인 렌더링
        // ==========================================
        const ParserApp = () => {
            const appState = useParserApp();
            const actions = useParserActions(appState);

            const { 
                masterProducts, parserBuffer, currentTag, activeTab, setActiveTab,
                showInputModal, setShowInputModal, showReviewModal, setShowReviewModal, 
                showErpModal,
                toastMsg, isProcessing, processMsg,
                globalSearch, setGlobalSearch, targetId, setTargetId,
                selectedMissingCodes, setSelectedMissingCodes, processedCodes
            } = appState;

            // 🌟 메인 화면에서 F8을 눌렀을 때 '반영하기 검토' 창을 여는 전역 단축키 추가
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'F8') {
                        if (!showReviewModal) { // 모달이 닫혀 있을 때만 작동
                            e.preventDefault();
                            const btn = document.getElementById('btn-open-review');
                            if (btn && !btn.disabled) {
                                setShowReviewModal(true);
                            }
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [showReviewModal, setShowReviewModal]);

            const handleNavigate = useCallback((e, path, isReady = true) => {
                if (e && e.preventDefault) e.preventDefault();
                if (!path || path === '#' || !isReady) return appState.showToast("⚠️ 해당 페이지는 현재 준비 중이거나 경로가 올바르지 않습니다.");
                try {
                    const protocol = window.location.protocol;
                    if (protocol === 'about:' || protocol === 'blob:' || protocol === 'data:') appState.showToast(`💡 미리보기 환경: [${path}] 로 이동을 시뮬레이션 합니다.`);
                    else window.location.href = path;
                } catch (err) { appState.showToast(`💡 이동 시뮬레이션: [${path}]`); }
            }, [appState.showToast]);

            const availableTags = useMemo(() => {
                const counts = {};
                Object.values(masterProducts).forEach(m => {
                    const tagStr = m['카탈로그'] || '';
                    tagStr.split(',').forEach(t => { const trimmed = t.trim(); if (trimmed) counts[trimmed] = (counts[trimmed] || 0) + 1; });
                });
                return Object.keys(counts).sort().map(tag => ({ name: tag, count: counts[tag] }));
            }, [masterProducts]);

            const searchMasterProducts = (productsObj, keyword) => {
                if (!keyword || !keyword.trim()) return [];
                const cleanKw = keyword.toLowerCase().replace(/[()[\]{},./|]/g, ' ');
                const tokens = cleanKw.split(/\s+/).filter(t => t.length > 0);
                if (tokens.length === 0) return [];
                const results = Object.values(productsObj).map(m => {
                    const mName = String(m.품목명 || '').toLowerCase(); const mSpec = String(m.규격 || '').toLowerCase();
                    let score = 0, matchCount = 0;
                    tokens.forEach(token => {
                        if (mName.includes(token)) { score += token.length * 10; matchCount++; } 
                        else if (mSpec.includes(token)) { score += token.length * 5; matchCount++; } 
                    });
                    if ((mName + mSpec).replace(/\s+/g, '').includes(cleanKw.replace(/\s+/g, ''))) score += 1000;
                    return { item: m, score, matchCount };
                }).filter(r => r.score > 0);
                results.sort((a, b) => b.score - a.score || b.matchCount - a.matchCount);
                return results.map(r => r.item);
            };

            const matchedRows = parserBuffer.filter(r => r._matchCode);
            const similarRows = parserBuffer.filter(r => !r._matchCode && r._matchStatus.includes('유사') && !r._matchStatus.includes('중복'));
            const duplicateRows = parserBuffer.filter(r => !r._matchCode && r._matchStatus.includes('중복품목'));
            const combinedSimilarRows = [...duplicateRows, ...similarRows];
            const unmatchedRows = parserBuffer.filter(r => !r._matchCode && r._matchStatus.includes('불일치'));

            const missingRows = useMemo(() => {
                if (!currentTag) return [];
                const matchedCodes = new Set(matchedRows.map(r => String(r._matchCode)));
                const processedStr = new Set(Array.from(processedCodes).map(String));
                const missing = [];
                for (const code in masterProducts) {
                    const mItem = masterProducts[code];
                    const tags = (mItem['카탈로그'] || '').split(',').map(s => s.trim());
                    if (tags.includes(currentTag) && !matchedCodes.has(String(code)) && !processedStr.has(String(code))) {
                        missing.push(mItem);
                    }
                }
                return missing;
            }, [masterProducts, matchedRows, currentTag, processedCodes]);

            const masterSearchResults = useMemo(() => {
                if ((activeTab !== 'similar' && activeTab !== 'unmatched') || !globalSearch.trim()) return [];
                return searchMasterProducts(masterProducts, globalSearch).slice(0, 50);
            }, [globalSearch, masterProducts, activeTab]);

            const displayUnmatchedRows = activeTab === 'similar' ? combinedSimilarRows : unmatchedRows;

            const handleUpdateMatchedPrice = useCallback((rowId, newVal) => {
                appState.setParserBuffer(prev => prev.map(r => {
                    if (r._id === rowId) {
                        const mItem = masterProducts[r._matchCode] || {};
                        const pInRaw = newVal;
                        const recalculatedFinal = calculatePricesEngine(parseNum(pInRaw), mItem, r.finalData || {}, appState.marginRules, true);
                        return { ...r, finalData: recalculatedFinal };
                    }
                    return r;
                }));
            }, [masterProducts, appState.marginRules, appState.setParserBuffer]);
            
            const handleToggleApply = useCallback((id) => {
                appState.setParserBuffer(p => p.map(r => r._id === id ? {...r, _apply: !r._apply} : r));
            }, [appState.setParserBuffer]);

            const [scrollTop, setScrollTop] = useState(0);
            const handleScroll = useCallback((e) => setScrollTop(e.target.scrollTop), []);
            
            const ROW_HEIGHT = 40;
            const BUFFER_SIZE = 15;
            const VIEWPORT_HEIGHT = window.innerHeight - 250;

            const currentMainList = activeTab === 'matched' ? matchedRows : activeTab === 'missing' ? missingRows : displayUnmatchedRows;
            const startIndex = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - BUFFER_SIZE);
            const endIndex = Math.min(currentMainList.length, Math.floor((scrollTop + VIEWPORT_HEIGHT) / ROW_HEIGHT) + BUFFER_SIZE);

            const virtualRows = currentMainList.slice(startIndex, endIndex);
            const topPadding = startIndex * ROW_HEIGHT;
            const bottomPadding = Math.max(0, (currentMainList.length - endIndex) * ROW_HEIGHT);

            return (
                <div className="h-screen w-full bg-slate-100 flex justify-center overflow-hidden font-sans">
                    {toastMsg && <div className="fixed bottom-6 right-6 z-[1000] bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 fade-in text-sm font-bold border border-slate-700"><i className="fas fa-check-circle text-emerald-400"></i>{toastMsg}</div>}

                    <div className="w-full max-w-[1500px] h-full flex flex-col bg-slate-50 shadow-2xl overflow-hidden mx-auto">
                        <GlobalHeader 
                            activeTab="parser" itemCount={Object.keys(masterProducts).length} 
                            isProcessing={isProcessing} processMsg={processMsg}
                            onOpenSettings={() => appState.setShowSettingsModal(true)}
                            onPush={actions.handlePush} onPull={actions.handlePull}
                            onNavigate={handleNavigate}
                        />

                        {/* 🌟 수정된 단일 툴바 영역 (중복된 블랙 헤더 제거) */}
                        <div className="px-6 py-3 flex items-center justify-between gap-4 bg-white border-b border-slate-200 z-40 w-full shrink-0 shadow-sm">
                            <div className="flex gap-1.5 shrink-0 bg-slate-100/80 p-1.5 rounded-xl border border-slate-200">
                                <button onClick={()=>{setActiveTab('matched'); setScrollTop(0);}} className={`px-4 py-1.5 rounded-lg text-[12px] font-black transition-all ${activeTab==='matched' ? 'bg-white text-emerald-600 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-700'}`}>🟢 일치 ({matchedRows.length})</button>
                                <button onClick={()=>{setActiveTab('similar'); setScrollTop(0);}} className={`px-4 py-1.5 rounded-lg text-[12px] font-black transition-all ${activeTab==='similar' ? 'bg-white text-amber-600 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-700'}`}>🟡 유사 ({combinedSimilarRows.length})</button>
                                <button onClick={()=>{setActiveTab('unmatched'); setScrollTop(0);}} className={`px-4 py-1.5 rounded-lg text-[12px] font-black transition-all ${activeTab==='unmatched' ? 'bg-white text-rose-600 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-700'}`}>🔴 불일치 ({unmatchedRows.length})</button>
                                <div className="w-px bg-slate-300 mx-0.5 my-1"></div>
                                <button onClick={()=>{setActiveTab('missing'); setScrollTop(0);}} className={`px-4 py-1.5 rounded-lg text-[12px] font-black transition-all flex items-center gap-1.5 ${activeTab==='missing' ? 'bg-white text-slate-800 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-700'}`}>⚪ 누락 {currentTag && missingRows.length > 0 && <span className="bg-rose-100 text-rose-600 px-1.5 rounded text-[10px]">{missingRows.length}</span>}</button>
                            </div>

                            <div className="flex-1 flex justify-center min-w-[10px] px-4">
                                {isProcessing ? (
                                    <div className="text-amber-600 font-bold text-[12px] flex items-center"><i className="fas fa-spinner fa-spin mr-2"></i><span className="truncate">{processMsg}</span></div>
                                ) : parserBuffer.length > 0 ? (
                                    currentTag ? (
                                        <div className="text-indigo-600 font-bold text-[13px] flex items-center"><i className="fas fa-folder mr-1.5 opacity-80"></i>작업 카탈로그: <span className="ml-1 text-indigo-700 font-black truncate">{currentTag}</span></div>
                                    ) : (
                                        <div className="text-slate-600 font-bold text-[13px] flex items-center"><i className="fas fa-bolt mr-1.5 opacity-80"></i>단순 파싱 모드 <span className="ml-1 font-normal truncate">(카탈로그 미지정)</span></div>
                                    )
                                ) : null}
                            </div>

                            <div className="flex items-center gap-2 shrink-0">
                                <button onClick={() => setShowInputModal(true)} className="h-9 px-4 rounded-lg text-[12px] font-bold bg-indigo-50 text-indigo-600 border border-indigo-200 hover:bg-indigo-100 shadow-sm transition-colors flex items-center">
                                    <i className="fas fa-magic mr-1.5 text-[13px]"></i> 새 텍스트 파싱
                                </button>
                                <div className="w-px h-6 bg-slate-300 mx-1"></div>
                                
                                {/* 🌟 언제나 확인 및 진입 가능한 반영하기(프리뷰) 버튼 + F8 단축키 추가 */}
                                <button id="btn-open-review" onClick={() => setShowReviewModal(true)} disabled={matchedRows.filter(r=>r._apply).length === 0} className={`h-9 px-5 rounded-lg text-[12px] font-black shadow-sm transition-colors flex items-center ${matchedRows.filter(r=>r._apply).length > 0 ? 'bg-slate-800 text-white hover:bg-slate-700' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`} title="매핑 작업을 완료하고 투트랙 프리뷰를 검토합니다. [단축키: F8]">
                                    <i className="fas fa-check-circle mr-1.5 text-[13px]"></i> 반영하기 검토 [F8]
                                </button>
                                
                                {activeTab === 'missing' && (
                                    <button onClick={actions.handleRemoveMissingTags} className={`h-9 px-4 rounded-lg text-[12px] font-bold shadow-sm transition-colors flex items-center ${selectedMissingCodes.size > 0 ? 'bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100' : 'bg-white text-slate-400 border border-slate-200'}`}>
                                        <i className="fas fa-eraser mr-1.5 text-[13px]"></i> 카탈로그 제외
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="flex-1 overflow-auto p-5 pt-0 bg-slate-100">
                            {!currentTag && parserBuffer.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-400">
                                    <i className="fas fa-robot text-6xl text-slate-300 mb-4"></i>
                                    <h2 className="text-xl font-black text-slate-600 mb-2">Smart Parser 대기중</h2>
                                    <p className="text-[13px] font-bold">상단 [새 텍스트 파싱] 버튼을 눌러 작업을 시작하세요.</p>
                                </div>
                            ) : activeTab === 'matched' ? (
                                <div className="bg-white border border-slate-200 rounded-xl shadow-sm h-full flex flex-col overflow-hidden fade-in relative">
                                    <div className="flex-1 overflow-auto custom-scrollbar" onScroll={handleScroll}>
                                        <table className="w-full text-left text-[12px] whitespace-nowrap relative z-0">
                                            <thead className="bg-[#f5f4f0] text-[#5c554d] font-bold sticky top-0 z-10 border-b border-[#e8e4db]">
                                                <tr>
                                                    <th className="py-2.5 px-4 w-12 text-center"><input type="checkbox" className="rounded cursor-pointer" checked={matchedRows.length>0 && matchedRows.every(r=>r._apply)} onChange={() => { const all = matchedRows.every(r=>r._apply); appState.setParserBuffer(p => p.map(r => r._matchCode ? {...r, _apply: !all} : r)); }} /></th>
                                                    <th className="py-2.5 px-3">상품코드</th>
                                                    <th className="py-2.5 px-3">마스터 품목명 (규격)</th>
                                                    <th className="py-2.5 px-3 text-emerald-700 bg-emerald-50/50">파싱 품목명</th>
                                                    <th className="py-2.5 px-3 text-right">기존 입고가</th>
                                                    <th className="py-2.5 px-3 text-right text-emerald-700 bg-emerald-50/50">새 입고가</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {matchedRows.length === 0 ? <tr><td colSpan="6" className="p-10 text-center text-slate-400">데이터가 없습니다.</td></tr> : (
                                                    <>
                                                        {topPadding > 0 && <tr style={{ height: `${topPadding}px` }}><td colSpan="6"></td></tr>}
                                                        {virtualRows.map(row => (
                                                            <MatchedRow 
                                                                key={row._id} 
                                                                row={row} 
                                                                mItem={masterProducts[row._matchCode] || {}} 
                                                                onToggle={handleToggleApply} 
                                                                onUpdatePrice={handleUpdateMatchedPrice} 
                                                            />
                                                        ))}
                                                        {bottomPadding > 0 && <tr style={{ height: `${bottomPadding}px` }}><td colSpan="6"></td></tr>}
                                                    </>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            ) : activeTab === 'missing' ? (
                                !currentTag ? (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-400 bg-white border border-slate-200 rounded-xl shadow-sm fade-in">
                                        <i className="fas fa-folder-open text-6xl text-slate-200 mb-4"></i>
                                        <h2 className="text-xl font-black text-slate-600 mb-2">누락(단종) 계산 생략됨</h2>
                                        <p className="text-[13px] font-bold text-center leading-relaxed">새 텍스트 파싱 시 기준 카탈로그를 지정하지 않아<br/>누락 상품 대조 작업이 생략되었습니다.</p>
                                    </div>
                                ) : (
                                <div className="bg-white border border-slate-200 rounded-xl shadow-sm h-full flex flex-col overflow-hidden fade-in relative">
                                    {hasPendingMappings && (
                                        <div className="bg-amber-50 border-b border-amber-200 p-3.5 flex items-center gap-3 text-amber-800 text-[13px] font-bold shrink-0 shadow-inner">
                                            <i className="fas fa-exclamation-triangle text-amber-500 text-lg"></i>
                                            <div className="flex flex-col">
                                                <span>주의! 아직 처리하지 않은 [유사] 또는 [불일치] 항목이 <span className="text-rose-600 font-black px-1">{combinedSimilarRows.length + unmatchedRows.length}건</span> 남아있습니다.</span>
                                                <span className="text-[11px] font-normal opacity-80 mt-0.5">이 항목들이 단순히 오타로 인해 매칭 안된 일 수 있으므로, 수동 연결을 먼저 끝마치신 후에 여기서 누락(단종) 처리를 진행해야 안전합니다.</span>
                                            </div>
                                        </div>
                                    )}
                                    <div className="bg-slate-50 p-4 border-b border-slate-200 flex flex-col gap-2 shrink-0">
                                        <div className="flex items-center gap-2 text-slate-700 text-[13px] font-bold"><i className="fas fa-info-circle text-indigo-500"></i>마스터 DB에는 <span className="bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded">'{currentTag}'</span> 카탈로그에 등록되어 있지만, 이번 파싱 텍스트에는 없는 상품들입니다. (단종 의심)</div>
                                        <div className="text-[11px] text-slate-500">목록에서 체크 후 상단의 [제외] 버튼을 누르면 단가를 훼손하지 않고 해당 카탈로그에서만 조용히 제외합니다.</div>
                                    </div>
                                    <div className="flex-1 overflow-auto custom-scrollbar" onScroll={handleScroll}>
                                        <table className="w-full text-left text-[12px] whitespace-nowrap relative z-0">
                                            <thead className="bg-white sticky top-0 z-10 border-b border-slate-200 text-slate-600 shadow-sm">
                                                <tr>
                                                    <th className="py-2.5 px-4 w-12 text-center">
                                                        <input type="checkbox" className="rounded cursor-pointer" checked={missingRows.length > 0 && selectedMissingCodes.size === missingRows.length} onChange={(e) => {
                                                            const isChecked = e.target.checked;
                                                            setSelectedMissingCodes(prev => {
                                                                if (isChecked) return new Set(missingRows.map(r=>r.코드));
                                                                else return new Set();
                                                            });
                                                        }} />
                                                    </th>
                                                    <th className="py-2.5 px-3">상품코드</th>
                                                    <th className="py-2.5 px-3">마스터 품목명 (규격)</th>
                                                    <th className="py-2.5 px-3 text-right">기존 입고가</th>
                                                    <th className="py-2.5 px-3">소속 카탈로그</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {missingRows.length === 0 ? <tr><td colSpan="5" className="p-10 text-center text-slate-400 font-bold">누락된 항목이 없습니다. 완벽합니다!</td></tr> : (
                                                    <>
                                                        {topPadding > 0 && <tr style={{ height: `${topPadding}px` }}><td colSpan="5"></td></tr>}
                                                        {virtualRows.map(mItem => {
                                                            const isSel = selectedMissingCodes.has(mItem.코드);
                                                            return (
                                                                <tr key={`miss-${mItem.코드}`} onClick={() => {
                                                                    setSelectedMissingCodes(prev => {
                                                                        const next = new Set(prev);
                                                                        if(next.has(mItem.코드)) next.delete(mItem.코드); else next.add(mItem.코드);
                                                                        return next;
                                                                    });
                                                                }} className={`cursor-pointer transition-colors h-[40px] ${isSel ? 'bg-rose-50/50' : 'hover:bg-slate-50'}`}>
                                                                    <td className="py-1.5 px-4 text-center">
                                                                        <input type="checkbox" className="rounded text-rose-500 focus:ring-rose-500 pointer-events-none" checked={isSel} readOnly />
                                                                    </td>
                                                                    <td className="py-1.5 px-3 font-mono text-[11px] text-slate-500">{mItem.코드}</td>
                                                                    <td className="py-1.5 px-3"><span className="font-bold text-slate-800">{mItem.품목명}</span> <span className="text-[11px] text-slate-400">({mItem.규격})</span></td>
                                                                    <td className="py-1.5 px-3 text-right text-slate-500">{mItem.입고가 ? Number(mItem.입고가).toLocaleString() : '-'}</td>
                                                                    <td className="py-1.5 px-3 text-[11px] text-indigo-500 font-bold max-w-[200px] truncate">{mItem['카탈로그']}</td>
                                                                </tr>
                                                            )
                                                        })}
                                                        {bottomPadding > 0 && <tr style={{ height: `${bottomPadding}px` }}><td colSpan="5"></td></tr>}
                                                    </>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                )
                            ) : (
                                <div className="flex h-full w-full gap-4 fade-in">
                                    <div className="w-1/2 bg-white border border-slate-200 rounded-xl shadow-sm flex flex-col overflow-hidden relative">
                                        <div className="bg-[#f8fafc] px-4 py-3 border-b border-slate-200 flex items-center justify-between shrink-0">
                                            <div className="flex items-center gap-2"><i className="fas fa-search text-slate-400"></i><span className="text-[13px] font-black text-slate-700">마스터 수동 검색 (전체 DB)</span></div>
                                            <div className="relative">
                                                <input type="text" placeholder="검색어 입력..." value={globalSearch} onChange={e=>setGlobalSearch(e.target.value)} className="w-[200px] border border-slate-300 rounded-lg px-3 py-1.5 text-[12px] outline-none focus:border-indigo-500" />
                                                <i className="fas fa-search absolute right-2.5 top-2 text-slate-400 text-[12px] pointer-events-none"></i>
                                            </div>
                                        </div>
                                        
                                        {targetId && (
                                            <div className="bg-indigo-50/50 px-4 py-3 border-b border-indigo-100 flex items-center justify-between shrink-0">
                                                <div className="text-[11px] text-indigo-800 font-bold">
                                                    <i className="fas fa-info-circle mr-1.5 text-indigo-500"></i>
                                                    마스터에 없는 신규 상품인가요?
                                                </div>
                                                <button onClick={() => actions.openErpModal()} className="px-3 py-1.5 bg-white border border-indigo-200 text-indigo-600 hover:bg-indigo-600 hover:text-white rounded text-[11px] font-bold transition-colors shadow-sm">
                                                    <i className="fas fa-plus mr-1"></i> ERP 코드로 직접 등록
                                                </button>
                                            </div>
                                        )}

                                        <div className="flex-1 overflow-y-auto custom-scrollbar bg-slate-50/30">
                                            {!targetId && !globalSearch ? (
                                                <div className="h-full flex flex-col items-center justify-center text-slate-400 p-10 text-center"><i className="fas fa-hand-point-right text-4xl mb-4 text-slate-300"></i><p className="text-[13px] font-bold text-slate-500 mb-1">우측에서 매핑할 <span className="text-indigo-500">파싱 항목</span>을 먼저 선택하세요.</p></div>
                                            ) : masterSearchResults.length === 0 ? (
                                                <div className="h-full flex flex-col items-center justify-center text-slate-400 p-10 text-center"><i className="fas fa-search text-4xl mb-4 text-slate-300"></i><p className="text-[13px] font-bold text-slate-500 mb-1">검색 결과가 없습니다.</p></div>
                                            ) : (
                                                <table className="w-full text-left text-[12px] whitespace-nowrap">
                                                    <thead className="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm"><tr><th className="py-2.5 px-3">상품정보 (코드/품명/규격)</th><th className="py-2.5 px-3 text-right w-20">입고가</th><th className="py-2.5 px-3 text-center w-32">동작/작업</th></tr></thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {masterSearchResults.map(m => {
                                                            const hasTag = currentTag && (m['카탈로그'] || '').split(',').map(s=>s.trim()).includes(currentTag);
                                                            return (
                                                                <tr key={m.코드} className="hover:bg-indigo-50/50 group transition-colors">
                                                                    <td className="py-2 px-3"><div className="flex flex-col min-w-0 w-full overflow-hidden"><span className="text-[10px] font-mono text-slate-400">{m.코드}</span><div className="flex items-center gap-1.5 mt-0.5"><span className="text-[12px] font-extrabold text-slate-800 truncate">{m.품목명}</span>{m.규격 && <span className="text-[11px] text-slate-500 shrink-0">({m.규격})</span>}</div></div></td>
                                                                    <td className="py-2 px-3 text-right font-bold text-slate-600">{m.입고가 ? Number(m.입고가).toLocaleString() : '-'}</td>
                                                                    <td className="py-2 px-3 text-center flex gap-1 justify-center items-center h-full">
                                                                        <button onClick={() => actions.handleConfirmMapping(m.코드)} className="px-2 py-1.5 rounded-lg text-[11px] font-bold shadow-sm bg-indigo-600 text-white hover:bg-indigo-700 transition-colors flex-1" title="우측 항목과 연결하여 카탈로그에 추가합니다."><i className="fas fa-link"></i> 연결</button>
                                                                        {hasTag && (
                                                                            <button onClick={() => actions.handleRemoveTagDirect(m.코드)} className="px-2 py-1.5 rounded-lg text-[11px] font-bold shadow-sm bg-rose-100 text-rose-600 hover:bg-rose-200 transition-colors" title="이 상품을 현재 카탈로그에서 즉각 단종(제외)시킵니다."><i className="fas fa-eraser"></i> 단종</button>
                                                                        )}
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            )}
                                        </div>
                                    </div>
                                    
                                    <div className="w-1/2 bg-white border border-slate-200 rounded-xl shadow-sm flex flex-col overflow-hidden">
                                        <div className="bg-[#f8fafc] px-4 py-3 border-b border-slate-200 flex items-center justify-between shrink-0">
                                            <div className="flex items-center gap-2"><i className="fas fa-list text-slate-400"></i><span className="text-[13px] font-black text-slate-700">파싱된 외부 데이터 (대기중)</span></div>
                                            <span className="text-[11px] font-bold text-slate-500 bg-white px-2 py-0.5 rounded border border-slate-200">총 {displayUnmatchedRows.length}건</span>
                                        </div>
                                        <div className="flex-1 overflow-y-auto custom-scrollbar" onScroll={handleScroll}>
                                            <table className="w-full text-left text-[12px] whitespace-nowrap relative z-0">
                                                <thead className="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm"><tr><th className="py-2.5 px-3 text-center w-10">선택</th><th className="py-2.5 px-2 text-center w-14">상태</th><th className="py-2.5 px-3">파싱 품명 및 규격</th><th className="py-2.5 px-3 text-right w-16">입고가</th><th className="py-2.5 px-2 text-center w-10">무시</th></tr></thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {displayUnmatchedRows.length === 0 ? <tr><td colSpan="5" className="p-10 text-center text-slate-400 font-bold">대기중인 데이터가 없습니다.</td></tr> : (
                                                        <>
                                                            {topPadding > 0 && <tr style={{ height: `${topPadding}px` }}><td colSpan="5"></td></tr>}
                                                            {virtualRows.map(row => {
                                                                const isTarget = targetId === row._id;
                                                                
                                                                // 🌟 검색 키워드 자동 주입 시 불필요한 기호 제거
                                                                const handleRowClick = () => {
                                                                    setTargetId(row._id);
                                                                    const cleanSearchName = row['품목명'].replace(/[()[\]{},./|]/g, ' ').replace(/\s+/g, ' ').trim();
                                                                    
                                                                    // 만약 AI가 50% 이상 유사한 항목을 찾아뒀다면, 그 항목의 이름으로 검색창을 채워줍니다!
                                                                    if (row._matchStatus.includes('유사발견') && row.suggested) {
                                                                        const suggestedItem = masterProducts[row.suggested];
                                                                        if (suggestedItem) {
                                                                            setGlobalSearch(suggestedItem.품목명);
                                                                            return;
                                                                        }
                                                                    }
                                                                    setGlobalSearch(cleanSearchName);
                                                                };
                                                                
                                                                return (
                                                                    <tr key={row._id} onClick={handleRowClick} className={`cursor-pointer transition-colors h-[40px] border-l-4 ${isTarget ? 'bg-indigo-50/50 border-indigo-500' : 'hover:bg-slate-50 border-transparent'}`}>
                                                                        <td className="py-1.5 px-3 text-center"><div className={`w-4 h-4 rounded-full border-2 flex items-center justify-center mx-auto ${isTarget ? 'border-indigo-500 bg-white' : 'border-slate-300'}`}>{isTarget && <div className="w-2 h-2 rounded-full bg-indigo-500"></div>}</div></td>
                                                                        <td className="py-1.5 px-2 text-center">
                                                                            {row._matchStatus.includes('중복품목') ? (
                                                                                <span className="bg-amber-200 text-amber-800 px-1.5 py-0.5 rounded text-[10px] font-black" title="ERP에 이름이 똑같은 상품이 여러 개 존재합니다. 수동으로 올바른 코드를 연결해 주세요.">선택필요</span>
                                                                            ) : (
                                                                                <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold w-max block mx-auto ${activeTab === 'similar' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'}`}>{row._matchStatus.substring(0, 2)}</span>
                                                                            )}
                                                                        </td>
                                                                        <td className="py-1.5 px-3">
                                                                            <div className="flex flex-col">
                                                                                <span className={`text-[12px] font-extrabold truncate ${isTarget ? 'text-indigo-900' : 'text-slate-800'}`}>
                                                                                    {row['품목명']}
                                                                                </span>
                                                                                <span className="text-[11px] text-slate-500 mt-0.5 truncate">{row['규격']} {row['단위'] ? `| ${row['단위']}` : ''} {row['간단설명'] ? `| ${row['간단설명']}` : ''}</span>
                                                                                {/* 🌟 추천 항목 노출 */}
                                                                                {row._matchStatus.includes('유사발견') && row.suggested && masterProducts[row.suggested] && (
                                                                                    <span className="text-[10px] font-bold text-amber-600 mt-1 bg-amber-50 w-max px-1.5 py-0.5 rounded">
                                                                                        💡 AI 추천: {masterProducts[row.suggested].품목명}
                                                                                    </span>
                                                                                )}
                                                                            </div>
                                                                        </td>
                                                                        <td className={`py-1.5 px-3 text-right font-bold ${isTarget ? 'text-indigo-600' : 'text-slate-600'}`}>{row['입고가'] || '-'}</td>
                                                                        <td className="py-1.5 px-2 text-center">
                                                                            <button onClick={(e) => { e.stopPropagation(); actions.handleIgnoreParsedItem(row._id); }} className="text-slate-400 hover:text-rose-500 hover:bg-rose-50 px-2 py-1.5 rounded transition-colors" title="이 항목을 매핑하지 않고 휴지통에 버립니다."><i className="fas fa-trash-alt"></i></button>
                                                                        </td>
                                                                    </tr>
                                                                )
                                                            })}
                                                            {bottomPadding > 0 && <tr style={{ height: `${bottomPadding}px` }}><td colSpan="5"></td></tr>}
                                                        </>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    {showInputModal && <SmartParserInputModal onClose={() => setShowInputModal(false)} executeParser={actions.executeParser} showToast={appState.showToast} availableTags={availableTags} />}
                    {showReviewModal && <ParserReviewModal onClose={() => setShowReviewModal(false)} onConfirm={actions.handleApplyMatched} state={appState} actions={actions} />}
                    {showErpModal && <ErpCodeInputModal onClose={actions.handleCancelErpInput} onSubmit={actions.handleCreateNewMasterItem} targetItem={parserBuffer.find(r => r._id === targetId)} />}
                    <IframeSettingsModal isOpen={appState.showSettingsModal} onClose={() => appState.setShowSettingsModal(false)} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><ParserApp /></ErrorBoundary>);
    </script>
</body>
</html>
