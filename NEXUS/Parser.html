<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>NEXUS - Smart Parser [v1.4]</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; -webkit-user-select: none; user-select: none; background-color: #f1f5f9; margin: 0; overflow: hidden; }
        input, textarea, select { user-select: auto; }
        ::-webkit-scrollbar { width: 8px; height: 8px; } 
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.2s ease-out; } 
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .slide-in-right { animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef, useCallback, Fragment } = React;

        // ==========================================
        // 🧩 1. 코어 전역 상수 및 DB 래퍼
        // ==========================================
        const STORAGE_KEYS = {
            MASTER_DB: 'merchMaster_v870', CLOUD_URL: 'skuSyncCloudUrl_v6', SYNC_TRIGGER: 'merchMaster_sync_trigger',
            HISTORY_DB: 'merchHistory_v870', UNSYNCED_MASTER: 'merchUnsyncedMaster_v1', UNSYNCED_HISTORY: 'merchUnsyncedHistory_v1',
            UNSYNCED_DICT: 'merchUnsyncedDict_v1',
        };

        const generateUUID = () => {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8); return v.toString(16);
            });
        };

        const parseNum = (v) => (!v ? 0 : Number(String(v).replace(/,/g, '').replace(/[^\d.-]/g, '')) || 0);

        let idbInstance = null;
        const initIDB = () => new Promise((resolve, reject) => {
            if (idbInstance) return resolve(idbInstance);
            const request = indexedDB.open('MerchOpsDB', 1);
            request.onupgradeneeded = (e) => { if (!e.target.result.objectStoreNames.contains('store')) e.target.result.createObjectStore('store'); };
            request.onsuccess = () => { idbInstance = request.result; resolve(idbInstance); };
            request.onerror = () => reject(request.error);
        });

        const getIDB = async (key) => {
            const db = await initIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('store', 'readonly');
                const req = tx.objectStore('store').get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(tx.error);
            });
        };

        const setIDB = async (key, val) => {
            const db = await initIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('store', 'readwrite');
                tx.objectStore('store').put(val, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        };

        // ==========================================
        // 🧩 2. 핵심 알고리즘 (ONEAPP 원본 복구)
        // ==========================================
        const normalizeText = (text) => text ? String(text).replace(/\s+/g, '').toLowerCase() : '';
        
        const tokenize = (str) => str ? String(str).replace(/[^\w가-힣]/g, ' ').split(/\s+/).filter(Boolean) : [];
        
        const extractSpec = (str) => {
            if (!str) return '';
            const match = String(str).toLowerCase().match(/\d+(?:\.\d+)?(?:kg|g|ml|l|ea|박스|개|포|단|박|캔|병|봉|팩|입|t|입수)/g);
            return match ? match.join('') : '';
        };

        const calculatePricesEngine = (baseInPrice, mItem = {}, currentFinalData = {}, marginRules = [], forceRecalc = false) => {
            if (!baseInPrice || baseInPrice <= 0) return { ...currentFinalData, '입고가': 0, '시중가': 0, '출고가': 0, '1입고': 0, '1출고': 0 };

            const outsrc = parseNum(currentFinalData?.['외주비'] ?? mItem?.['외주비']);
            const labor = parseNum(currentFinalData?.['노무비'] ?? mItem?.['노무비']);
            const totalCost = baseInPrice + outsrc + labor;

            const whCode = String(currentFinalData?.['창고'] ?? mItem?.['창고'] ?? '').trim();
            const unitStr = String(currentFinalData?.['단위'] ?? mItem?.['단위'] ?? '').trim().toLowerCase();
            
            const matchWh = (ruleWh, targetWh) => ruleWh === '*' || ruleWh.split(/[,./|\s]+/).map(s => s.trim()).filter(Boolean).some(s => s === targetWh || (targetWh !== '' && !isNaN(s) && !isNaN(targetWh) && Number(s) === Number(targetWh)));
            const matchUnit = (ruleUnit, targetUnit) => ruleUnit === '*' || ruleUnit.toLowerCase().split(/[,./|\s]+/).map(s => s.trim()).filter(Boolean).some(s => targetUnit === s || targetUnit.includes(s));

            let bestRule = { rate: 10, type: 'divide' }, bestScore = -1;
            marginRules.forEach(r => {
                if (matchWh(r.whCode, whCode) && matchUnit(r.unit, unitStr)) {
                    let score = 0; if (r.whCode !== '*') score += 2; if (r.unit !== '*') score += 1;
                    if (score > bestScore) { bestScore = score; bestRule = r; }
                }
            });

            let calcOutPrice = totalCost;
            if (bestRule.type === 'divide') {
                const safeRate = Math.min(bestRule.rate, 99.99); calcOutPrice = totalCost / (1 - (safeRate / 100));
            } else calcOutPrice = totalCost * (1 + (bestRule.rate / 100));
            calcOutPrice = Math.round(calcOutPrice / 100) * 100;
            if (!isFinite(calcOutPrice) || isNaN(calcOutPrice)) calcOutPrice = 0;

            let newFinalData = { ...currentFinalData, '입고가': baseInPrice, '시중가': calcOutPrice };
            const providedOutPrice = parseNum(currentFinalData?.['출고가']), mIn = parseNum(mItem?.['입고가']), mOut = parseNum(mItem?.['출고가']);

            if (providedOutPrice > 0 && !forceRecalc) newFinalData['출고가'] = providedOutPrice;
            else if (baseInPrice === mIn && mOut > 0 && !forceRecalc) newFinalData['출고가'] = mOut;
            else newFinalData['출고가'] = calcOutPrice;

            const div1 = parseNum(currentFinalData?.['1종연산'] ?? mItem?.['1종연산']), extraCost = parseNum(currentFinalData?.['경비'] ?? mItem?.['경비']); 
            if (div1 > 0) {
                newFinalData['1입고'] = Math.round(((baseInPrice + outsrc) / div1) / 100) * 100;
                let calc1Out = Math.round((newFinalData['출고가'] / div1) + extraCost);
                newFinalData['1출고'] = (!isFinite(calc1Out) || isNaN(calc1Out)) ? 0 : Math.round(calc1Out / 100) * 100; 
            }
            return newFinalData;
        };

        const parseTextSemantically = (rawText) => {
            let cleanText = rawText.replace(/[\u00A0\u200B\u200C\u200D\uFEFF]/g, ' ');
            let lines = cleanText.split('\n').map(l => l.trim()).filter(l => l !== '');
            const results = []; let currentItem = {};
            
            const pushItem = () => {
                if (currentItem.품목명) {
                    if (currentItem.입고가) currentItem.입고가 = String(currentItem.입고가).replace(/[^\d]/g, '');
                    results.push({ _id: generateUUID(), _apply: false, ...currentItem });
                }
                currentItem = {};
            };

            lines.forEach(line => {
                if (
                    /^전체\s*상품/i.test(line) || 
                    /상품\s*\(\d+개\)/i.test(line) || 
                    /^체\s*상품/i.test(line) ||
                    /^clock$/i.test(line) || 
                    /^starLine$/i.test(line) || 
                    /마감/.test(line) || 
                    /\d{1,2}월\s*\d{1,2}일/.test(line) || 
                    /\d{1,2}:\d{2}/.test(line) ||
                    /default-thumbnail/i.test(line) || 
                    /상품이미지/.test(line) || 
                    /이미지\s*준비중/i.test(line) ||
                    /마켓보로/.test(line) || 
                    /통신판매업의 중개자/.test(line) || 
                    /당사자가 아닙니다/.test(line) || 
                    /책임을 지지 않습니다/.test(line) || 
                    /데이터가 없습니다/.test(line) || 
                    /- 끝 -/.test(line)
                ) return;

                const priceMatch = line.match(/(?:^|\s|\/|\|)(\d{1,3}(?:,\d{3})*|\d+)\s*원$/);
                let extractedPrice = null;
                if (priceMatch) {
                    extractedPrice = priceMatch[1];
                    line = line.replace(priceMatch[0], '').trim();
                    if (line.endsWith('/')) line = line.slice(0, -1).trim();
                }
                if (extractedPrice) currentItem.입고가 = extractedPrice;
                if (!line) { if (extractedPrice) pushItem(); return; }

                if (!currentItem.품목명) {
                    if (line.includes(' / ')) {
                        const splitParts = line.split(' / ');
                        let namePart = splitParts[0].trim(); 
                        let specPart = splitParts.slice(1).join(' / ').trim();
                        
                        const unitMatch = namePart.match(/(EA|BOX|포|개|박스|봉|캔|병|팩|단|마리)$/i);
                        if (unitMatch) { 
                            currentItem.단위 = unitMatch[0]; 
                            currentItem.품목명 = namePart.slice(0, -unitMatch[0].length).trim(); 
                        } else { 
                            currentItem.품목명 = namePart; 
                        }
                        
                        const specParts = specPart.split('/').map(s => s.trim());
                        currentItem.규격 = specParts[0] || '';
                    } else { 
                        currentItem.품목명 = line; 
                    }
                } else {
                    if (line.includes('/')) {
                        const parts = line.split('/').map(s => s.trim());
                        if (!currentItem.단위) currentItem.단위 = parts[0] || '';
                        if (parts.length > 1 && !currentItem.규격) currentItem.규격 = parts[1] || '';
                        if (parts.length > 2) {
                            const desc = parts.slice(2).join(' / ');
                            currentItem.간단설명 = currentItem.간단설명 ? currentItem.간단설명 + ' | ' + desc : desc;
                        }
                    } else if (/^\d+(?:\.\d+)?(?:kg|g|ml|l|ea|box|박스|개|포|단|박|캔|병|봉|팩|입)/i.test(line) && !currentItem.규격) {
                        currentItem.규격 = line;
                    } else {
                        currentItem.간단설명 = currentItem.간단설명 ? currentItem.간단설명 + ' | ' + line : line;
                    }
                }
                
                if (extractedPrice) pushItem();
            });
            
            if (currentItem.품목명) pushItem();
            return results;
        };

        const runSmartMatch = (extName, extSpec, mProducts, pDict) => {
            const normExtName = normalizeText(extName);
            const normExtSpec = normalizeText(extSpec);
            const extFullText = normalizeText((extName || '') + " " + (extSpec || ''));
            const dictKey = `${normExtName}|${normExtSpec}`;

            if (pDict[dictKey]) return { code: pDict[dictKey], status: '🔵 사전학습일치' };

            let bestMatch = null;
            let bestScore = 0;
            
            const extTokens = tokenize((extName || '') + " " + (extSpec || ''));
            const extSpecNum = extractSpec((extName || '') + " " + (extSpec || ''));

            let perfectMatches = [];

            for (const mCode in mProducts) {
                const m = mProducts[mCode];
                const mBrand = String(m.브랜드 || '').trim();
                const mName = String(m.품목명 || '').trim();
                const mSpec = String(m.규격 || '').trim();

                const mFullWithBrand = normalizeText(mBrand + mName + mSpec);
                const mFullNoBrand = normalizeText(mName + mSpec);
                const mSpecNum = extractSpec(mBrand + " " + mName + " " + mSpec);

                let isSpecMatch = true;
                if (extSpecNum && mSpecNum && extSpecNum !== mSpecNum) {
                    isSpecMatch = false; 
                }

                if ((extFullText === mFullWithBrand || extFullText === mFullNoBrand) && isSpecMatch) {
                    perfectMatches.push(m);
                    continue;
                }

                const mTokens = tokenize(mBrand + " " + mName + " " + mSpec);
                const intersection = extTokens.filter(t => mTokens.includes(t));
                
                let score = intersection.length / Math.max(extTokens.length, mTokens.length);

                if (!isSpecMatch) {
                    score = score * 0.1; 
                }

                if (score >= 0.7) {
                    if (score > bestScore) {
                        bestScore = score;
                        bestMatch = m;
                    }
                }
            }

            if (perfectMatches.length === 1) return { code: perfectMatches[0].코드 || perfectMatches[0].품목코드, status: '🟢 완전일치' };
            if (perfectMatches.length > 1) return { code: '', status: '🟡 중복품목(선택필요)' }; 

            if (bestMatch && bestScore >= 0.7) return { code: '', status: '🟡 유사발견', suggested: bestMatch.코드 || bestMatch.품목코드 };
            
            return { code: '', status: '🔴 불일치' };
        };

        const addTag = (oldTags, newTag) => {
            if (!newTag) return oldTags || '';
            const tags = (oldTags || '').split(',').map(s => s.trim()).filter(Boolean);
            if (!tags.includes(newTag)) tags.push(newTag);
            return tags.join(', ');
        };

        const removeTag = (oldTags, tagToRemove) => {
            if (!tagToRemove) return oldTags || '';
            const tags = (oldTags || '').split(',').map(s => s.trim()).filter(Boolean);
            return tags.filter(t => t !== tagToRemove).join(', ');
        };

        // ==========================================
        // 🧩 3. 공용 UI 컴포넌트
        // ==========================================
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) return (
                    <div className="h-screen w-full flex flex-col items-center justify-center bg-slate-50 p-6 text-center">
                        <i className="fas fa-exclamation-triangle text-rose-500 text-6xl mb-6"></i>
                        <h1 className="text-2xl font-black text-slate-800 mb-2">화면 렌더링 오류 발생</h1>
                        <p className="text-slate-500 mb-6">아래 [초기화] 버튼을 눌러 복구해 주세요.</p>
                        <button onClick={() => { indexedDB.deleteDatabase('MerchOpsDB'); localStorage.removeItem('merchMaster_v870'); window.location.reload(); }} className="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg"><i className="fas fa-redo-alt mr-2"></i> 로컬 데이터 초기화</button>
                    </div>
                );
                return this.props.children;
            }
        }

        const GlobalHeader = ({ activeTab, itemCount, isProcessing, processMsg, onOpenSettings, onPush, onPull, onNavigate }) => {
            const groups = [ { id: 'master', label: '정보 관리', icon: 'database' }, { id: 'ops', label: '운영 관리', icon: 'truck' }, { id: 'admin', label: '인사이트', icon: 'bar-chart-3' } ];
            const groupLabels = { master: "MerchOps", ops: "DataOps", admin: "Insite", common: "Platform" };
            const tabs = [
                { id: 'dashboard', label: '통합 대시보드', icon: "layout-dashboard", path: 'Dashboard.html', group: 'common', isReady: true, shortTag: 'TOTAL BOARD' },
                { id: 'item-info', label: '마스터 DB', icon: "database", path: 'Master.html', group: 'master', isReady: true, shortTag: 'GOLDEN MASTER' },
                { id: 'item-manage', label: '상품 관리', icon: "package-search", path: 'Item_manager.html', group: 'master', isReady: true, shortTag: 'ITEM FORGE' },
                { id: 'pipeline', label: '시세 관리', icon: "file-spreadsheet", path: 'Pipeline.html', group: 'master', isReady: true, shortTag: 'PRICE HUB' },
                { id: 'parser', label: '스마트 파서', icon: "zap", path: 'Parser.html', group: 'master', isReady: true, shortTag: 'AUTO PARSER' },
                { id: 'partner-db', label: '거래처 DB', icon: "book-open", path: 'partner_db.html', group: 'master', isReady: true, shortTag: 'ENTITY REGISTER' },
                { id: 'partners', label: '거래처 관리', icon: "users", path: 'partners.html', group: 'master', isReady: true, shortTag: 'NETWORK CRM' },
                { id: 'inventory', label: '재고 마감', icon: "boxes", path: 'inventory.html', group: 'ops', isReady: true, shortTag: 'STOCK CLOSING' }
            ];

            const currentTab = tabs.find(t => t.id === activeTab);
            const activeGroup = currentTab ? currentTab.group : 'common';
            const [selectedGroup, setSelectedGroup] = useState(activeGroup);
            const activeGroupLabel = groupLabels[selectedGroup] || "Platform";

            return (
                <div className="flex flex-col shrink-0 z-40 relative w-full shadow-sm bg-[#0B1021]">
                    <header className="h-[72px] bg-[#0B1021] text-white flex justify-between px-6 border-b border-slate-800/80 relative z-20">
                        <div className="flex items-center h-full">
                            <div className="flex items-center cursor-pointer group mr-10 h-full" onClick={(e) => {setSelectedGroup('common'); onNavigate(e, 'Dashboard.html');}}>
                                <span className="font-black text-[24px] tracking-wider text-slate-100 mr-4 group-hover:text-indigo-400 transition-colors">NEXUS</span>
                                <div className="flex flex-col border-l-2 border-slate-700/70 pl-4 py-0.5">
                                    <div className="flex items-center">
                                        <span className="font-black text-[16px] leading-none text-indigo-400 tracking-widest uppercase mt-0.5">{activeGroupLabel}</span>
                                        <span className="ml-2.5 bg-indigo-500/10 border border-indigo-400/30 text-indigo-400 px-[5px] py-[2px] rounded text-[9px] font-black tracking-wider shadow-sm leading-none">v1.4</span>
                                    </div>
                                    <span className="text-[10px] text-slate-400/90 font-medium tracking-[0.15em] mt-1 uppercase">{currentTab ? currentTab.shortTag : 'WORKSPACE'}</span>
                                </div>
                            </div>
                            <div className="flex items-end h-full gap-8">
                                {groups.map(g => (
                                    <button key={g.id} onClick={() => setSelectedGroup(prev => prev === g.id ? 'common' : g.id)} className={`pb-[16px] text-[14px] font-bold transition-colors flex items-center gap-1.5 ${selectedGroup === g.id ? 'text-slate-100 border-b-[3px] border-indigo-500 -mb-[2px]' : 'text-slate-500 hover:text-slate-300'}`}>
                                        <i className={`fas fa-${g.icon === 'database' ? 'database' : g.icon === 'truck' ? 'truck' : 'chart-bar'}`} style={{ fontSize: 15 }} /> {g.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex items-center gap-4 h-full">
                            <div className="flex items-center bg-[#151B2B] rounded-lg border border-slate-700/50 h-9 px-3 shadow-inner gap-3">
                                <div className="flex items-center justify-center" title={isProcessing ? processMsg : "시스템 정상 대기중"}>
                                    {isProcessing ? ( <i className="fas fa-circle-notch fa-spin text-amber-500 text-[12px]"></i> ) : (
                                        <div className="relative flex h-2 w-2"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></div>
                                    )}
                                </div>
                                <div className="w-px h-3.5 bg-slate-700"></div>
                                <div className="flex items-center gap-1.5 text-slate-300 cursor-help" title="마스터 DB 데이터 수">
                                    <i className="fas fa-database text-slate-500 text-[10px]"></i>
                                    <span className="text-[11px] font-mono font-bold tracking-tight">{itemCount ? itemCount.toLocaleString() : 0}</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={onPull} className="w-10 h-10 rounded-xl bg-[#151B2B] hover:bg-[#1E293B] flex items-center justify-center border border-slate-700 transition-colors text-indigo-400 shadow-sm" title="데이터 불러오기(Pull)"><i className="fas fa-cloud-download-alt text-[18px]"></i></button>
                                <button onClick={onPush} className="w-10 h-10 rounded-xl bg-[#151B2B] hover:bg-[#1E293B] flex items-center justify-center border border-slate-700 transition-colors text-indigo-400 shadow-sm" title="데이터 백업하기(Push)"><i className="fas fa-cloud-upload-alt text-[18px]"></i></button>
                                <div className="w-px h-6 bg-slate-700 mx-1"></div>
                                <button onClick={onOpenSettings} className="w-10 h-10 rounded-xl bg-[#151B2B] hover:bg-[#1E293B] flex items-center justify-center border border-slate-700 transition-colors text-slate-400 hover:text-white shadow-sm" title="통합 환경설정"><i className="fas fa-cogs text-[18px]"></i></button>
                            </div>
                        </div>
                    </header>

                    {selectedGroup && (
                        <div className="bg-[#0B1021] px-6 pt-3 flex items-end gap-1 overflow-x-auto custom-scrollbar border-b border-slate-200 fade-in">
                            {tabs.filter(t => t.group === selectedGroup).map(tab => {
                                const isActive = activeTab === tab.id;
                                const isPlaceholder = !tab.isReady;
                                return (
                                    <a key={tab.id} href={tab.path} onClick={(e) => onNavigate(e, tab.path, tab.isReady)}
                                        className={`flex items-center gap-2 px-6 py-3 text-[14px] font-bold rounded-t-xl transition-all whitespace-nowrap border-x border-t-[3px] ${isActive ? 'bg-white text-indigo-600 border-t-indigo-500 border-x-slate-200 relative z-10 shadow-[0_-4px_10px_rgba(0,0,0,0.1)]' : isPlaceholder ? 'bg-[#151B2B] text-slate-500 border-t-transparent border-x-transparent cursor-not-allowed opacity-50 pb-2.5' : 'bg-[#151B2B] text-slate-400 border-t-transparent border-x-transparent hover:text-slate-200 pb-2.5'}`}
                                        style={{ marginBottom: isActive ? '-1px' : '0', paddingBottom: isActive ? '13px' : '10px' }}
                                    >
                                        <i className={`fas fa-${tab.icon === 'package-search' ? 'box-open' : tab.icon === 'file-spreadsheet' ? 'table' : tab.icon === 'zap' ? 'bolt' : tab.icon === 'book-open' ? 'address-book' : tab.icon === 'users' ? 'users' : tab.icon === 'layout-dashboard' ? 'th-large' : 'database'} ${isActive ? 'text-indigo-600' : 'opacity-70'}`} style={{ fontSize: 16 }}></i> {tab.label}
                                    </a>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const IframeSettingsModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[500] flex bg-slate-900/60 backdrop-blur-sm fade-in cursor-pointer" onClick={onClose}>
                    <div className="w-full max-w-[1400px] h-full bg-white shadow-[-10px_0_40px_rgba(0,0,0,0.3)] flex flex-col slide-in-right border-l border-slate-300 relative overflow-hidden ml-auto cursor-default" onClick={(e) => e.stopPropagation()}>
                        <div className="bg-[#0f172a] px-6 py-4 flex justify-between items-center text-white shrink-0 border-b border-slate-700 shadow-md relative z-10">
                            <div className="flex items-center gap-3"><i className="fas fa-cogs text-indigo-400 text-[20px]"></i><h2 className="font-black text-[17px] tracking-wide">통합 환경설정 센터</h2></div>
                            <button onClick={onClose} className="text-slate-300 hover:text-white bg-slate-800 hover:bg-rose-500 w-8 h-8 rounded-lg flex items-center justify-center border border-slate-700 hover:border-rose-400"><i className="fas fa-times text-[18px]"></i></button>
                        </div>
                        <div className="flex-1 w-full bg-slate-100 relative">
                            <iframe src="settings.html?mode=iframe" className="absolute inset-0 w-full h-full border-0 bg-white" title="Settings"></iframe>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 🧩 4. 훅 및 상태 관리
        // ==========================================
        const useParserApp = () => {
            const [masterProducts, setMasterProducts] = useState({});
            const [parserDict, setParserDict] = useState(() => { try { return JSON.parse(localStorage.getItem('parserDict_v870')) || {}; } catch(e){ return {}; }});
            const [cloudUrl, setCloudUrl] = useState(() => localStorage.getItem(STORAGE_KEYS.CLOUD_URL) || '');
            
            const defaultRules = [
                { id: generateUUID(), whCode: '01', unit: 'box, 박스', rate: 10, type: 'divide' },
                { id: generateUUID(), whCode: '01', unit: 'ea, 개, 낱개', rate: 15, type: 'divide' },
                { id: generateUUID(), whCode: '03, 05', unit: 'box, 박스', rate: 15, type: 'divide' },
                { id: generateUUID(), whCode: '03, 05', unit: 'ea, 개, 낱개', rate: 20, type: 'divide' },
                { id: generateUUID(), whCode: '*', unit: 'box, 박스', rate: 10, type: 'divide' },
                { id: generateUUID(), whCode: '*', unit: 'ea, 개, 낱개', rate: 15, type: 'divide' },
                { id: 'default', whCode: '*', unit: '*', rate: 20, type: 'divide' }
            ];

            const [marginRules, setMarginRules] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('merchMarginRules_v878'));
                    if (saved && saved.length > 2) return saved;
                } catch(e) {}
                return defaultRules;
            });

            useEffect(() => {
                getIDB(STORAGE_KEYS.MASTER_DB).then(data => { if (data) setMasterProducts(data); }).catch(console.error);
            }, []);

            useEffect(() => {
                const handleStorageChange = (e) => {
                    if (e.key === STORAGE_KEYS.SYNC_TRIGGER) {
                        getIDB(STORAGE_KEYS.MASTER_DB).then(data => { if (data) setMasterProducts(data); }).catch(console.error);
                    }
                };
                window.addEventListener('storage', handleStorageChange);
                return () => window.removeEventListener('storage', handleStorageChange);
            }, []);

            const saveMaster = async (data) => {
                setMasterProducts(data);
                try {
                    await setIDB(STORAGE_KEYS.MASTER_DB, data);
                    localStorage.setItem(STORAGE_KEYS.SYNC_TRIGGER, Date.now().toString());
                } catch(e) { console.error("IndexedDB 저장 실패", e); }
            };

            const saveDict = async (data, newEntries = {}) => {
                setParserDict(data);
                localStorage.setItem('parserDict_v870', JSON.stringify(data));
                
                if (Object.keys(newEntries).length > 0) {
                    try {
                        const unsyncedDict = await getIDB(STORAGE_KEYS.UNSYNCED_DICT) || {};
                        Object.assign(unsyncedDict, newEntries);
                        await setIDB(STORAGE_KEYS.UNSYNCED_DICT, unsyncedDict);
                    } catch(e) { console.error("Dict 동기화 저장 실패", e); }
                }
            };

            const [parserBuffer, setParserBuffer] = useState([]);
            const [currentTag, setCurrentTag] = useState(''); 
            const [activeTab, setActiveTab] = useState('matched'); 
            const [showInputModal, setShowInputModal] = useState(true); 
            const [showReviewModal, setShowReviewModal] = useState(false);
            const [showErpModal, setShowErpModal] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);

            const [toastMsg, setToastMsg] = useState('');
            const [isProcessing, setIsProcessing] = useState(false);
            const [processMsg, setProcessMsg] = useState('');
            
            const [globalSearch, setGlobalSearch] = useState('');
            const [targetId, setTargetId] = useState(null); 
            const [selectedMissingCodes, setSelectedMissingCodes] = useState(new Set());
            const [processedCodes, setProcessedCodes] = useState(new Set());

            const showToast = useCallback((msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3000); }, []);

            return {
                masterProducts, saveMaster, parserDict, saveDict, marginRules, cloudUrl,
                parserBuffer, setParserBuffer, currentTag, setCurrentTag,
                activeTab, setActiveTab, showInputModal, setShowInputModal,
                showReviewModal, setShowReviewModal,
                showErpModal, setShowErpModal, showSettingsModal, setShowSettingsModal,
                toastMsg, showToast, isProcessing, setIsProcessing, processMsg, setProcessMsg,
                globalSearch, setGlobalSearch, targetId, setTargetId,
                selectedMissingCodes, setSelectedMissingCodes, processedCodes, setProcessedCodes
            };
        };

        const useParserActions = (appState) => {
            const { 
                masterProducts, saveMaster, parserDict, saveDict, marginRules, cloudUrl,
                parserBuffer, setParserBuffer, currentTag, setCurrentTag,
                setActiveTab, setShowInputModal, showToast, setIsProcessing, setProcessMsg,
                setGlobalSearch, targetId, setTargetId, selectedMissingCodes, setSelectedMissingCodes,
                processedCodes, setProcessedCodes, setShowErpModal
            } = appState;

            const executeParser = useCallback((rawText, tag, forceManual = false) => {
                setShowInputModal(false); 
                setIsProcessing(true); 
                setProcessMsg("AI 분석 및 스마트 매칭 중...");
                setCurrentTag(tag);
                setProcessedCodes(new Set());

                setTimeout(() => {
                    try {
                        const parsedData = parseTextSemantically(rawText);
                        const results = []; 
                        
                        parsedData.forEach(rowData => {
                            const extName = rowData['품목명'] || '';
                            const extSpec = rowData['규격'] || '';
                            
                            let matchResult;
                            if (forceManual) matchResult = { code: '', status: '🔴 불일치' };
                            else matchResult = runSmartMatch(extName, extSpec, masterProducts, parserDict);
                            
                            rowData._matchCode = matchResult.code; 
                            rowData._matchStatus = matchResult.status;
                            if(matchResult.code) { 
                                rowData.코드 = matchResult.code; 
                                rowData._apply = true; // 🌟 자동 매칭된 항목 무조건 체크 완료
                            }
                            
                            rowData.finalData = {};
                            const pInNum = rowData['입고가'] ? parseNum(rowData['입고가']) : 0;
                            
                            if (pInNum > 0 && matchResult.code) {
                                const mItem = masterProducts[matchResult.code] || {};
                                rowData.finalData = calculatePricesEngine(pInNum, mItem, {}, marginRules, true);
                            } else {
                                rowData.finalData['입고가'] = pInNum;
                            }
                            if (matchResult.suggested) rowData.suggested = matchResult.suggested;
                            results.push(rowData);
                        });
                        
                        setParserBuffer(results); 
                        setActiveTab(forceManual ? 'unmatched' : 'matched'); 
                        setTargetId(null); 
                        setGlobalSearch(''); 
                        setSelectedMissingCodes(new Set());

                        showToast(forceManual ? '✅ 수동 매핑 모드로 로드되었습니다.' : '✅ 텍스트 분석 및 매칭이 완료되었습니다.');
                    } catch (error) {
                        console.error(error);
                        showToast("❌ 텍스트 분석 중 오류가 발생했습니다.");
                    } finally {
                        setIsProcessing(false); setProcessMsg(''); 
                    }
                }, 100);
            }, [masterProducts, parserDict, marginRules]);

            const handleApplyMatched = useCallback(async (targetCodes, options, editedPrices) => {
                if (targetCodes.length === 0) {
                    showToast("⚠️ 적용할 항목이 없습니다.");
                    return false;
                }

                setIsProcessing(true); setProcessMsg("데이터베이스 저장 및 이력 기록 중...");

                try {
                    let newMaster = { ...masterProducts };
                    let newDict = { ...parserDict };
                    let newlyProcessed = new Set(processedCodes);
                    let localLogs = [];
                    const nowStr = new Date().toLocaleString('ko-KR');

                    const unsyncedMaster = await getIDB(STORAGE_KEYS.UNSYNCED_MASTER) || {};
                    const unsyncedHist = await getIDB(STORAGE_KEYS.UNSYNCED_HISTORY) || [];
                    let newEntriesForDict = {};

                    targetCodes.forEach(code => {
                        const item = parserBuffer.find(r => r.코드 === code || r._matchCode === code);
                        if (!item) return;

                        newlyProcessed.add(code);
                        const oldItem = newMaster[code] || {};
                        newMaster[code] = { ...(newMaster[code] || { 코드: code }) };
                        
                        const pInNum = editedPrices && editedPrices[code] !== undefined 
                            ? parseNum(editedPrices[code]) 
                            : parseNum(item.finalData?.['입고가'] || item['입고가']);

                        if (pInNum > 0) {
                            const oldP = parseNum(oldItem['입고가']);
                            if (oldP > 0 && oldP !== pInNum) {
                                const logItem = {
                                    id: generateUUID(), timestamp: nowStr, code: code, 
                                    name: oldItem.품목명 || item['품목명'], spec: oldItem.규격 || item['규격'], 
                                    field: '입고가', oldVal: oldP, newVal: pInNum, diff: pInNum - oldP, catalog: currentTag
                                };
                                localLogs.push(logItem);
                                unsyncedHist.push(logItem);
                            }

                            newMaster[code]['입고가'] = pInNum;
                            const recalculated = calculatePricesEngine(pInNum, newMaster[code], item.finalData || {}, marginRules, false);
                            Object.assign(newMaster[code], recalculated);
                        }

                        // 🌟 2번 탭에서 선택된 항목에 한하여 파싱 텍스트로 마스터 품명/규격 덮어쓰기
                        if (options?.selectedOverrides && options.selectedOverrides.has(code)) {
                            if (item['품목명']) newMaster[code]['품목명'] = item['품목명'];
                            if (item['규격']) newMaster[code]['규격'] = item['규격'];
                            if (item['단위']) newMaster[code]['단위'] = item['단위'];
                        }

                        // 카탈로그 저장 옵션
                        let targetCatalog = currentTag;
                        if (options?.catalogOption === 'existing' && options.selectedExistingCatalog) targetCatalog = options.selectedExistingCatalog.trim();
                        else if (options?.catalogOption === 'new' && options.newCatalogName) targetCatalog = options.newCatalogName.trim();
                        
                        if (targetCatalog) {
                            newMaster[code]['카탈로그'] = addTag(newMaster[code]['카탈로그'], targetCatalog);
                        }

                        unsyncedMaster[code] = newMaster[code]; 

                        if (item['품목명']) {
                            const dictKey = MatchEngine.cleanForDict(item['품목명']) + "|" + MatchEngine.cleanForDict(item['규격']);
                            newDict[dictKey] = code;
                            newEntriesForDict[dictKey] = code;
                        }
                    });

                    if (localLogs.length > 0) {
                        let currentHistory = await getIDB(STORAGE_KEYS.HISTORY_DB) || [];
                        const combined = [...localLogs, ...currentHistory].slice(0, 2000);
                        await setIDB(STORAGE_KEYS.HISTORY_DB, combined);
                    }

                    await setIDB(STORAGE_KEYS.UNSYNCED_MASTER, unsyncedMaster);
                    await setIDB(STORAGE_KEYS.UNSYNCED_HISTORY, unsyncedHist);

                    await saveMaster(newMaster); 
                    await saveDict(newDict, newEntriesForDict); 
                    
                    setProcessedCodes(newlyProcessed);
                    const appliedIds = new Set(targetCodes);
                    setParserBuffer(prev => prev.filter(r => !appliedIds.has(r.코드) && !appliedIds.has(r._matchCode)));

                    showToast(`✅ ${targetCodes.length}건 최종 반영 완료! (마스터 갱신 및 AI 학습됨)`);
                    return true;
                } catch (error) {
                    console.error(error);
                    showToast("❌ 데이터베이스 저장 중 오류가 발생했습니다.");
                    return false;
                } finally {
                    setIsProcessing(false); setProcessMsg(''); 
                }
            }, [parserBuffer, masterProducts, parserDict, marginRules, currentTag, processedCodes, saveMaster, saveDict, setProcessedCodes, setParserBuffer, setIsProcessing, setProcessMsg, showToast]);

            const handleConfirmMapping = useCallback(async (masterCode) => { 
                if (!targetId) return showToast("⚠️ 먼저 왼쪽에서 매핑할 타겟 상품을 선택하세요.");
                const row = parserBuffer.find(r => r._id === targetId); if (!row) return;

                try {
                    let mItem = masterProducts[masterCode] || { 코드: masterCode };
                    const pInNum = row.finalData?.['입고가'] ? parseNum(row.finalData['입고가']) : parseNum(row['입고가']);
                    let recalculatedFinal = row.finalData || {};

                    if(pInNum > 0) {
                        recalculatedFinal = calculatePricesEngine(pInNum, mItem, recalculatedFinal, marginRules, false);
                    }
                    
                    const nextBuffer = parserBuffer.map(r => {
                        if (r._id === targetId) {
                            return { ...r, _matchCode: masterCode, _matchStatus: '🟢 수동일치', _apply: true, finalData: recalculatedFinal };
                        }
                        return r;
                    });

                    setParserBuffer(nextBuffer);
                    setTargetId(null); setGlobalSearch(''); 
                    
                    // 🌟 수동 연결 시 탭을 변경하지 않고 원래 작업 탭에 머무름
                    showToast(`✅ 수동 연결 완료! 우측 [반영하기 검토] 대기열로 이동되었습니다.`);
                } catch(error) {
                    console.error(error); showToast("❌ 수동 매핑 처리 중 오류가 발생했습니다.");
                }
            }, [targetId, parserBuffer, masterProducts, marginRules, setParserBuffer, setTargetId, setGlobalSearch, showToast]);

            const handleCancelMapping = useCallback((rowId) => {
                setParserBuffer(prev => prev.map(r => {
                    if (r._id === rowId) return { ...r, _matchCode: '', _matchStatus: '🔴 불일치(취소됨)', _apply: false };
                    return r;
                }));
            }, [setParserBuffer]);

            const handleCreateNewMasterItem = useCallback(async (erpCode) => {
                if (!targetId) return showToast("⚠️ 먼저 추가할 파싱 항목을 선택하세요.");
                const row = parserBuffer.find(r => r._id === targetId);
                if (!row) return;

                if (!erpCode || !erpCode.trim()) return showToast("⚠️ ERP 코드를 입력해주세요.");
                const newCode = erpCode.trim();

                if (masterProducts[newCode]) {
                    return showToast("⚠️ 이미 마스터 DB에 존재하는 코드입니다. '연결(바인딩)' 버튼을 이용해주세요.");
                }

                setIsProcessing(true); setProcessMsg("신규 마스터 품목 등록 중...");

                try {
                    let newMaster = { ...masterProducts };
                    const pInNum = row.finalData?.['입고가'] !== undefined ? parseNum(row.finalData['입고가']) : parseNum(row['입고가']);

                    newMaster[newCode] = {
                        코드: newCode, 품목코드: newCode, 품목명: row['품목명'], 규격: row['규격'] || '',
                        단위: row['단위'] || '', 입고가: pInNum, 카탈로그: currentTag ? currentTag : ''
                    };

                    const recalculatedFinal = calculatePricesEngine(pInNum, newMaster[newCode], row.finalData || {}, marginRules, false);
                    Object.assign(newMaster[newCode], recalculatedFinal);

                    const unsyncedMaster = await getIDB(STORAGE_KEYS.UNSYNCED_MASTER) || {};
                    unsyncedMaster[newCode] = newMaster[newCode];
                    await setIDB(STORAGE_KEYS.UNSYNCED_MASTER, unsyncedMaster);

                    await saveMaster(newMaster);

                    const dictKey = MatchEngine.cleanForDict(row['품목명']) + "|" + MatchEngine.cleanForDict(row['규격']);
                    const newDict = { ...parserDict, [dictKey]: newCode };
                    await saveDict(newDict, { [dictKey]: newCode });

                    const newProcessed = new Set(processedCodes);
                    newProcessed.add(newCode);
                    setProcessedCodes(newProcessed);

                    const nextBuffer = parserBuffer.map(r => {
                        if (r._id === targetId) return { ...r, _matchCode: newCode, _matchStatus: '🟢 신규등록', _apply: true, finalData: recalculatedFinal, 코드: newCode };
                        return r;
                    });
                    
                    setParserBuffer(nextBuffer);
                    setTargetId(null); setGlobalSearch(''); setShowErpModal(false);

                    // 🌟 신규 등록 시 탭을 변경하지 않고 원래 작업 탭에 머무름
                    showToast(`✅ [${newCode}] 신규 마스터 등록 완료! 우측 [반영하기 검토] 대기열로 이동되었습니다.`);
                } catch(error) {
                    console.error(error); showToast("❌ 신규 등록 처리 중 오류가 발생했습니다.");
                } finally {
                    setIsProcessing(false); setProcessMsg('');
                }
            }, [targetId, parserBuffer, masterProducts, currentTag, marginRules, parserDict, processedCodes, saveMaster, saveDict, setProcessedCodes, setParserBuffer, setTargetId, setGlobalSearch, setShowErpModal, setIsProcessing, setProcessMsg, showToast]);

            const handleCancelErpInput = useCallback(() => {
                if (window.confirm("ERP 코드를 입력하지 않으면 이 파싱 항목은 작업 목록에서 영구히 무시(삭제)됩니다. 취소하시겠습니까?")) {
                    if (targetId) {
                        setParserBuffer(prev => prev.filter(r => r._id !== targetId));
                        setTargetId(null);
                        setGlobalSearch('');
                    }
                    setShowErpModal(false);
                }
            }, [targetId, setParserBuffer, setTargetId, setGlobalSearch, setShowErpModal]);

            const handleIgnoreParsedItem = useCallback((id) => {
                setParserBuffer(prev => prev.filter(r => r._id !== id));
                if (targetId === id) { setTargetId(null); setGlobalSearch(''); }
            }, [targetId, setParserBuffer, setTargetId, setGlobalSearch]);

            const handleRemoveMissingTags = useCallback(async () => {
                const codesToProcess = Array.from(selectedMissingCodes);
                if (codesToProcess.length === 0) return showToast("⚠️ 제외할 상품을 선택하세요.");
                if (!currentTag) return showToast("⚠️ 기준 카탈로그가 없습니다.");

                setIsProcessing(true); setProcessMsg("카탈로그 제외 처리 중...");
                
                try {
                    let newMaster = { ...masterProducts };
                    let count = 0;
                    const unsyncedMaster = await getIDB(STORAGE_KEYS.UNSYNCED_MASTER) || {};

                    codesToProcess.forEach(code => {
                        if (newMaster[code]) {
                            newMaster[code]['카탈로그'] = removeTag(newMaster[code]['카탈로그'], currentTag);
                            unsyncedMaster[code] = newMaster[code];
                            count++;
                        }
                    });

                    await setIDB(STORAGE_KEYS.UNSYNCED_MASTER, unsyncedMaster);
                    await saveMaster(newMaster);
                    setSelectedMissingCodes(new Set()); 
                    showToast(`✅ ${count}개 상품을 '${currentTag}' 카탈로그에서 조용히 제외했습니다.`);
                } catch (error) {
                    console.error(error); showToast("❌ 제외 처리 중 오류가 발생했습니다.");
                } finally {
                    setIsProcessing(false); setProcessMsg('');
                }
            }, [selectedMissingCodes, masterProducts, currentTag, saveMaster, setSelectedMissingCodes, setIsProcessing, setProcessMsg, showToast]);

            const handleRemoveTagDirect = useCallback(async (code) => {
                if (!currentTag) return;
                if(!window.confirm(`이 상품을 [${currentTag}] 카탈로그에서 강제로 단종(제외) 처리하시겠습니까?`)) return;
                
                try {
                    let newMaster = { ...masterProducts };
                    if (newMaster[code]) {
                        newMaster[code]['카탈로그'] = removeTag(newMaster[code]['카탈로그'], currentTag);
                        
                        const unsyncedMaster = await getIDB(STORAGE_KEYS.UNSYNCED_MASTER) || {};
                        unsyncedMaster[code] = newMaster[code];
                        await setIDB(STORAGE_KEYS.UNSYNCED_MASTER, unsyncedMaster);

                        await saveMaster(newMaster);
                        showToast(`✅ 선택한 상품을 '${currentTag}' 카탈로그에서 단종 처리했습니다.`);
                    }
                } catch(error) {
                    console.error(error); showToast("❌ 제외 처리 중 오류가 발생했습니다.");
                }
            }, [masterProducts, currentTag, saveMaster, showToast]);

            const handlePush = async () => {
                if (!cloudUrl) return showToast("⚠️ 설정에서 앱스크립트 URL을 입력하세요.");
                const unsyncedMaster = await getIDB(STORAGE_KEYS.UNSYNCED_MASTER) || {};
                const unsyncedHistory = await getIDB(STORAGE_KEYS.UNSYNCED_HISTORY) || [];
                const unsyncedDict = await getIDB(STORAGE_KEYS.UNSYNCED_DICT) || {};
                
                if (Object.keys(unsyncedMaster).length === 0 && unsyncedHistory.length === 0 && Object.keys(unsyncedDict).length === 0) return showToast("⚠️ 클라우드에 새로 반영할 변경사항이 없습니다.");

                setIsProcessing(true); setProcessMsg("클라우드 백업 중...");
                try {
                    const response = await fetch(cloudUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'pushData', masterDelta: unsyncedMaster, historyDelta: unsyncedHistory, dictDelta: unsyncedDict })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        await setIDB(STORAGE_KEYS.UNSYNCED_MASTER, {});
                        await setIDB(STORAGE_KEYS.UNSYNCED_HISTORY, []);
                        await setIDB(STORAGE_KEYS.UNSYNCED_DICT, {});
                        showToast(`✅ 클라우드 동기화 완료 (수정 ${Object.keys(unsyncedMaster).length}건, 매핑 ${Object.keys(unsyncedDict).length}건)`);
                    } else throw new Error(result.message || '서버 응답 오류');
                } catch (err) {
                    console.error(err); showToast("❌ 클라우드 백업 실패: " + err.message);
                } finally { setIsProcessing(false); setProcessMsg(""); }
            };

            const handlePull = async () => {
                if (!cloudUrl) return showToast("⚠️ 설정에서 앱스크립트 URL을 입력하세요.");
                setIsProcessing(true); setProcessMsg("데이터 동기화 중...");
                try {
                    const response = await fetch(`${cloudUrl}?action=pullData`, { method: 'GET' });
                    const result = await response.json();
                    if (result.status === 'success') {
                        if (result.master) {
                            setMasterProducts(result.master);
                            await setIDB(STORAGE_KEYS.MASTER_DB, result.master);
                        }
                        if (result.history) await setIDB(STORAGE_KEYS.HISTORY_DB, result.history);
                        
                        if (result.dictionary) {
                            const localDict = JSON.parse(localStorage.getItem('parserDict_v870')) || {};
                            const mergedDict = { ...localDict, ...result.dictionary };
                            setParserDict(mergedDict);
                            localStorage.setItem('parserDict_v870', JSON.stringify(mergedDict));
                        }

                        localStorage.setItem(STORAGE_KEYS.SYNC_TRIGGER, Date.now().toString());
                        showToast("✅ 클라우드 데이터 수신 완료");
                    } else throw new Error(result.message || '서버 응답 오류');
                } catch (err) {
                    console.error(err); showToast("❌ 데이터 동기화 실패: " + err.message);
                } finally { setIsProcessing(false); setProcessMsg(""); }
            };

            return { 
                executeParser, handleApplyMatched, handleConfirmMapping, handleCancelMapping,

                handleCancelErpInput, handlePush, handlePull, openErpModal: () => setShowErpModal(true)
            };

            useEffect(() => {

                if (String(val) !== String(initialVal)) onUpdate(code, val);
            };

            const handleKeyDown = (e) => {
                if (['ArrowUp', 'ArrowDown', 'Enter'].includes(e.key)) {
                    e.preventDefault();
                    const inputs = Array.from(document.querySelectorAll('.review-price-input:not([disabled])'));
                    const currentIndex = inputs.indexOf(e.target);
                    if (currentIndex === -1) return;

                    let nextIndex = currentIndex;
                    if (e.key === 'ArrowUp') nextIndex = Math.max(0, currentIndex - 1);
                    if (e.key === 'ArrowDown' || e.key === 'Enter') nextIndex = Math.min(inputs.length - 1, currentIndex + 1);

                    if (nextIndex !== currentIndex) {
                        e.target.blur(); 
                        inputs[nextIndex].focus();
                        setTimeout(() => inputs[nextIndex].select(), 0);
                    } else if (e.key === 'Enter') {
                        e.target.blur(); 
                    }
                }
            };

        // 🌟 최적화 및 목적에 맞게 재구성된 모달
        const ParserReviewModal = ({ onClose, onConfirm, state, actions }) => {
            // 🌟 1번 탭을 단가 변동 브리핑(메인)으로 설정
            const [viewMode, setViewMode] = useState('price'); // 'price' | 'mapping'

            const [editedPrices, setEditedPrices] = useState({}); 
            
            const [catalogOption, setCatalogOption] = useState('none'); 
            const [selectedExistingCatalog, setSelectedExistingCatalog] = useState('');
            const [newCatalogName, setNewCatalogName] = useState('');
            
            // 🌟 2번 탭(수동매핑건 텍스트 덮어쓰기)을 위한 선택된 항목 Set
            const [selectedOverrides, setSelectedOverrides] = useState(new Set());

            const [isReadyToSave, setIsReadyToSave] = useState(false);
            const [checkedItems, setCheckedItems] = useState(new Set());

            const [scrollTop, setScrollTop] = useState(0);
            const handleScroll = useCallback((e) => setScrollTop(e.target.scrollTop), []);

            const { parserBuffer, masterProducts, availableCategories } = state;

            const targetRows = useMemo(() => {
                return parserBuffer.filter(r => r._apply && r._matchCode);
            }, [parserBuffer]);

            // 수동 매핑된 항목만 필터링 (텍스트 덮어쓰기 대상)
            const manualMappedRows = useMemo(() => {
                return targetRows.filter(r => r._matchStatus && r._matchStatus.includes('수동'));
            }, [targetRows]);

            useEffect(() => {
                if (targetRows.length === 0) onClose();
            }, [targetRows.length, onClose]);

            useEffect(() => {
                const timer = setTimeout(() => setIsReadyToSave(true), 800); 
                return () => clearTimeout(timer);
            }, []);

            const analysis = useMemo(() => {
                let up = 0, down = 0, changed = 0, same = 0, newItems = 0; 
                const list = []; const vendors = new Set(); 

                targetRows.forEach(row => {
                    const rowCode = row.코드 || row._matchCode;
                    const mItem = masterProducts[rowCode] || {}; 
                    const oldP = mItem ? parseNum(mItem['입고가']) : 0; 
                    
                    const newP = editedPrices[rowCode] !== undefined 
                        ? parseNum(editedPrices[rowCode])
                        : parseNum(row.finalData?.['입고가'] !== undefined 
                            ? row.finalData['입고가'] 
                            : (row.sources?.['estimate']?.['입고가'] !== undefined && row.sources?.['estimate']?.['입고가'] !== '' ? row.sources['estimate']['입고가'] : oldP));
                    
                    const vendor = row.finalData?.['구매처'] || row.sources?.['estimate']?.['구매처'] || mItem?.['구매처'] || '미지정';
                    vendors.add(vendor);

                    const masterName = mItem?.품목명 || '';
                    const masterSpec = mItem?.규격 || '';
                    const excelName = row.finalData?.['품목명'] || row.sources?.['estimate']?.['품목명'] || row['품목명'] || masterName || '';
                    const excelSpec = row.finalData?.['규격'] || row.sources?.['estimate']?.['규격'] || row['규격'] || masterSpec || '';

                    let status = 'same'; let issues = [];

                    if (!mItem.품목명 && !mItem.코드) { 
                        status = 'new'; newItems++; issues.push({ text: '신규', color: 'text-emerald-500 font-bold bg-emerald-50 px-1.5 py-0.5 rounded' });
                    } else {
                        let priceChanged = false;
                        if (newP > oldP && oldP > 0) { status = 'up'; up++; priceChanged = true; issues.push({ text: `+${(newP-oldP).toLocaleString()}`, color: 'text-rose-500 font-bold bg-rose-50 px-1.5 py-0.5 rounded' }); } 
                        else if (newP < oldP && newP > 0) { status = 'down'; down++; priceChanged = true; issues.push({ text: `${(newP-oldP).toLocaleString()}`, color: 'text-blue-500 font-bold bg-blue-50 px-1.5 py-0.5 rounded' }); }

                        let textChanged = false;
                        if (masterName && excelName && String(masterName).trim() !== String(excelName).trim()) {
                            textChanged = true; issues.push({ text: `${masterName}`, color: 'text-amber-600 font-medium bg-amber-50 px-1.5 py-0.5 rounded' });
                        }
                        if (masterSpec && excelSpec && String(masterSpec).trim() !== String(excelSpec).trim()) {
                            textChanged = true; issues.push({ text: `${masterSpec}`, color: 'text-amber-600 font-medium bg-amber-50 px-1.5 py-0.5 rounded' });
                        }

                        if (!priceChanged) {
                            if (textChanged) { status = 'changed'; changed++; } else { status = 'same'; same++; }
                        }
                    }

                    list.push({ 
                        ...row, 
                        코드: rowCode, 엑셀품명: excelName, 엑셀규격: excelSpec, 거래처: vendor, 
                        기존단가: oldP, 새단가: newP, issues: issues, 상태: status 
                    });
                });

                list.sort((a, b) => { if (a.거래처 !== b.거래처) return a.거래처.localeCompare(b.거래처); return String(a.코드).localeCompare(String(b.코드)); });
                return { up, down, changed, same, newItems, total: targetRows.length, list, vendors: Array.from(vendors).sort() };
            }, [targetRows, masterProducts, editedPrices]);

            const filteredPriceList = useMemo(() => {
                return analysis.list.filter(i => {
                    const statusMatch = priceFilter === 'all' || i.상태 === priceFilter;
                    const vendorMatch = vendorFilter === 'all' || i.거래처 === vendorFilter;
                    return statusMatch && vendorMatch;
                });
            }, [analysis.list, priceFilter, vendorFilter]);
            
            useEffect(() => {
                const allCodes = new Set(analysis.list.map(i => i.코드));
                setCheckedItems(allCodes);
            }, [analysis.list]);

            const toggleCheck = useCallback((code) => {
                setCheckedItems(prev => {
                    const next = new Set(prev);
                    if (next.has(code)) next.delete(code); else next.add(code);
                    return next;
                });
            }, []);

            const toggleAllPriceList = () => {
                const isAllChecked = filteredPriceList.length > 0 && filteredPriceList.every(i => checkedItems.has(i.코드));
                setCheckedItems(prev => {
                    const next = new Set(prev);
                    if (isAllChecked) filteredPriceList.forEach(i => next.delete(i.코드));
                    else filteredPriceList.forEach(i => next.add(i.코드));
                    return next;
                });
            };
            
            const toggleOverride = useCallback((code) => {
                setSelectedOverrides(prev => {
                    const next = new Set(prev);
                    if (next.has(code)) next.delete(code); else next.add(code);
                    return next;
                });
            }, []);

            const toggleAllOverrides = () => {
                const isAllChecked = manualMappedRows.length > 0 && manualMappedRows.every(i => selectedOverrides.has(i._matchCode || i.코드));
                setSelectedOverrides(prev => {
                    const next = new Set(prev);
                    if (isAllChecked) manualMappedRows.forEach(i => next.delete(i._matchCode || i.코드));
                    else manualMappedRows.forEach(i => next.add(i._matchCode || i.코드));
                    return next;
                });
            };

            const checkedTargetCodes = useMemo(() => {
                return filteredPriceList.filter(i => checkedItems.has(i.코드)).map(r => r.코드);
            }, [filteredPriceList, checkedItems]);

            // 🌟 F8 단축키 작동
            useEffect(() => {

                    if (e.key === 'F8') {

                                          (catalogOption === 'existing' && !selectedExistingCatalog) || 
                                          (catalogOption === 'new' && !newCatalogName.trim());

                            onConfirm(checkedTargetCodes, { catalogOption, selectedExistingCatalog, newCatalogName, selectedOverrides }, editedPrices);

            const handlePriceChange = useCallback((code, value) => {
                setEditedPrices(prev => ({ ...prev, [code]: value }));

            // 🌟 가상 스크롤 계산
            const ROW_HEIGHT = 44;

            const filterButtons = [
                {id:'all', label:'전체', val:analysis.total, color:'slate', icon:'fa-list'},

                {id:'down', label:'인하', val:analysis.down, color:'blue', icon:'fa-arrow-down'},
                {id:'new', label:'신규', val:analysis.newItems, color:'emerald', icon:'fa-star'},
                {id:'changed', label:'항목변경', val:analysis.changed, color:'amber', icon:'fa-edit'},

            ];

            return (
                <div className="fixed inset-0 flex justify-center items-center bg-slate-900/80 backdrop-blur-sm fade-in z-[100]">
                    <div className="bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden w-[1100px] h-[90vh]">
                        <div className="bg-[#0f172a] p-4 text-white flex justify-between items-center border-b border-slate-700 shrink-0">
                            <h2 className="font-black text-[16px] flex items-center"><i className="fas fa-check-circle text-indigo-400 mr-2"></i>엑셀 데이터 통합 반영 (단가 & 카탈로그)</h2>
                            <button onClick={onClose}><i className="fas fa-times text-slate-400 hover:text-white text-[20px]"></i></button>

                        <div className="flex bg-slate-100 border-b border-slate-200 shrink-0 p-2 gap-2">
                            <button onClick={() => {setViewMode('price'); setScrollTop(0); document.getElementById('review-modal-scroll')?.scrollTo(0,0);}} className={`flex-1 py-2.5 rounded-lg font-black text-[13px] transition-all flex justify-center items-center ${viewMode === 'price' ? 'bg-white text-emerald-700 shadow-sm border border-slate-200' : 'text-slate-500 hover:bg-slate-200'}`}>
                                <i className="fas fa-search-dollar mr-2"></i>1. 단가 변동 브리핑 (메인)

                            <button onClick={() => {setViewMode('mapping'); setScrollTop(0); document.getElementById('review-modal-scroll')?.scrollTo(0,0);}} className={`flex-1 py-2.5 rounded-lg font-black text-[13px] transition-all flex justify-center items-center ${viewMode === 'mapping' ? 'bg-white text-indigo-700 shadow-sm border border-slate-200' : 'text-slate-500 hover:bg-slate-200'}`}>
                                <i className="fas fa-edit mr-2"></i>2. 마스터 텍스트 덮어쓰기 (수동매핑건)

                        </div>

                        {viewMode === 'price' ? (
                            <div className="flex-1 flex flex-col bg-white overflow-hidden fade-in relative">
                                <div className="p-4 bg-slate-100 border-b border-slate-300 flex items-center justify-between shrink-0 shadow-inner z-20">
                                    <div className="flex gap-2">
                                        {filterButtons.map(b => (
                                            <button 
                                                key={b.id} 
                                                onClick={()=>{setPriceFilter(b.id); setScrollTop(0); document.getElementById('review-modal-scroll')?.scrollTo(0,0);}} 
                                                className={`flex flex-col items-center justify-center py-2 px-3 min-w-[85px] border rounded-xl transition-all shadow-sm ${priceFilter===b.id ? `bg-${b.color}-500 text-white border-${b.color}-600 ring-2 ring-${b.color}-200` : `bg-white text-slate-600 border-slate-200 hover:border-${b.color}-300 hover:shadow-md`}`}
                                            >
                                                <div className={`text-[11px] font-bold mb-0.5 ${priceFilter===b.id ? 'text-white/90' : `text-${b.color}-500`}`}>

                                                </div>
                                                <div className={`text-xl font-black tracking-tight ${priceFilter===b.id ? 'text-white' : 'text-slate-800'}`}>

                                    </div>
                                    <div className="flex items-center gap-3">
                                        <select value={vendorFilter} onChange={e => {setVendorFilter(e.target.value); setScrollTop(0); document.getElementById('review-modal-scroll')?.scrollTo(0,0);}} className="bg-white border border-slate-300 text-blue-700 text-[13px] py-2 px-3 rounded-xl outline-none focus:border-blue-400 h-11 font-bold shadow-sm w-[140px]">
                                            <option value="all">전체 거래처</option>

                                </div>
                                <div id="review-modal-scroll" className="flex-1 overflow-auto custom-scrollbar relative" onScroll={handleScroll}>

                                                <th className="px-4 py-3.5 w-28 text-right text-slate-500 font-bold">기존 입고가</th>
                                                <th className="px-4 py-3.5 w-32 text-right text-indigo-600 font-black bg-indigo-50/50"><i className="fas fa-edit mr-1"></i>새 입고가</th>
                                                <th className="px-4 py-3.5 w-[260px] text-slate-500 font-bold">검증 이슈 (마스터 비교)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 bg-white">
                                            {filteredPriceList.length === 0 ? (
                                                <tr><td colSpan="7" className="py-16 text-center text-slate-400 font-bold"><i className="fas fa-search text-3xl mb-3 block text-slate-200"></i>조건에 맞는 데이터가 없습니다.</td></tr>
                                            ) : (
                                                <>
                                                    {topPadding > 0 && <tr style={{ height: `${topPadding}px` }}><td colSpan="7" className="p-0 border-0"></td></tr>}
                                                    {virtualRows.map((i,idx) => (
                                                        <ReviewModalRow 
                                                            key={`price-${i.코드}-${idx}`}
                                                            item={i}
                                                            isChecked={checkedItems.has(i.코드)}
                                                            onToggleCheck={toggleCheck}
                                                            onPriceChange={handlePriceChange}
                                                        />
                                                    ))}
                                                    {bottomPadding > 0 && <tr style={{ height: `${bottomPadding}px` }}><td colSpan="7" className="p-0 border-0"></td></tr>}
                                                </>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : (
                            <div className="flex-1 flex flex-col bg-white overflow-hidden fade-in relative">
                                <div className="px-4 py-3 bg-indigo-50 border-b border-indigo-100 flex justify-between items-center shrink-0">
                                    <span className="text-[12px] font-bold text-indigo-800"><i className="fas fa-info-circle mr-1.5"></i>유사 및 불일치 항목을 수동으로 연결한 내역입니다. 파싱된 텍스트로 마스터의 품명/규격을 덮어쓸 항목을 선택하세요.</span>
                                    <span className="text-[11px] bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-black">수동연결 총 {manualMappedRows.length}건</span>
                                </div>
                                <div id="review-modal-scroll" className="flex-1 overflow-auto custom-scrollbar relative" onScroll={handleScroll}>
                                    <table className="w-full text-left text-[12px] whitespace-nowrap relative z-0">
                                        <thead className="bg-[#f5f4f0] text-[#5c554d] font-bold sticky top-0 z-10 border-b border-[#e8e4db]">
                                            <tr>
                                                <th className="px-4 py-2.5 w-12 text-center">
                                                    <input type="checkbox" className="rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer" checked={manualMappedRows.length > 0 && manualMappedRows.every(i => selectedOverrides.has(i._matchCode || i.코드))} onChange={toggleAllOverrides} />
                                                </th>
                                                <th className="px-4 py-2.5 w-24">상품코드</th>
                                                <th className="px-4 py-2.5 w-1/2">마스터 상품 정보 (As-Is)</th>

                                                <th className="px-4 py-2.5 w-1/2 text-indigo-700 bg-indigo-50/50">덮어쓸 파싱 텍스트 (To-Be)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {manualMappedRows.length === 0 ? (
                                                <tr><td colSpan="5" className="p-10 text-center text-slate-400 font-bold">수동으로 연결한 항목이 없습니다.</td></tr>
                                            ) : (
                                                <>
                                                    {topPadding > 0 && <tr style={{ height: `${topPadding}px` }}><td colSpan="5"></td></tr>}
                                                    {virtualRows.map(item => {
                                                        const code = item._matchCode || item.코드;
                                                        const mItem = masterProducts[code] || {};
                                                        const isChecked = selectedOverrides.has(code);
                                                        return (
                                                            <tr key={`map-${item._id}`} className={`hover:bg-slate-50 transition-colors h-[40px] ${isChecked ? 'bg-indigo-50/20' : ''}`}>
                                                                <td className="px-4 py-1 text-center">
                                                                    <input type="checkbox" className="rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer" checked={isChecked} onChange={() => toggleOverride(code)} />
                                                                </td>
                                                                <td className="px-4 py-1 font-mono text-slate-500 text-[11px]">{code}</td>
                                                                <td className="px-4 py-1 text-slate-500">
                                                                    <span className="font-bold truncate">{mItem.품목명 || '[이름없음]'}</span>
                                                                    <span className="text-[11px] ml-1">({mItem.규격 || '규격없음'})</span>
                                                                </td>
                                                                <td className="px-2 py-1 text-center text-slate-300"><i className="fas fa-arrow-right"></i></td>
                                                                <td className="px-4 py-1 bg-indigo-50/10">
                                                                    <span className={`font-black truncate ${isChecked ? 'text-indigo-700' : 'text-slate-700'}`}>{item['품목명']}</span>
                                                                    <span className={`text-[11px] ml-1 ${isChecked ? 'text-indigo-500' : 'text-slate-500'}`}>({item['규격']} {item['단위'] ? `| ${item['단위']}` : ''})</span>
                                                                </td>

                                                    {bottomPadding > 0 && <tr style={{ height: `${bottomPadding}px` }}><td colSpan="5"></td></tr>}
                                                </>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                        
                        <div className="bg-slate-50 border-t border-slate-300 px-5 py-3 shrink-0 flex items-center justify-between z-20">

                                <div className="flex items-center gap-4 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
                                    <label className="flex items-center cursor-pointer group">
                                        <input type="radio" name="catOpt" className="w-3.5 h-3.5 text-blue-600 border-slate-300 focus:ring-blue-500 cursor-pointer" checked={catalogOption==='existing'} onChange={()=>setCatalogOption('existing')} />
                                        <span className={`ml-1.5 text-[12px] font-bold transition-colors ${catalogOption==='existing' ? 'text-blue-700' : 'text-slate-600 group-hover:text-slate-800'}`}>기존 병합</span>

                                    <label className="flex items-center cursor-pointer group">
                                        <input type="radio" name="catOpt" className="w-3.5 h-3.5 text-emerald-600 border-slate-300 focus:ring-emerald-500 cursor-pointer" checked={catalogOption==='new'} onChange={()=>setCatalogOption('new')} />
                                        <span className={`ml-1.5 text-[12px] font-bold transition-colors ${catalogOption==='new' ? 'text-emerald-700' : 'text-slate-600 group-hover:text-slate-800'}`}>신규 생성</span>

                                    <label className="flex items-center cursor-pointer group">
                                        <input type="radio" name="catOpt" className="w-3.5 h-3.5 text-slate-600 border-slate-300 focus:ring-slate-500 cursor-pointer" checked={catalogOption==='none'} onChange={()=>setCatalogOption('none')} />
                                        <span className={`ml-1.5 text-[12px] font-bold transition-colors ${catalogOption==='none' ? 'text-slate-800' : 'text-slate-500 group-hover:text-slate-700'}`}>저장 안 함</span>
                                    </label>

                                <div className="w-[200px]">
                                    {catalogOption === 'existing' && (
                                        <select value={selectedExistingCatalog} onChange={(e)=>setSelectedExistingCatalog(e.target.value)} className="w-full text-[12px] p-1.5 font-bold text-blue-700 border border-blue-300 rounded bg-white outline-none focus:border-blue-500 fade-in shadow-sm h-8">
                                            <option value="">-- 선택 --</option>
                                            {availableCategories && availableCategories.map(c => <option key={c.name} value={c.name}>{c.name} ({c.count}건)</option>)}
                                        </select>
                                    )}
                                    {catalogOption === 'new' && (
                                        <input id="new-catalog-input" type="text" value={newCatalogName} onChange={(e)=>setNewCatalogName(e.target.value)} placeholder="새 이름 입력" className="w-full text-[12px] p-1.5 font-bold text-emerald-700 border border-emerald-300 rounded bg-white outline-none focus:border-emerald-500 fade-in shadow-sm h-8" />
                                    )}
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3">
                                <button onClick={onClose} className="h-11 px-5 text-[13px] font-bold text-slate-600 bg-white rounded-xl border border-slate-300 hover:bg-slate-50 transition-colors shadow-sm">닫기</button>
                                <button 
                                    onClick={()=>{
                                        onConfirm(checkedTargetCodes, { catalogOption, selectedExistingCatalog, newCatalogName, selectedOverrides }, editedPrices); 
                                        onClose();
                                    }} 
                                    disabled={
                                        checkedTargetCodes.length === 0 || 
                                        (catalogOption === 'existing' && !selectedExistingCatalog) || 
                                        (catalogOption === 'new' && !newCatalogName.trim())
                                    }
                                    className="h-11 px-6 text-[14px] font-black text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 shadow-md flex items-center transition-colors disabled:bg-slate-300 disabled:text-slate-500 disabled:cursor-not-allowed"
                                >
                                    <i className="fas fa-save mr-2"></i> {checkedTargetCodes.length}건 반영 {isReadyToSave ? '[F8]' : ''}
