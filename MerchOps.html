<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>ONEAPP MerchOps - Main Workspace [v3.1.0 Micro-Frontend]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script>
        /* =========================================================================
           🚀 [4단계] 코어 엔진 (coreEngine.js)
           * 실제 서버 환경에서는 이 부분을 <script src="coreEngine.js"> 로 대체하세요.
           ========================================================================= */
        const MASTER_HEADERS = [ "창고", "1코드", "1그룹명", "2코드", "2그룹명", "3코드", "3그룹명", "오더즈", "구매처", "브랜드", "품목코드", "품목명", "규격", "안전재고", "간단설명", "카탈로그", "견적서", "출고가", "입고가", "입고B", "도매A", "도매B", "상장가", "최종전송", "최종입고", "단가H", "단가I", "시중가", "행사가", "1종코드", "1종규격", "1종연산", "2종코드", "2종규격", "2종연산", "외주비", "노무비", "경비", "비과세", "기본", "연동", "싯가", "단위", "준비기간", "마감시간", "검색어등록" ];
        const NUMERIC_HEADERS = [ "안전재고", "출고가", "입고가", "입고B", "도매A", "도매B", "상장가", "최종전송", "최종입고", "단가H", "단가I", "시중가", "행사가", "1종연산", "2종연산", "외주비", "노무비", "경비", "1구매", "1출고", "2구매", "2출고", "1입고", "2입고" ];
        const HIGHLIGHT_COLS = ['입고가', '도매A', '행사가', '출고가'];

        const initIDB = () => new Promise((resolve, reject) => { 
            const request = indexedDB.open('MerchOpsDB', 2); 
            request.onupgradeneeded = (e) => { 
                const db = e.target.result; 
                if (!db.objectStoreNames.contains('store')) db.createObjectStore('store'); 
                if (!db.objectStoreNames.contains('master_products')) db.createObjectStore('master_products', { keyPath: '코드' }); 
            }; 
            request.onsuccess = () => resolve(request.result); 
            request.onerror = () => reject(request.error); 
        });

        const setIDB = async (key, val) => { 
            const db = await initIDB(); 
            return new Promise((resolve, reject) => { 
                const tx = db.transaction('store', 'readwrite'); 
                tx.objectStore('store').put(val, key); 
                tx.oncomplete = () => resolve(); 
                tx.onerror = () => reject(tx.error); 
            }); 
        };

        const getIDB = async (key) => { 
            const db = await initIDB(); 
            return new Promise((resolve, reject) => { 
                const tx = db.transaction('store', 'readonly'); 
                const req = tx.objectStore('store').get(key); 
                req.onsuccess = () => resolve(req.result); 
                req.onerror = () => reject(tx.error); 
            }); 
        };

        const bulkPutIDB = async (storeName, items) => { 
            const db = await initIDB(); 
            return new Promise((resolve, reject) => { 
                const tx = db.transaction(storeName, 'readwrite'); 
                const store = tx.objectStore(storeName); 
                items.forEach(item => store.put(item)); 
                tx.oncomplete = () => resolve(); 
                tx.onerror = () => reject(tx.error); 
            }); 
        };

        const getAllIDB = async (storeName) => { 
            const db = await initIDB(); 
            return new Promise((resolve, reject) => { 
                const tx = db.transaction(storeName, 'readonly'); 
                const req = tx.objectStore(storeName).getAll(); 
                req.onsuccess = () => resolve(req.result); 
                req.onerror = () => reject(tx.error); 
            }); 
        };

        const generateUUID = () => { 
            if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); 
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { 
                const r = Math.random() * 16 | 0; 
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); 
            }); 
        };

        const parseNum = (v) => (!v ? 0 : Number(String(v).replace(/,/g, '').replace(/[^\d.-]/g, '')) || 0);

        const calculatePricesEngine = (baseInPrice, mItem = {}, currentFinalData = {}, marginRules = [], forceRecalc = false) => {
            const ROUND_UNIT = 100;
            const outsrc = (!currentFinalData?.['외주비'] && currentFinalData?.['외주비'] !== 0) ? parseNum(mItem?.['외주비']) : parseNum(currentFinalData?.['외주비']);
            const labor = (!currentFinalData?.['노무비'] && currentFinalData?.['노무비'] !== 0) ? parseNum(mItem?.['노무비']) : parseNum(currentFinalData?.['노무비']);
            const totalCost = baseInPrice + outsrc + labor;
            const whCode = String(currentFinalData?.['창고'] ?? mItem?.['창고'] ?? '').trim();
            const unitStr = String(currentFinalData?.['단위'] ?? mItem?.['단위'] ?? '').trim().toLowerCase();
            
            const matchWh = (ruleWh, targetWh) => { 
                if (ruleWh === '*') return true; 
                const targets = String(ruleWh).split(/[,./|\s]+/).map(s => s.trim()).filter(Boolean); 
                return targets.some(s => s === targetWh || (targetWh !== '' && !isNaN(s) && !isNaN(targetWh) && Number(s) === Number(targetWh))); 
            };

            const matchUnit = (ruleUnit, targetUnit) => { 
                if (ruleUnit === '*') return true; 
                const targets = String(ruleUnit).toLowerCase().split(/[,./|\s]+/).map(s => s.trim()).filter(Boolean); 
                return targets.some(s => targetUnit === s || targetUnit.includes(s)); 
            };

            let bestRule = null; 
            let bestScore = -1;
            const safeMarginRules = Array.isArray(marginRules) ? marginRules : [];

            safeMarginRules.forEach(r => { 
                if (matchWh(r.whCode, whCode) && matchUnit(r.unit, unitStr)) { 
                    let score = 0; 
                    if (r.whCode !== '*') score += 2; 
                    if (r.unit !== '*') score += 1; 
                    if (score > bestScore) { bestScore = score; bestRule = r; } 
                } 
            });

            const appliedRule = bestRule || { rate: 10, type: 'divide' }; 
            let calcOutPrice = 0;

            if (baseInPrice > 0) { 
                if (appliedRule.type === 'divide') {
                    calcOutPrice = totalCost / (1 - (appliedRule.rate / 100)); 
                } else {
                    calcOutPrice = totalCost * (1 + (appliedRule.rate / 100)); 
                }
                calcOutPrice = Math.round(calcOutPrice / ROUND_UNIT) * ROUND_UNIT; 
            }

            let newFinalData = { ...currentFinalData, '입고가': baseInPrice }; 
            newFinalData['시중가'] = calcOutPrice;

            const providedOutPrice = parseNum(currentFinalData?.['출고가']); 
            const mIn = parseNum(mItem?.['입고가']); 
            const mOut = parseNum(mItem?.['출고가']);

            if (baseInPrice === 0) {
                newFinalData['출고가'] = 0; 
            } else if (providedOutPrice > 0 && !forceRecalc) {
                newFinalData['출고가'] = providedOutPrice; 
            } else if (baseInPrice === mIn && mOut > 0 && !forceRecalc) {
                newFinalData['출고가'] = mOut; 
            } else {
                newFinalData['출고가'] = calcOutPrice;
            }

            const div1 = parseNum(currentFinalData?.['1종연산'] ?? mItem?.['1종연산']); 
            const extraCost = parseNum(currentFinalData?.['경비'] ?? mItem?.['경비']); 
            
            if (div1 > 0) { 
                if (baseInPrice === 0) { 
                    newFinalData['1입고'] = 0; 
                    newFinalData['1출고'] = 0; 
                } else { 
                    newFinalData['1입고'] = Math.round(((baseInPrice + outsrc) / div1) / ROUND_UNIT) * ROUND_UNIT; 
                    newFinalData['1출고'] = Math.round((Math.round((newFinalData['출고가'] / div1) + extraCost)) / 10) * 10; 
                } 
            }
            return newFinalData;
        };
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef, useCallback } = React;

        // ==========================================
        // 🧩 1. 기본 유틸리티 및 데이터 맵
        // ==========================================
        const getInitialVisibleMasterCols = () => ({ estimate: ['카탈로그', '견적서', '입고가', '출고가', '입고B', '도매A'] });
        const getInitialVisibleUploadCols = () => ({ estimate: ['창고', '구매처', '견적서', '입고가', '출고가', '입고B', '도매A', '간단설명'] });
        
        const getInitialMappings = () => {
            const base = { master: {}, estimate: {} };
            base.master = { '창고': '창고, 창고코드', '품목코드': '품목코드, 상품코드, 바코드, 상품번호, 코드', '품목명': '품목명, 상품명, 품명, 상품이름', '규격': '규격, 규격명, 사이즈, 단량', '출고가': '출고가, 출고, 판매가, 시중가', '입고가': '입고가, 입고, 매입가' };
            base.estimate = { 
                '창고': '창고, 창고코드', '품목코드': '품목코드, 상품코드, 바코드, 상품번호, 코드', '품목명': '품목명, 상품명, 품명, 상품이름', '규격': '규격명, 규격, 사이즈, 단량', '구매처': '거래처명, 구매처, 거래처', 
                '견적서': '견적서, 카테고리, 템플릿, 견적분류',
                '입고가': '입고가, 입고, 매입가', '출고가': '출고가, 출고, 판매가',
                '입고B': 'B단가, 입고B', '도매A': 'A판매, A판매가, 도매A', '도매B': 'B판매, B판매가, 도매B', '간단설명': '지시사항, 간단설명, 비고' 
            };
            return base;
        };

        const getInitialMasterLinks = () => {
            const base = { master: {}, estimate: {} };
            base.estimate = { '창고': '창고', '구매처': '구매처', '견적서': '견적서', '입고가': '입고가', '출고가': '출고가', '입고B': '입고B', '도매A': '도매A', '도매B': '도매B', '간단설명': '간단설명' };
            return base;
        };

        const getCellWidthClass = (h) => {
            if (NUMERIC_HEADERS.includes(h)) return 'min-w-[90px] w-[90px] max-w-[90px]';
            if (['구매처', '거래처명', '일자'].includes(h)) return 'min-w-[100px] w-[100px] max-w-[100px]';
            if (['품목명', '상품명', '카탈로그', '견적서'].includes(h)) return 'min-w-[200px] w-[200px] max-w-[200px]';
            if (['간단설명', '지시사항', '상품정보', '적요2'].includes(h)) return 'min-w-[150px] w-[150px] max-w-[150px]';
            if (['단위', '창고'].includes(h)) return 'min-w-[60px] w-[60px] max-w-[60px]';
            return 'min-w-[100px] w-[100px] max-w-[100px]';
        };

        const getFirstValidNum = (objList, keys) => { 
            for (let obj of objList) { 
                if (!obj) continue; 
                for (let k of keys) { 
                    if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return parseNum(obj[k]); 
                } 
            } 
            return 0; 
        };

        const getFirstValidStr = (objList, keys) => { 
            for (let obj of objList) { 
                if (!obj) continue; 
                for (let k of keys) { 
                    if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k]; 
                } 
            } 
            return ''; 
        };

        const isValidSubItemCode = (code) => { 
            if (!code) return false; 
            const s = String(code).trim(); 
            return s !== '' && s !== '0' && s !== '00' && s !== '-' && s.toLowerCase() !== 'undefined' && s.toLowerCase() !== 'null'; 
        };

        // ==========================================
        // 🧩 2. 엑셀 파싱 로직
        // ==========================================
        const createHeaderMap = (actualHeaders, mappingConfig) => {
            const headerMap = {};
            if(!mappingConfig) return headerMap;

            Object.keys(mappingConfig).forEach(field => {
                const keywords = String(mappingConfig[field]).split(',').map(s => s.trim().toLowerCase().replace(/\s/g, '')).filter(Boolean);
                let matchedKey = actualHeaders.find(h => h && keywords.includes(String(h).toLowerCase().replace(/\s/g, '')));
                
                if (!matchedKey) {
                    matchedKey = actualHeaders.find(h => {
                        if(!h) return false; 
                        const cleanH = String(h).toLowerCase().replace(/\s/g, '');
                        return keywords.some(kw => { 
                            if (kw === '코드' && (cleanH.includes('1') || cleanH.includes('2') || cleanH.includes('3') || cleanH.includes('종'))) return false; 
                            return cleanH.includes(kw); 
                        });
                    });
                }
                if(matchedKey) headerMap[field] = matchedKey;
            });
            return headerMap;
        };

        const parseExcelRobust = (file) => {
            return new Promise((resolve, reject) => {
                if (!window.XLSX) return reject(new Error("엑셀 파서 로드 대기중"));
                
                const processData = (data, type) => {
                    try {
                        const wb = window.XLSX.read(data, { type: type, cellDates: true });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const jsonAll = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false });
                        if(jsonAll.length === 0) return [];
                        
                        let headerRowIdx = -1;
                        for (let i = 0; i < Math.min(25, jsonAll.length); i++) {
                            const rowStr = (jsonAll[i] || []).join('').replace(/\s/g, '');
                            if (
                                rowStr.includes('품목코드') || rowStr.includes('상품코드') || rowStr.includes('바코드') || 
                                (rowStr.includes('코드') && (rowStr.includes('품명') || rowStr.includes('상품명') || rowStr.includes('규격'))) || 
                                (rowStr.includes('품명') && (rowStr.includes('규격') || rowStr.includes('단가')))
                            ) { 
                                headerRowIdx = i; break; 
                            }
                        }
                        if (headerRowIdx === -1) return null; 

                        const headers = jsonAll[headerRowIdx] || [];
                        let endIdx = jsonAll.length - 1;
                        
                        while (endIdx > headerRowIdx) {
                            const rowArr = jsonAll[endIdx];
                            if (!rowArr || rowArr.length === 0) { endIdx--; continue; }
                            let filledCount = 0, rawStr = '';
                            for(let i=0; i<rowArr.length; i++) { 
                                const val = rowArr[i]; 
                                if(val !== undefined && val !== null && String(val).trim() !== '') { 
                                    filledCount++; rawStr += String(val).replace(/\s/g, ''); 
                                } 
                            }
                            if (rawStr === '') { endIdx--; continue; }
                            if ((rawStr.includes('출력') || rawStr.includes('시간') || rawStr.includes('합계') || rawStr.includes('총계')) && filledCount <= 4) {
                                endIdx--; 
                            } else {
                                break;
                            }
                        }

                        const parsedData = [];
                        for (let i = headerRowIdx + 1; i <= endIdx; i++) {
                            const row = jsonAll[i]; 
                            if (!row) continue;
                            let isEmpty = true; 
                            const obj = {}; 
                            headers.forEach((h, idx) => { 
                                if (h) { 
                                    obj[h] = row[idx]; 
                                    if(row[idx] !== undefined && String(row[idx]).trim() !== '') isEmpty = false; 
                                } 
                            }); 
                            if(!isEmpty) parsedData.push(obj);
                        }
                        return parsedData;
                    } catch(err) { 
                        return null; 
                    }
                };

                const isCSV = file.name.toLowerCase().endsWith('.csv');
                if (isCSV) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const text = e.target.result;
                        if (text.includes('')) { // 인코딩 깨짐 확인
                            const utf8Reader = new FileReader();
                            utf8Reader.onload = (e2) => resolve(processData(e2.target.result, 'string') || []);
                            utf8Reader.readAsText(file, 'utf-8');
                        } else { 
                            resolve(processData(text, 'string') || []); 
                        }
                    };
                    reader.readAsText(file, 'euc-kr');
                } else {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(processData(new Uint8Array(e.target.result), 'array') || []);
                    reader.readAsArrayBuffer(file);
                }
            });
        };

        // ==========================================
        // 🧩 3. 상태 관리 (State Architecture)
        // ==========================================
        const useMerchConfig = () => {
            const [cloudUrl, setCloudUrl] = useState(() => localStorage.getItem('merchCloudUrl_v870') || '');
            const [visibleMasterCols, setVisibleMasterCols] = useState(() => JSON.parse(localStorage.getItem('merchVisMaster_v870')) || getInitialVisibleMasterCols());
            const [visibleUploadCols, setVisibleUploadCols] = useState(() => JSON.parse(localStorage.getItem('merchVisUpload_v870')) || getInitialVisibleUploadCols());
            const [mappings, setMappings] = useState(() => JSON.parse(localStorage.getItem('merchMappings_v870')) || getInitialMappings());
            const [masterLinks, setMasterLinks] = useState(() => JSON.parse(localStorage.getItem('merchMasterLinks_v870')) || getInitialMasterLinks());
            const [marginRules, setMarginRules] = useState(() => JSON.parse(localStorage.getItem('merchMarginRules_v878')) || [{ id: 'default', whCode: '*', unit: '*', rate: 20, type: 'divide' }]);

            useEffect(() => {
                const handleStorageChange = (e) => { 
                    if (e.key === 'merch_settings_update_trigger') window.location.reload(); 
                };
                window.addEventListener('storage', handleStorageChange);
                return () => window.removeEventListener('storage', handleStorageChange);
            }, []);

            return { cloudUrl, visibleMasterCols, visibleUploadCols, mappings, masterLinks, marginRules };
        };

        const useMerchData = () => {
            const [masterProducts, setMasterProducts] = useState({});
            const [managedItems, setManagedItems] = useState({});
            const [historyLogs, setHistoryLogs] = useState([]);

            useEffect(() => {
                getAllIDB('master_products').then(items => {
                    if (items && items.length > 0) { 
                        const dict = {}; 
                        items.forEach(i => dict[i.코드] = i); 
                        setMasterProducts(dict); 
                    } else {
                        getIDB('merchMaster_v870').then(data => {
                            if (data) {
                                setMasterProducts(data);
                                window.requestIdleCallback?.(async () => await bulkPutIDB('master_products', Object.values(data).filter(item => item && item.코드)));
                            }
                        }).catch(console.error);
                    }
                }).catch(console.error);

                try { 
                    const logs = JSON.parse(localStorage.getItem('merchHistory_v870')); 
                    if (logs) setHistoryLogs(logs); 
                } catch(e) {}
            }, []);

            useEffect(() => {
                const handleStorageChange = (e) => { 
                    if (e.key === 'merchMaster_sync_trigger') {
                        getAllIDB('master_products').then(items => { 
                            if (items && items.length > 0) { 
                                const dict = {}; 
                                items.forEach(i => dict[i.코드] = i); 
                                setMasterProducts(dict); 
                            } 
                        }); 
                    }
                };
                window.addEventListener('storage', handleStorageChange); 
                return () => window.removeEventListener('storage', handleStorageChange);
            }, []);

            const saveMasterToLocal = useCallback(async (data) => { 
                setMasterProducts(data);
                try { 
                    window.requestIdleCallback?.(async () => { 
                        await bulkPutIDB('master_products', Object.values(data).filter(item => item && item.코드)); 
                        localStorage.setItem('merchMaster_sync_trigger', Date.now().toString()); 
                    }); 
                } catch(e) { console.error(e); } 
            }, []);

            const addHistoryLogs = useCallback((newLogs) => { 
                setHistoryLogs(prev => { 
                    const combined = [...newLogs, ...prev].slice(0, 2000); 
                    localStorage.setItem('merchHistory_v870', JSON.stringify(combined)); 
                    return combined; 
                }); 
            }, []);

            return { masterProducts, setMasterProducts: saveMasterToLocal, managedItems, setManagedItems, historyLogs, setHistoryLogs, addHistoryLogs };
        };

        const useMerchUI = () => {
            const [selectedRows, setSelectedRows] = useState(new Set()); 
            const [globalSearch, setGlobalSearch] = useState(''); 
            const [activeTags, setActiveTags] = useState([]);
            
            const [showReviewModal, setShowReviewModal] = useState(false); 
            const [showCategoryModal, setShowCategoryModal] = useState(false);
            
            const [alertMsg, setAlertMsg] = useState(''); 
            const [toastMsg, setToastMsg] = useState('');
            const [isProcessing, setIsProcessing] = useState(false); 
            const [processMsg, setProcessMsg] = useState('');
            
            // 💡 단가 즉시 필터링 로직
            const [priceFilter, setPriceFilter] = useState('all'); 
            
            const showToast = useCallback((msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3000); }, []);

            return { 
                selectedRows, setSelectedRows, globalSearch, setGlobalSearch, activeTags, setActiveTags, 
                showReviewModal, setShowReviewModal, showCategoryModal, setShowCategoryModal, 
                alertMsg, setAlertMsg, toastMsg, setToastMsg, isProcessing, setIsProcessing, processMsg, setProcessMsg, 
                showToast, priceFilter, setPriceFilter 
            };
        };

        // ==========================================
        // 🧩 4. 비즈니스 액션
        // ==========================================
        const useMerchActions = (config, data, ui, fullDisplayRows) => {
            const handleCloudSync = useCallback(async (type) => { 
                if (!config.cloudUrl) return ui.setAlertMsg("클라우드 URL이 설정되지 않았습니다. 우측 상단 톱니바퀴에서 URL을 세팅해주세요.");

                                history: data.historyLogs, 
                                appConfig: {

                    let totalCount = 0;
                    
                    for (const file of files) {
                        let mapKey = expectedType || 'master'; 
                        const excelData = await parseExcelRobust(file);
                        
                        if (!excelData || excelData.length === 0) { 
                            ui.showToast(`⚠️ [${file.name}] 인식할 수 있는 데이터가 없거나 형식이 맞지 않습니다.`);

                        }

                        const actualHeaders = Object.keys(excelData[0]); 
                        const curMap = config.mappings[mapKey] || {}; 
                        const headerCache = createHeaderMap(actualHeaders, curMap);
                        
                        excelData.forEach(row => {
                            const codeKey = headerCache['품목코드'] || '품목코드'; 
                            const nameKey = headerCache['품목명'] || '품목명';
                            const code = row[codeKey]; 
                            const name = row[nameKey];
                            
                            const cleanCode = String(code || '').replace(/\s/g, ''); 
                            const cleanName = String(name || '').replace(/\s/g, '');

                            if (!cleanCode || cleanCode.includes('출력') || cleanCode === '코드' || cleanCode === '품목코드' || cleanCode === '상품코드' || cleanCode.includes('예시') || cleanName.includes('테스트상품') || cleanName.includes('샘플상품') || cleanCode.toLowerCase().includes('test')) return;

                            if (mapKey === 'master') {
                                if (!newMaster[code]) newMaster[code] = { 코드: code };
                                MASTER_HEADERS.forEach(h => { 
                                    const actualKey = headerCache[h] || h; 
                                    if (actualHeaders.includes(actualKey)) { 
                                        const val = row[actualKey]; 
                                        newMaster[code][h] = (val !== undefined && val !== null && String(val).trim() !== '') ? (NUMERIC_HEADERS.includes(h) ? parseNum(val) : val) : (NUMERIC_HEADERS.includes(h) ? 0 : ''); 
                                    } 
                                });
                            } else {
                                if (!newManaged[code]) { newManaged[code] = { 코드: code, sources: {}, finalData: {}, _tags: new Set() }; }
                                let mItem = newManaged[code]; 
                                if (!mItem.sources[mapKey]) mItem.sources[mapKey] = {};
                                mItem = { ...mItem, _tags: new Set([...(mItem._tags || []), `excel:업로드`]) };
                                
                                mItem.sources[mapKey]['품목명'] = nameKey ? row[nameKey] : ''; 
                                mItem.sources[mapKey]['규격'] = headerCache['규격'] ? row[headerCache['규격']] : ''; 
                                mItem.sources[mapKey]['구매처'] = headerCache['구매처'] ? row[headerCache['구매처']] : '';
                                
                                Object.keys(curMap).forEach(h => {
                                    if (!['품목코드', '품목명', '규격', '구매처'].includes(h) && actualHeaders.includes(headerCache[h])) {
                                        const safeVal = (row[headerCache[h]] !== undefined && row[headerCache[h]] !== null) ? row[headerCache[h]] : '';
                                        const isNumeric = NUMERIC_HEADERS.includes(config.masterLinks[mapKey]?.[h]) || NUMERIC_HEADERS.includes(h);
                                        mItem.sources[mapKey][h] = isNumeric ? parseNum(safeVal) : safeVal;
                                        if (mItem.finalData[h] === undefined) mItem.finalData[h] = isNumeric ? parseNum(safeVal) : safeVal;
                                    }
                                });

                                if (mapKey === 'estimate') {

                                    mItem.finalData = calculatePricesEngine(pIn, newMaster[code]||{}, mItem.finalData, config.marginRules, false);
                                }
                                newManaged[code] = mItem;
                            }

                                <div className="truncate w-full">{mItem[h] !== undefined && mItem[h] !== '' ? (NUMERIC_HEADERS.includes(h) ? parseNum(mItem[h]).toLocaleString() : mItem[h]) : '-'}</div>

                            {visibleMasterCols['estimate']?.filter(h => !requiredCoreFields.includes(h)).map((h, i, arr) => {

                                let isChanged = false;
                                if (row.finalData && row.finalData[h] !== undefined) { 
                                    if (isNum && parseNum(row.finalData[h]) !== parseNum(mVal)) { isChanged = true; }

        const ExcelDataGrid = ({ state, actions }) => {

            const [visibleCount, setVisibleCount] = useState(100);
            
            useEffect(() => { setVisibleCount(100); }, [fullDisplayRows]);
            
            const handleScroll = useCallback((e) => { 
                const { scrollTop, clientHeight, scrollHeight } = e.target; 
                if (scrollHeight - scrollTop <= clientHeight + 150) {
                    setVisibleCount(p => (p < fullDisplayRows.length ? p + 100 : p)); 
                }
            }, [fullDisplayRows.length]);
            
            const displayRows = fullDisplayRows.slice(0, visibleCount); 
            const hiddenCount = fullDisplayRows.length - displayRows.length;

                                                        {h} {isHighlight && <i className="fas fa-bolt text-orange-400 ml-1 text-[10px]" title="주요 단가 항목"></i>}
                                                    </th>
                                                );
                                            })}

                                    const isSel = selectedRows.has(row.코드); 
                                    const bg = isSel ? 'bg-indigo-50/50' : (isEstimateUploaded ? 'bg-white hover:bg-slate-50' : 'bg-[#faf9f5] hover:bg-[#f0ece1]');
                                    const mItem = masterProducts[row.코드] || {}; 
                                    return <MemoizedTableRow key={row.코드} row={row} idx={idx} state={state} actions={actions} isSel={isSel} bg={bg} mItem={mItem} />;
                                })}
                                <tr>
                                    <td colSpan="50" className="h-[80px] bg-slate-50 border-t border-slate-200 text-center align-middle">
                                        {hiddenCount > 0 ? (
                                            <div className="inline-flex items-center justify-center text-[12px] font-bold text-slate-500 bg-white px-6 py-2 rounded-full border shadow-sm mt-5">
                                                <i className="fas fa-spinner fa-spin mr-2 text-indigo-500"></i>데이터를 더 불러오는 중... (남은 항목: {hiddenCount}건)
                                            </div>
                                        ) : (
                                            <div className="text-[12px] font-bold text-slate-400 inline-block mt-6">- 마지막 항목입니다 -</div>
                                        )}
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const WelcomeGuide = ({ onUpload, onCloudSync }) => (
            <div className="h-full w-full flex flex-col items-center justify-center bg-white rounded-xl border border-slate-200 shadow-sm p-10 fade-in relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500"></div>
                <div className="w-24 h-24 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-500 text-5xl mb-6 shadow-inner relative">
                    <i className="fas fa-box-open"></i>
                    <div className="absolute -bottom-2 -right-2 w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-white text-[14px] border-2 border-white shadow-sm"><i className="fas fa-check"></i></div>
                </div>
                <h2 className="text-2xl font-black text-slate-800 mb-3 tracking-tight">MerchOps 메인 워크스페이스 [v3.1.0 완벽 분할 및 필터 적용]</h2>
                <p className="text-[14px] text-slate-500 mb-10 text-center leading-relaxed font-bold">
                    현재 등록된 <span className="text-indigo-500">마스터 상품 데이터</span>가 없습니다.<br/>
                    견적 작업 및 파서 연동을 위해 전체 상품 DB를 세팅해주세요.
                </p>
                <div className="flex gap-6 w-full max-w-3xl z-10">
                    <div className="flex-1 bg-slate-50 border border-slate-200 p-8 rounded-xl text-center hover:shadow-lg transition-all duration-300 group hover:-translate-y-1 hover:bg-emerald-50 hover:border-emerald-200 cursor-pointer relative overflow-hidden">
                        <label className="absolute inset-0 w-full h-full cursor-pointer z-20"><input type="file" className="hidden" onChange={(e) => onUpload(e, 'master')} multiple accept=".xlsx, .xls, .csv" /></label>
                        <div className="text-4xl text-emerald-500 mb-5 group-hover:scale-110 transition-transform duration-300"><i className="fas fa-file-excel"></i></div>
                        <h3 className="text-[16px] font-black text-slate-800 mb-2 group-hover:text-emerald-800 transition-colors">1. 마스터 엑셀 직접 업로드</h3>
                        <p className="text-[12px] text-slate-500 mb-6 group-hover:text-emerald-600 transition-colors">ERP의 전체 상품 마스터 파일을 업로드합니다.</p>
                    </div>
                    <div className="flex-1 bg-slate-50 border border-slate-200 p-8 rounded-xl text-center hover:shadow-lg transition-all duration-300 group hover:-translate-y-1 hover:bg-indigo-50 hover:border-indigo-200 cursor-pointer relative overflow-hidden" onClick={() => onCloudSync('download')}>
                        <div className="text-4xl text-indigo-500 mb-5 group-hover:scale-110 transition-transform duration-300"><i className="fas fa-cloud-download-alt"></i></div>
                        <h3 className="text-[16px] font-black text-slate-800 mb-2 group-hover:text-indigo-800 transition-colors">2. 클라우드에서 데이터 수신</h3>
                        <p className="text-[12px] text-slate-500 mb-6 group-hover:text-indigo-600 transition-colors">구글 시트에 백업된 마스터를 수동으로 가져옵니다.</p>
                    </div>
                    <div className="flex-1 bg-slate-50 border border-slate-200 p-8 rounded-xl text-center hover:shadow-lg transition-all duration-300 group hover:-translate-y-1 hover:bg-purple-50 hover:border-purple-200 cursor-pointer relative overflow-hidden" onClick={() => window.open('smart_parser.html', 'NEXUS_PARSER')}>
                        <div className="text-4xl text-purple-500 mb-5 group-hover:scale-110 transition-transform duration-300"><i className="fas fa-magic"></i></div>
                        <h3 className="text-[16px] font-black text-slate-800 mb-2 group-hover:text-purple-800 transition-colors">3. 스마트 파서로 이동</h3>
                        <p className="text-[12px] text-slate-500 mb-6 group-hover:text-purple-600 transition-colors">텍스트 기반의 카탈로그 델타 동기화 전용 뷰로 이동합니다.</p>
                    </div>
                </div>
            </div>
        );

        const ReviewModal = ({ onClose, onConfirm, state, data }) => {
            const targetRows = useMemo(() => {
                return state.fullDisplayRows.filter(row => state.selectedRows.has(row.코드));
            }, [state.fullDisplayRows, state.selectedRows]);

            const analysis = useMemo(() => {
                let up = 0, down = 0, same = 0, newItems = 0, warningItems = 0;
                const list = [];
                const warnThresh = Number(localStorage.getItem('merchWarningThreshold_v870')) || 30;
                const warnAmt = Number(localStorage.getItem('merchWarningAmount_v870')) || 1000;

                targetRows.forEach(row => {
                    const mItem = data.masterProducts[row.코드];
                    const oldP = mItem ? parseNum(mItem['입고가']) : 0;
                    const newP = parseNum(row.finalData?.['입고가'] !== undefined ? row.finalData['입고가'] : row.sources?.['estimate']?.['입고가']);
                    
                    let status = 'same';
                    if (!mItem) { status = 'new'; newItems++; }
                    else if (oldP === 0 || newP === 0) { status = 'same'; same++; }
                    else if (newP > oldP) { status = 'up'; up++; }
                    else if (newP < oldP) { status = 'down'; down++; }
                    else { status = 'same'; same++; }

                    const diffAmt = newP - oldP;
                    const diffPct = oldP > 0 ? Math.abs(diffAmt / oldP) * 100 : 0;
                    const isWarn = oldP > 0 && diffPct >= warnThresh && Math.abs(diffAmt) >= warnAmt;
                    if(isWarn) warningItems++;

                    list.push({
                        코드: row.코드,
                        품명: row.finalData?.['품목명'] || row.sources?.['estimate']?.['품목명'] || mItem?.품목명 || '',
                        규격: row.finalData?.['규격'] || row.sources?.['estimate']?.['규격'] || mItem?.규격 || '',
                        기존단가: oldP, 새단가: newP, 차액: diffAmt, 상태: status, isWarn
                    });
                });

                list.sort((a, b) => {
                    if (a.isWarn && !b.isWarn) return -1;
                    if (!a.isWarn && b.isWarn) return 1;
                    return Math.abs(b.차액) - Math.abs(a.차액);
                });

                return { up, down, same, newItems, warningItems, total: targetRows.length, list };
            }, [targetRows, data.masterProducts]);

            return (
                <div className="fixed inset-0 bg-slate-900/80 z-[100] flex justify-center items-center backdrop-blur-sm fade-in" onClick={onClose}>
                    <div className="bg-white w-[850px] max-h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden" onClick={(e) => e.stopPropagation()}>
                        <div className="bg-[#0f172a] p-4 text-white flex justify-between shrink-0 border-b border-slate-700">
                            <h2 className="font-black text-[16px]"><i className="fas fa-search-dollar text-indigo-400 mr-2"></i>작업 완료 및 저장 전 프리뷰</h2>
                            <button onClick={onClose}><i className="fas fa-times text-slate-400 hover:text-white"></i></button>
                        </div>
                        
                        {/* 💡 최종 안전망 경고 배너 */}
                        {analysis.warningItems > 0 && (
                            <div className="bg-rose-50 border-b border-rose-200 p-3 flex items-center gap-2 text-rose-700 font-bold shrink-0">
                                <i className="fas fa-exclamation-triangle text-rose-500 animate-pulse text-lg"></i>
                                <span>⚠️ 확인되지 않은 오류(급등락) 의심 항목이 {analysis.warningItems}건 포함되어 있습니다! 상단 목록을 우선 검토하세요.</span>
                            </div>
                        )}
                        
                        <div className="p-6 flex flex-col flex-1 overflow-hidden bg-slate-50">
                            <div className="grid grid-cols-4 gap-3 mb-4 shrink-0">
                                <div className="bg-white border border-rose-200 p-3 rounded-xl flex flex-col items-center justify-center shadow-sm">
                                    <div className="text-[11px] text-rose-500 font-bold mb-1"><i className="fas fa-arrow-up mr-1"></i>인상</div>
                                    <div className="text-rose-700 font-black text-xl">{analysis.up}<span className="text-[11px] ml-1 font-bold">건</span></div>
                                </div>
                                <div className="bg-white border border-blue-200 p-3 rounded-xl flex flex-col items-center justify-center shadow-sm">
                                    <div className="text-[11px] text-blue-500 font-bold mb-1"><i className="fas fa-arrow-down mr-1"></i>인하</div>
                                    <div className="text-blue-700 font-black text-xl">{analysis.down}<span className="text-[11px] ml-1 font-bold">건</span></div>
                                </div>
                                <div className="bg-white border border-emerald-200 p-3 rounded-xl flex flex-col items-center justify-center shadow-sm">
                                    <div className="text-[11px] text-emerald-500 font-bold mb-1"><i className="fas fa-star mr-1"></i>신규</div>
                                    <div className="text-emerald-700 font-black text-xl">{analysis.newItems}<span className="text-[11px] ml-1 font-bold">건</span></div>
                                </div>
                                <div className="bg-white border border-slate-200 p-3 rounded-xl flex flex-col items-center justify-center shadow-sm">
                                    <div className="text-[11px] text-slate-500 font-bold mb-1"><i className="fas fa-equals mr-1"></i>동결/기타</div>
                                    <div className="text-slate-700 font-black text-xl">{analysis.same}<span className="text-[11px] ml-1 font-bold">건</span></div>
                                </div>
                            </div>

                            <div className="flex-1 overflow-hidden flex flex-col bg-white border border-slate-200 rounded-xl shadow-sm">
                                <div className="px-4 py-2 bg-slate-100 border-b border-slate-200 text-[12px] font-bold text-slate-600 flex justify-between">
                                    <span>선택된 반영 대상: {analysis.total}건 (단가 변동순 정렬)</span>
                                </div>
                                <div className="flex-1 overflow-auto custom-scrollbar">
                                    <table className="w-full text-left text-[12px] whitespace-nowrap">
                                        <thead className="bg-white sticky top-0 border-b border-slate-200 shadow-sm z-10">
                                            <tr className="text-slate-500">
                                                <th className="px-4 py-2 w-16 text-center">상태</th>
                                                <th className="px-4 py-2 w-24">품목코드</th>
                                                <th className="px-4 py-2 w-full">품목명 (규격)</th>
                                                <th className="px-4 py-2 text-right w-24">기존 입고가</th>
                                                <th className="px-4 py-2 text-right w-24 text-indigo-600">새 입고가</th>
                                                <th className="px-4 py-2 text-right w-24">차액</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {analysis.list.map((item, i) => (
                                                <tr key={i} className={`hover:bg-slate-50 transition-colors ${item.isWarn ? 'bg-rose-50/30' : ''}`}>
                                                    <td className="px-4 py-2 text-center">
                                                        {item.상태 === 'up' && <span className="bg-rose-100 text-rose-600 px-1.5 py-0.5 rounded text-[10px] font-black">인상</span>}
                                                        {item.상태 === 'down' && <span className="bg-blue-100 text-blue-600 px-1.5 py-0.5 rounded text-[10px] font-black">인하</span>}
                                                        {item.상태 === 'new' && <span className="bg-emerald-100 text-emerald-600 px-1.5 py-0.5 rounded text-[10px] font-black">신규</span>}
                                                        {item.상태 === 'same' && <span className="text-slate-400 text-[10px] font-black">-</span>}
                                                    </td>
                                                    <td className="px-4 py-2 font-mono text-slate-500 text-[11px]">{item.코드}</td>
                                                    <td className={`px-4 py-2 font-bold truncate max-w-[200px] ${item.isWarn ? 'text-rose-700' : 'text-slate-800'}`}>
                                                        {item.isWarn && <i className="fas fa-exclamation-triangle text-rose-500 mr-1.5" title="오타/급등락 의심"></i>}
                                                        {item.품명} <span className="text-slate-400 font-normal ml-1 text-[11px]">{item.규격 && `(${item.규격})`}</span>
                                                    </td>
                                                    <td className="px-4 py-2 text-right text-slate-500">{item.기존단가 > 0 ? item.기존단가.toLocaleString() : '-'}</td>
                                                    <td className="px-4 py-2 text-right font-black text-indigo-600">{item.새단가 > 0 ? item.새단가.toLocaleString() : '-'}</td>
                                                    <td className="px-4 py-2 text-right font-bold">
                                                        {item.차액 > 0 && <span className="text-rose-500">+{item.차액.toLocaleString()}</span>}
                                                        {item.차액 < 0 && <span className="text-blue-500">{item.차액.toLocaleString()}</span>}
                                                        {item.차액 === 0 && <span className="text-slate-300">-</span>}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white p-4 border-t flex justify-between items-center shrink-0">
                            <div className="text-[11px] text-slate-500 font-bold"><i className="fas fa-info-circle mr-1"></i>수정할 내용이 있다면 닫기를 누르고 뒤쪽 테이블에서 숫자를 직접 수정하세요.</div>
                            <div className="flex gap-2">
                                <button onClick={onClose} className="px-5 py-2.5 bg-slate-100 border border-slate-200 text-slate-600 font-bold rounded-lg hover:bg-slate-200 transition-colors shadow-sm">닫기 (수정하러 가기)</button>
                                <button onClick={() => { onConfirm(); onClose(); }} className="px-6 py-2.5 bg-indigo-600 text-white font-black rounded-lg hover:bg-indigo-700 shadow-sm transition-colors flex items-center">
                                    <i className="fas fa-save mr-1.5 text-[14px]"></i> 저장 및 반영
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const config = useMerchConfig();
            const data = useMerchData();
            const ui = useMerchUI();

            const isEstimateUploaded = Object.keys(data.managedItems).length > 0;
            const isMasterEmpty = Object.keys(data.masterProducts).length === 0;

            const availableCatalogs = useMemo(() => {
                const counts = {};
                Object.values(data.masterProducts).forEach(m => {
                    const tagStr = m['카탈로그'] || '';
                    String(tagStr).split(',').forEach(t => {
                        const trimmed = t.trim();
                        if (trimmed) counts[trimmed] = (counts[trimmed] || 0) + 1;
                    });
                });
                return Object.keys(counts).sort().map(tag => ({ name: tag, count: counts[tag] }));
            }, [data.masterProducts]);

            const availableCategories = useMemo(() => {
                const counts = {};
                Object.values(data.masterProducts).forEach(m => {
                    const tagStr = m['견적서'] || m['카테고리'] || '';
                    String(tagStr).split(',').forEach(t => {
                        const trimmed = t.trim();
                        if (trimmed) counts[trimmed] = (counts[trimmed] || 0) + 1;
                    });
                });
                return Object.keys(counts).sort().map(tag => ({ name: tag, count: counts[tag] }));
            }, [data.masterProducts]);

            const fullDisplayRows = useMemo(() => {
                let baseList = [];
                
                if (isEstimateUploaded) {
                    baseList = Object.values(data.managedItems); 
                } else {
                    baseList = Object.values(data.masterProducts).map(m => data.managedItems[m.코드] || { 코드: m.코드, sources: {}, finalData: {} });
                }

                // 💡 [1원 단위 100% 검수] 실시간 가격 비교 필터링
                if (ui.priceFilter !== 'all') {
                    baseList = baseList.filter(item => {
                        const mItem = data.masterProducts[item.코드];
                        const oldP = mItem ? parseNum(mItem['입고가']) : 0;
                        const newP = parseNum(item.finalData?.['입고가'] !== undefined ? item.finalData['입고가'] : item.sources?.['estimate']?.['입고가']);
                        
                        if (!mItem) return ui.priceFilter === 'new'; // DB에 없으면 무조건 신규
                        if (oldP === 0 || newP === 0) return false;
                        if (ui.priceFilter === 'up' && newP > oldP) return true;
                        if (ui.priceFilter === 'down' && newP < oldP) return true;
                        return false;
                    });
                }

                if (ui.globalSearch) {
                    const cleanKeyword = ui.globalSearch.toLowerCase().replace(/[()[\]{},./]/g, ' ');
                    const tokens = cleanKeyword.split(/\s+/).filter(t => t.length > 0);
                    if (tokens.length > 0) {
                        baseList = baseList.map(item => {
                            const mItem = data.masterProducts[item.코드] || {};
                            const sourceItem = item.sources?.['estimate'] || {};
                            const finalItem = item.finalData || {};
                            const getVal = (key) => String(finalItem[key] !== undefined ? finalItem[key] : (sourceItem[key] !== undefined ? sourceItem[key] : (mItem[key] || ''))).toLowerCase();
                            
                            const cName = getVal('품목명'); 
                            const cSpec = getVal('규격');
                            const cVendor = getVal('구매처'); 
                            const cWh = getVal('창고');
                            const cCode = String(item.코드 || '').toLowerCase();
                            
                            let score = 0;
                            tokens.forEach(token => {
                                if (cName.includes(token)) score += 10;
                                else if (cCode.includes(token)) score += 8;
                                else if (cVendor.includes(token)) score += 6;
                                else if (cSpec.includes(token)) score += 5;
                                else if (cWh.includes(token)) score += 4;
                            });
                            return { ...item, _searchScore: score };
                        }).filter(r => r._searchScore > 0);
                        baseList.sort((a, b) => b._searchScore - a._searchScore);
                    }
                } else {
                    baseList.sort((a, b) => String(a.코드).localeCompare(String(b.코드)));
                }
                return baseList;
            }, [isEstimateUploaded, data.managedItems, data.masterProducts, ui.globalSearch, ui.priceFilter]);

            const customActions = useMerchActions(config, data, ui, fullDisplayRows);
            
            const appState = useMemo(() => ({
                config, data,
                activeTags: ui.activeTags, isEstimateUploaded, selectedRows: ui.selectedRows, globalSearch: ui.globalSearch, isProcessing: ui.isProcessing, processMsg: ui.processMsg,
                visibleMasterCols: config.visibleMasterCols, visibleUploadCols: config.visibleUploadCols, masterProducts: data.masterProducts, fullDisplayRows,
                priceFilter: ui.priceFilter
            }), [config, data, ui.activeTags, isEstimateUploaded, ui.selectedRows, ui.globalSearch, ui.isProcessing, ui.processMsg, config.visibleMasterCols, config.visibleUploadCols, data.masterProducts, fullDisplayRows, ui.priceFilter]);
            
            const appActions = useMemo(() => ({
                setShowReviewModal: ui.setShowReviewModal, setShowCategoryModal: ui.setShowCategoryModal,
                setSelectedRows: ui.setSelectedRows, setGlobalSearch: ui.setGlobalSearch, showToast: ui.showToast, setPriceFilter: ui.setPriceFilter,
                ...customActions
            }), [ui.setShowReviewModal, ui.setShowCategoryModal, ui.setSelectedRows, ui.setGlobalSearch, ui.showToast, ui.setPriceFilter, customActions]);

            useEffect(() => {
                const handleGlobalKeyDown = (e) => {
                    const isInput = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
                    
                    if (e.key === 'F7') {
                        e.preventDefault();
                        if (isInput) document.activeElement.blur();
                        if (!appState.isProcessing && appState.selectedRows.size > 0) {
                            appActions.setShowReviewModal(true);
                        } else if(appState.selectedRows.size === 0) {
                            appActions.showToast("⚠️ [F7] 반영할 항목을 먼저 선택해주세요.");
                        }
                    } else if (e.key === 'F8') {
                        e.preventDefault();
                        if (isInput) document.activeElement.blur();
                        if (!appState.isProcessing && appState.selectedRows.size > 0) {
                            appActions.handleCommitEstimate();
                            appActions.showToast("⏳ [F8] 데이터를 저장하고 리포트 화면으로 이동합니다...");
                            setTimeout(() => { window.open('trend_report.html', '_blank'); }, 1000);
                        } else if(appState.selectedRows.size === 0) {
                            appActions.showToast("⚠️ [F8] 반영할 항목을 먼저 선택해주세요.");
                        }
                    } else if (e.key === 'F9') {
                        e.preventDefault();
                        if (isInput) document.activeElement.blur();
                        if (!appState.isProcessing) appActions.handleExportAllSheets(); 
                    } else if (e.key === 'F10') {
                        e.preventDefault();
                        if (isInput) document.activeElement.blur();
                        if (!appState.isProcessing) appActions.handleImageExport();
                    }
                };

                window.addEventListener('keydown', handleGlobalKeyDown);
                return () => window.removeEventListener('keydown', handleGlobalKeyDown);
            }, [appState.isProcessing, appState.selectedRows.size, appActions]);

            return (
                <div className="h-screen w-full bg-slate-100 flex justify-center overflow-hidden font-sans">
                    <style>{`
                        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
                        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f1f5f9; overflow: hidden; }
                        ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
                        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
                        .fade-in { animation: fadeIn 0.3s ease-out; } @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
                    `}</style>
                    
                    {ui.alertMsg && (
                        <div className="fixed top-6 z-[999] bg-slate-800 text-white px-6 py-4 rounded-xl shadow-2xl flex items-start gap-3 fade-in text-sm font-bold border border-slate-700">
                            <i className="fas fa-exclamation-circle text-rose-400 text-lg mt-0.5"></i>
                            <span className="whitespace-pre-line leading-relaxed">{ui.alertMsg}</span>
                            <button onClick={() => ui.setAlertMsg('')} className="ml-4"><i className="fas fa-times text-slate-400 hover:text-white"></i></button>
                        </div>
                    )}
                    {ui.toastMsg && (
                        <div className="fixed bottom-6 right-6 z-[1000] bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 fade-in text-sm font-bold border border-slate-700">
                            <i className="fas fa-check-circle text-emerald-400"></i>{ui.toastMsg}
                        </div>
                    )}

                    <div className="w-full max-w-[1500px] h-full flex flex-col bg-slate-50 shadow-2xl overflow-hidden mx-auto">
                        <div className="shrink-0 flex flex-col bg-white border-b border-slate-200 z-40">
                            <div className="p-5 pb-0 pt-6">
                                <div className="bg-[#0f172a] rounded-xl shadow-lg border border-slate-800 flex flex-col overflow-hidden">
                                    <div className="px-5 py-3 flex justify-between items-center border-b border-slate-800/80 bg-[#0b1120] gap-4">
                                        <div className="flex items-center group shrink-0">
                                            <span className="text-xl font-black text-emerald-400 mr-3">ONEAPP</span>
                                            <div className="flex flex-col border-l-2 border-slate-700 pl-3">
                                                <div className="flex items-center mb-0.5">
                                                    <span className="text-[14px] font-black text-slate-200 leading-none">MerchOps</span>
                                                    <span className="ml-2 bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 px-1.5 py-0.5 rounded text-[9px] font-bold leading-none tracking-wider">v3.1.0 Micro-Frontend</span>
                                                </div>
                                                <span className="text-[9px] font-extrabold text-slate-400 tracking-widest uppercase mt-0.5">MAIN WORKSPACE</span>
                                            </div>
                                        </div>
                                        
                                        <SystemConsole itemCount={Object.keys(data.masterProducts).length} isProcessing={ui.isProcessing} processMsg={ui.processMsg} estimateCount={Object.keys(data.managedItems).length} activeTags={ui.activeTags} />
                                        
                                        <nav className="flex gap-1.5 text-[14px] shrink-0 items-center">
                                            <a href="guide.html" target="NEXUS_GUIDE" rel="noopener noreferrer" className={`h-8 px-2.5 rounded flex items-center justify-center shadow-sm transition-all duration-300 border text-emerald-400 bg-[#0f172a] border-slate-700 hover:bg-[#1e293b] hover:text-emerald-300 hover:border-emerald-500/50 font-bold text-[11px] tracking-wider uppercase ${ui.isProcessing ? 'opacity-40 pointer-events-none' : ''}`} title="MerchOps 사용 가이드">
                                                GUIDE
                                            </a>
                                            <a href="trend_report.html" target="NEXUS_REPORT" rel="noopener noreferrer" className={`h-8 px-2.5 rounded flex items-center justify-center shadow-sm transition-all duration-300 border text-blue-400 bg-[#0f172a] border-slate-700 hover:bg-[#1e293b] hover:text-blue-300 hover:border-blue-500/50 font-bold text-[11px] tracking-wider uppercase ${ui.isProcessing ? 'opacity-40 pointer-events-none' : ''}`} title="트렌드 리포트">
                                                REPORT
                                            </a>
                                            <div className="w-px h-4 bg-slate-700 mx-0.5"></div>
                                            
                                            <button onClick={() => customActions.handleCloudSync('download')} className={`w-8 h-8 rounded flex items-center justify-center shadow-sm transition-all duration-300 border text-slate-300 bg-[#0f172a] border-slate-700 hover:bg-[#1e293b] hover:text-white hover:border-slate-500 ${ui.isProcessing ? 'opacity-40 pointer-events-none' : ''}`} title="클라우드 데이터 불러오기"><i className="fas fa-cloud-download-alt text-[13px]"></i></button>
                                            <button onClick={() => customActions.handleCloudSync('upload')} className={`w-8 h-8 rounded flex items-center justify-center shadow-sm transition-all duration-300 border text-slate-300 bg-[#0f172a] border-slate-700 hover:bg-[#1e293b] hover:text-white hover:border-slate-500 ${ui.isProcessing ? 'opacity-40 pointer-events-none' : ''}`} title="클라우드에 데이터 백업"><i className="fas fa-cloud-upload-alt text-[13px]"></i></button>
                                            <div className="w-px h-4 bg-slate-700 mx-0.5"></div>
                                            
                                            {/* 💡 설정 모달 및 히스토리 뷰어는 단일 창(Micro-Frontend)으로 열립니다. */}
                                            <button onClick={() => window.open('history_viewer.html', 'NEXUS_HISTORY')} className={`w-8 h-8 rounded flex items-center justify-center shadow-sm transition-all duration-300 border text-amber-300 bg-[#0f172a] border-slate-700 hover:bg-[#1e293b] hover:text-amber-400 hover:border-amber-500/50 ${ui.isProcessing ? 'opacity-40 pointer-events-none' : ''}`} title="작업 히스토리 보기"><i className="fas fa-history text-[13px]"></i></button>
                                            <button onClick={() => window.open('settings.html', 'NEXUS_SETTINGS')} className={`w-8 h-8 rounded flex items-center justify-center shadow-sm transition-all duration-300 border text-slate-400 bg-[#0f172a] border-slate-700 hover:bg-[#1e293b] hover:text-white hover:border-slate-500 ${ui.isProcessing ? 'opacity-40 pointer-events-none' : ''}`} title="환경설정"><i className="fas fa-cogs opacity-80 text-[13px]"></i></button>
                                        </nav>
                                    </div>
                                </div>
                            </div>
                            <MainToolbar state={appState} actions={appActions} availableCatalogs={availableCatalogs} availableCategories={availableCategories} />
                        </div>

                        <div className="flex-1 overflow-auto p-5 pt-0 bg-slate-100">
                            {isMasterEmpty ? (
                                <WelcomeGuide onUpload={(e) => customActions.handleFileUpload(e, 'master')} onCloudSync={customActions.handleCloudSync} />
                            ) : (
                                <ExcelDataGrid state={appState} actions={appActions} />
                            )}
                        </div>
                    </div>
                    {ui.showCategoryModal && <CategorySaveModal onClose={() => ui.setShowCategoryModal(false)} onSave={customActions.handleSaveAsCategory} />}
                    {ui.showReviewModal && <ReviewModal onClose={() => ui.setShowReviewModal(false)} onConfirm={customActions.handleCommitEstimate} state={appState} data={data} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
